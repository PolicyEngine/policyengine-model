name: Refresh metadata

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Fetch metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-metadata.js

      - name: Commit and push if changed
        run: |
          git config user.name  "policyengine-bot"
          git config user.email "bot@policyengine.org"
          git add public/metadata-*.json public/param-tree-*.json
          if git diff --cached --quiet; then
            echo "No metadata changes."
          else
            git commit -m "Refresh metadata snapshot"
            git push
          fi
