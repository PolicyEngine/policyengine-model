name: Refresh registry

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger a fresh registry build
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK is not configured; skipping registry refresh."
            exit 0
          fi

          curl --fail --silent --show-error --max-time 60 \
            --request POST "$VERCEL_DEPLOY_HOOK" --output /dev/null
