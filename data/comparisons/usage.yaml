# Usage signal for each model.
#
# Most counts are 'unknown' for incumbents because they don't publish API
# metrics or user counts. Where a public-facing surface exists (e.g. a TPC
# distributional table page, an ATTIS report series), prefer to note that in
# `notes` rather than fabricate a count.

usage:
  - model: policyengine-us
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      Tracked via policyengine.org analytics and api.policyengine.org logs;
      public dashboards not yet published. Major US press cites include
      coverage of OBBBA, the 2024 election analyses, and CTC reform impact
      tables. Pending: aggregate numbers from internal analytics.
    sources:
      - label: PolicyEngine in the news
        url: https://policyengine.org/us/research

  - model: trim3
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      TRIM3 results underpin recurring HHS/ASPE reports on the Welfare Indicators,
      poverty take-up estimates, and program participation. Census's Supplemental
      Poverty Measure imputations are sometimes cross-checked against TRIM3.
      Public-facing usage outside ASPE-funded work is limited.
    sources:
      - label: ASPE Welfare Indicators Annual Report
        url: https://aspe.hhs.gov/topics/poverty-economic-mobility/welfare-indicators-annual-report

  - model: attis
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      Urban's State of the Safety Net series of briefs draws on ATTIS;
      sub-state analyses for individual cities and counties are commissioned
      by funders. No public usage metrics.
    sources:
      - label: State of the Safety Net
        url: https://www.urban.org/projects/state-safety-net

  - model: tpc-microsim
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      TPC distributional tables are the most-cited reference for revenue and
      distributional estimates of US tax reform proposals, appearing
      routinely in major US press, congressional staff materials, and academic
      papers. Per-call usage is not published.
    sources:
      - label: TPC distributional tables
        url: https://www.taxpolicycenter.org/model-estimates

  - model: jct-microsim
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      JCT estimates are the official Congressional score for tax
      legislation — used in every CBO cost estimate of tax bills and
      cited in essentially all major federal tax reform coverage. No
      external-user metrics.
    sources:
      - label: JCT publications archive
        url: https://www.jct.gov/publications/

  - model: cbo-microsim
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      CBO baseline projections and distributional analyses are the
      authoritative federal benchmark. Used in essentially every
      Congressional cost estimate and most academic papers analyzing US
      fiscal policy.
    sources:
      - label: CBO publications archive
        url: https://www.cbo.gov/publications

  - model: itep-microsim
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      ITEP's Who Pays? report is widely cited in state tax policy
      debates and press coverage of state-level progressivity.
    sources:
      - label: ITEP press coverage page
        url: https://itep.org/category/press/

  - model: tax-calculator
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      Tax-Calculator powers several derived tools (Tax-Brain, OG-USA) and
      is used in academic research where reproducibility matters.
    sources:
      - label: PSL Tax-Brain web app (built on Tax-Calculator)
        url: https://www.ospc.org

  - model: budgetlab-tax
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      Newly launched (2024); growing citation footprint in 2025 OBBBA
      coverage and Brookings/Hamilton Project policy debates.
    sources:
      - label: Budget Lab research catalogue
        url: https://budgetlab.yale.edu/research

  - model: policyengine-uk
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      Tracked via policyengine.org analytics and api.policyengine.org
      logs; public dashboards not yet published. UK press cites include
      coverage around Autumn Budget 2024 (Universal Credit, Income Tax
      threshold freeze) and Nuffield Foundation-funded analyses.
    sources:
      - label: PolicyEngine UK research catalogue
        url: https://policyengine.org/uk/research

  - model: ukmod
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      Used in academic research (CeMPA working paper series, IJM
      special issues) and by third-sector analysts (e.g. Joseph
      Rowntree Foundation, Resolution Foundation). UKMOD is the UK
      microsim of choice for cross-country EUROMOD studies. CeMPA does
      not publish download counts; usage footprint is observable
      through working-paper citations and country reports.
    sources:
      - label: International Journal of Microsimulation — UKMOD
          applications
        url: https://microsimulation.pub/index.php/IJM
      - label: CeMPA UKMOD working papers
        url: https://www.microsimulation.ac.uk/publications/working-papers

  - model: ifs-taxben
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      TAXBEN is the engine behind IFS Green Budget chapters and most
      IFS Budget-response briefings; estimates are routinely cited in
      UK national press (BBC, FT, Guardian, Times) and in
      parliamentary debate. Per-call usage is not published; citation
      footprint visible through IFS publications search.
    sources:
      - label: IFS in the media
        url: https://ifs.org.uk/news-and-media
      - label: IFS publications search (TAXBEN-tagged outputs)
        url: https://ifs.org.uk/publications

  - model: igotm
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      IGOTM's outputs are the Treasury's official distributional
      analysis at each fiscal event and are routinely referenced in UK
      press coverage of Budgets. Inter-departmental use across HMT,
      HMRC, and DWP; not externally accessible. No external-user
      metrics.
    sources:
      - label: HM Treasury Budget archive (IGOTM-based Impact on
          Households annexes)
        url: https://www.gov.uk/government/collections/budget

  - model: columbia-cpsp
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      CPSP's monthly Child Tax Credit poverty trackers (2021-2022) were
      among the most widely cited research outputs on the ARPA-expanded
      CTC, appearing across major US press (NYT, WaPo, NPR, Vox) and
      Congressional testimony. The National Academies child-poverty
      roadmap is the canonical reference for child-poverty reform
      microsimulation and uses CPSP alongside TRIM3. No external-user
      metrics published.
    sources:
      - label: National Academies — Roadmap to Reducing Child Poverty
          (uses CPSP simulations)
        url: https://nap.nationalacademies.org/catalog/25246
      - label: CPSP publications
        url: https://www.povertycenter.columbia.edu

  - model: benefits-data-trust
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      BDT publishes annual impact reports describing applicants served
      and benefits secured; comparable academic-citation or
      press-mention counts are not maintained here.
    sources:
      - label: Benefits Data Trust — homepage
        url: https://bdtrust.org/
      - label: Benefits Data Trust — what we do
        url: https://bdtrust.org/what-we-do/

  - model: benefit-kitchen
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      BenefitKitchen does not publish usage metrics. The product is
      consumed both directly by households via the free app and by
      partner organizations through a paid API tier.
    sources:
      - label: BenefitKitchen — homepage
        url: https://benefitkitchen.com/
      - label: BenefitKitchen — about
        url: https://benefitkitchen.com/about

  - model: benefits-cliffs
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      BenefitsCliffs.com is paywalled; usage metrics are not published.
      Georgia Center for Opportunity cites benefit-cliff analyses in
      its state policy briefs.
    sources:
      - label: BenefitsCliffs.com — homepage
        url: https://benefitscliffs.com/
      - label: Georgia Center for Opportunity — benefits cliff page
        url: https://georgiaopportunity.org/the-benefits-cliff/

  - model: snap-screener
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      Usage metrics are not published. The free consumer-facing
      screener and the paid API tier are both in active use; no
      external dashboard.
    sources:
      - label: SNAP Screener — homepage
        url: https://www.snapscreener.com/
      - label: Medicaid Screener — homepage
        url: https://www.medicaidscreener.com/

  - model: mrelief
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      mRelief publishes outreach impact summaries on its site but no
      structured usage metrics suitable for a comparison row.
    sources:
      - label: mRelief — homepage
        url: https://www.mrelief.com/
      - label: mRelief — about
        url: https://www.mrelief.com/about

  - model: atlanta-fed-prd
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      The Policy Rules Database powers the Atlanta Fed CLIFF tool
      suite and is referenced in community-development research; no
      structured usage metrics are published.
    sources:
      - label: Atlanta Fed — Policy Rules Database project page
        url: https://www.atlantafed.org/economic-mobility-and-resilience/advancing-careers-for-low-income-families/policy-rules-database
      - label: Atlanta Fed — CLIFF tool suite
        url: https://www.atlantafed.org/economic-mobility-and-resilience/advancing-careers-for-low-income-families/cliff-tools

  - model: nber-taxsim
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      TAXSIM is the longest-running US tax calculator in continuous
      academic use; the Feenberg & Coutts (1993) reference paper has
      been cited by more than a thousand subsequent papers per NBER.
      Used by the Columbia CPSP poverty microsim and many other
      academic projects as the tax-computation backend. Per-call
      usage is not published.
    sources:
      - label: NBER TAXSIM home page
        url: https://taxsim.nber.org/
      - label: NBER TAXSIM data product page
        url: https://www.nber.org/research/data/taxsim
      - label: PolicyEngine-NBER MoU announcement
        url: https://www.policyengine.org/us/research/policyengine-nber-mou-taxsim

  - model: tf-microsim
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      Tax Foundation TAG/General Equilibrium scoring tables appear in
      major US press coverage of federal tax legislation. Used by
      Congressional staff materials and cited in policy debate
      coverage (TCJA, OBBBA, tariffs). Per-call usage is not
      published.
    sources:
      - label: Tax Foundation model estimates archive
        url: https://taxfoundation.org/research/all/federal/general-equilibrium-model/
      - label: PolitiFact profile of Tax Foundation (press coverage
          and fact-check references)
        url: https://www.politifact.com/personalities/tax-foundation/

  - model: pwbm
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      PWBM's 2024 election analyses of Trump and Harris campaign
      proposals were widely cited in major US press (NYT, WSJ,
      Politico, Daily Pennsylvanian) and Congressional debate. The
      Real-time Federal Budget Tracker, Tariff Simulator, and Public
      Use File provide public-facing surfaces, but per-call usage
      and visitor metrics are not published.
    sources:
      - label: PWBM research catalogue (working papers and analyses)
        url: https://budgetmodel.wharton.upenn.edu/working-papers
      - label: Daily Pennsylvanian — PWBM in the 2024 election
        url: https://www.thedp.com/article/2024/10/penn-wharton-budget-model-2024-presidential-election

  - model: tax-foundation-tg
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      TAG-branded Tax Foundation scoring tables appear in major US
      press coverage of federal tax legislation (TCJA, OBBBA,
      tariffs, presidential campaign proposals). The Taxes and
      Growth label is used in Tax Foundation publications
      interchangeably with the General Equilibrium label
      (tf-microsim). Per-call usage is not published.
    sources:
      - label: Tax Foundation TAG topic archive
        url: https://taxfoundation.org/tags/taxes-and-growth-tag-model-overview-methodology/
      - label: Tax Foundation — Modeling the Economic Effects of Past
          Tax Bills
        url: https://taxfoundation.org/research/all/federal/modeling-economic-effects-past-tax-bills/

  - model: dwp-psm
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      PSM underlies DWP-led official statistics (Income-related benefits
      take-up estimates, Households Below Average Income projections,
      child poverty projections to FYE 2030) and impact assessments
      across DWP policy areas. The model is also accessed by HM
      Treasury, HMRC, the Scottish Government, OBR and Northern Ireland
      Executive analysts under information-sharing arrangements. No
      external-user metrics are published.
    sources:
      - label: DWP — Income-related benefits estimates of take-up
        url: https://www.gov.uk/government/statistics/income-related-benefits-estimates-of-take-up-financial-year-ending-2024
      - label: DWP — Spring statement social security changes updated
          impact on poverty levels (PSM-based)
        url: https://www.gov.uk/government/publications/spring-statement-social-security-changes-updated-impact-on-poverty-levels-in-great-britain-july-2025/spring-statement-social-security-changes-updated-impact-on-poverty-levels-in-great-britain-july-2025
      - label: DWP — Benefit uprating estimated number and type of GB
          families benefiting (annual PSM-based statistics)
        url: https://www.gov.uk/government/statistics/benefit-uprating-estimated-number-and-type-of-families-and-individuals-in-families-benefitting-from-the-uprating-of-benefits-in-2025-to-2026/estimated-number-and-type-of-gb-families-and-individuals-in-families-benefitting-from-the-uprating-of-benefits-in-2025-to-2026-and-the-fair-repayment

  - model: ippr-tax-benefit
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      Used by IPPR, Resolution Foundation, Joseph Rowntree Foundation,
      New Economics Foundation, and the Legatum Institute for policy
      research and Budget responses. IPPR routinely briefs UK national
      press (Guardian, FT, BBC, Times) on tax and benefit reform
      proposals. Per-call usage and license counts are not published.
    sources:
      - label: MMU PERU — Modelling the tax and benefit system (lists
          partner organisations)
        url: https://mmuperu.co.uk/blog/projects/modelling-the-effects-of-the-tax-and-benefit-system/
      - label: IPPR media office (recent model-based releases)
        url: https://www.ippr.org/media-office

  - model: landman-economics
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      Notable commissioned uses include the EHRC cumulative impact of
      tax and welfare reforms (England, Wales, Scotland), the Scottish
      Government's tackling-child-poverty delivery plan, Women's Budget
      Group analyses, and Social Mobility and Child Poverty Commission
      work. Reed and Portes (2018) is the canonical EHRC application.
      No public per-call or organisation-user metrics.
    sources:
      - label: EHRC — Cumulative impact reading list (Landman Economics
          TTM applications)
        url: https://www.equalityhumanrights.com/en/our-research/reading-lists/welfare-reform-reading-list
      - label: Scottish Government — Tackling child poverty methodology
          appendix (commissioned application)
        url: https://www.gov.scot/publications/tackling-child-poverty-delivery-plan-forecasting-child-poverty-scotland/pages/8/

  - model: entitledto
    academicCitations: unknown
    governmentReports: unknown
    pressMentions: unknown
    monthlyActiveUsers: unknown
    monthlyComputations: unknown
    organizationUsers: unknown
    notes: >
      Used directly by claimants on the free public calculator and by
      advisers, local authorities, housing associations, and welfare-to-
      work providers via the paid product. EntitledTo states that its
      organisational clients collectively calculated £11.8 billion in
      benefits for service users in 2023/24. Recommended on GOV.UK
      alongside Turn2us and Policy in Practice.
    sources:
      - label: EntitledTo for organisations
        url: https://www.entitledto.co.uk/organisations
      - label: GOV.UK — Benefits calculators (listed as recommended)
        url: https://www.gov.uk/benefits-calculators
      - label: ERSA — EntitledTo Better Off Calculator (welfare-to-work
          adviser-network use)
        url: https://ersa.org.uk/entitledto/
