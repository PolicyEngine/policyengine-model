# Behavioral parameters and reverse-engineering assumptions.
#
# Use one row per public behavioral parameter, choice model, incidence
# assumption, or explicit "not modeled / undisclosed / unknown" fact. Numeric
# rows are scalar or range-like; qualitative rows capture public model
# mechanics that are not published as a single elasticity.

behavioralParameters:
  # ============================ PolicyEngine US ===============================
  - model: policyengine-us
    domain: labor-supply
    kind: elasticity
    parameter: labor_supply_income_effect_response
    label: Income-effect labor supply response
    status: not-modeled
    value: 0
    unit: elasticity
    population: all earners
    margin: income effect
    horizon: static default
    notes: PolicyEngine US is static by default on this margin; unless users explicitly change the labor-supply response settings, the income-effect response is zero. CBO values shown in this app are presets/explainer values, not model defaults.
    sources:
      - label: policyengine-us labor-supply income-effect setting
        url: https://github.com/PolicyEngine/policyengine-us/blob/main/policyengine_us/parameters/gov/simulation/labor_supply_responses/elasticities/income.yaml
        kind: self

  - model: policyengine-us
    domain: labor-supply
    kind: elasticity
    parameter: labor_supply_substitution_effect_response
    label: Substitution-effect labor supply response
    status: not-modeled
    value: 0
    unit: elasticity
    population: all earners and deciles
    margin: substitution effect
    horizon: static default
    notes: PolicyEngine US is static by default on this margin; the all-earner substitution response and position/decile-specific fallback responses are zero unless explicitly changed.
    sources:
      - label: policyengine-us labor-supply substitution-effect setting
        url: https://github.com/PolicyEngine/policyengine-us/blob/main/policyengine_us/parameters/gov/simulation/labor_supply_responses/elasticities/substitution.yaml
        kind: self

  - model: policyengine-us
    domain: capital-gains
    kind: elasticity
    parameter: capital_gains_realization_response
    label: Capital-gains realization response
    status: not-modeled
    value: 0
    unit: elasticity
    population: capital-gains realizers
    margin: realization timing and avoidance
    horizon: static default
    notes: PolicyEngine US is static by default on this margin; capital-gains realizations do not respond unless users explicitly change the response setting.
    sources:
      - label: policyengine-us capital-gains response setting
        url: https://github.com/PolicyEngine/policyengine-us/blob/main/policyengine_us/parameters/gov/simulation/capital_gains_responses/elasticity.yaml
        kind: self

  - model: policyengine-us
    domain: take-up
    kind: take-up-model
    parameter: enhanced_cps_take_up_priors
    label: Enhanced CPS take-up and claiming priors
    status: qualitative
    value: unknown
    population: Enhanced CPS tax units, SPM units, and people
    policyScope: SNAP, ACA/PTC, Medicaid, TANF, SSI, EITC, WIC, Head Start, DC PTC, voluntary filing
    margin: program take-up and claiming gates
    functionalForm: Seeded random draws from external take-up or claiming-rate tables; selected programs preserve reported-recipient anchors.
    notes: These are input-data priors, not endogenous behavioral elasticities. Final population-level take-up-sensitive totals are governed by calibration and reweighting where targets are available.
    sources:
      - label: policyengine-us-data CPS take-up assignment
        url: https://github.com/PolicyEngine/policyengine-us-data/blob/main/policyengine_us_data/datasets/cps/cps.py
        kind: self
      - label: policyengine-us-data take-up parameters
        url: https://github.com/PolicyEngine/policyengine-us-data/tree/main/policyengine_us_data/parameters/take_up
        kind: self
      - label: policyengine-us-data take-up target mapping
        url: https://github.com/PolicyEngine/policyengine-us-data/blob/main/policyengine_us_data/utils/takeup.py
        kind: self

  # ============================ TRIM3 / Urban ================================
  - model: trim3
    domain: take-up
    kind: take-up-model
    parameter: snap_participation_assignment
    label: SNAP participation assignment
    status: qualitative
    value: unknown
    population: SNAP-eligible units
    policyScope: means-tested transfers
    margin: program take-up
    functionalForm: Eligible units are selected into participation so simulated caseloads align to administrative totals.
    sources:
      - label: TRIM3 SNAP methodology
        url: https://boreas.urban.org/documentation/foodstamps/main.php
        kind: self

  - model: trim3
    domain: take-up
    kind: take-up-model
    parameter: medicaid_enrollment_logit
    label: Medicaid/CHIP alternative-run enrollment logit
    status: qualitative
    value: unknown
    population: Medicaid/CHIP eligible people
    policyScope: Medicaid and CHIP
    margin: program take-up
    functionalForm: Alternative runs use a logit equation to assign enrollment probabilities for people not eligible in baseline.
    sources:
      - label: TRIM3 Medicaid/SCHIP documentation
        url: https://boreas.urban.org/documentation/Medicaid/Main.php
        kind: self

  - model: attis
    domain: take-up
    kind: take-up-model
    parameter: safety_net_participation
    label: ACS-based eligibility and participation modeling
    status: qualitative
    value: unknown
    population: ACS households
    policyScope: safety-net programs
    margin: program eligibility and participation
    notes: Public documentation describes participation modeling but not a reusable numeric elasticity table.
    sources:
      - label: ATTIS overview
        url: https://www.urban.org/research-methods/attis-microsimulation-model
        kind: self

  - model: hipsm
    domain: health-insurance
    kind: choice-model
    parameter: coverage_choice_elasticity_expected_utility
    label: Health insurance coverage choice
    status: documented-undisclosed
    value: unknown
    population: nonelderly people, families, and employers
    policyScope: health insurance coverage and premiums
    margin: coverage enrollment and employer offer behavior
    functionalForm: Expected-utility choice model with latent preference terms calibrated to elasticity targets from the literature.
    notes: Urban documents the behavioral structure but not the full numeric elasticity target table.
    sources:
      - label: Urban Institute HIPSM overview
        url: https://www.urban.org/research/data-methods/data-analysis/quantitative-data-analysis/microsimulation/health-insurance-policy-simulation-model-hipsm
        kind: self

  - model: dynasim
    domain: retirement
    kind: choice-model
    parameter: dynamic_transition_equations
    label: Dynamic labor, retirement, family, and health transitions
    status: qualitative
    value: unknown
    population: simulated US population over 75 years
    policyScope: retirement, aging, taxes, health, and income supports
    margin: demographic and economic transitions
    functionalForm: Reduced-form transition equations simulate labor force participation, earnings, disability, retirement, family events, health, and wealth.
    notes: Public overviews document equations and modules; this row does not assert a single transferable elasticity.
    sources:
      - label: Urban Institute DYNASIM overview
        url: https://www.urban.org/research/publication/dynamic-simulation-income-model-dynasim-overview
        kind: self

  # ============================ Tax Policy Center / JCT / CBO ===============
  - model: tpc-microsim
    domain: taxable-income
    kind: elasticity
    parameter: eti_top_0_1_percent
    label: ETI for top 0.1 percent
    status: numeric
    value: 0.25
    unit: percent taxable income per 1 percent net-of-tax rate
    population: top 0.1 percent of income distribution
    policyScope: revenue estimates
    margin: taxable income response
    horizon: budget window
    notes: TPC lowers this to 0.2 in TCJA-effect years because of base broadening.
    sources:
      - label: TPC microsimulation model FAQ
        url: https://taxpolicycenter.org/resources/tax-model-resources/tpcs-microsimulation-model-faq
        kind: self

  - model: tpc-microsim
    domain: taxable-income
    kind: elasticity
    parameter: eti_top_0_1_percent_tcja
    label: ETI for top 0.1 percent under TCJA base broadening
    status: numeric
    value: 0.2
    unit: percent taxable income per 1 percent net-of-tax rate
    population: top 0.1 percent of income distribution
    policyScope: revenue estimates in TCJA-effect years
    margin: taxable income response
    horizon: budget window
    sources:
      - label: TPC microsimulation model FAQ
        url: https://taxpolicycenter.org/resources/tax-model-resources/tpcs-microsimulation-model-faq
        kind: self

  - model: tpc-microsim
    domain: capital-gains
    kind: elasticity
    parameter: capital_gains_realization_long_run
    label: Long-run capital-gains realization elasticity
    status: numeric
    value: -0.7
    unit: percent realizations per 1 percent marginal tax rate
    population: long-term capital-gains realizers
    policyScope: revenue estimates
    margin: realization timing and avoidance
    horizon: long-run
    notes: Approximate value at a 20 percent capital-gains tax rate.
    sources:
      - label: TPC microsimulation model FAQ
        url: https://taxpolicycenter.org/resources/tax-model-resources/tpcs-microsimulation-model-faq
        kind: self

  - model: tpc-microsim
    domain: capital-gains
    kind: elasticity
    parameter: capital_gains_realization_short_run
    label: Short-run capital-gains realization elasticity
    status: numeric
    value: -1.1
    unit: percent realizations per 1 percent marginal tax rate
    population: long-term capital-gains realizers
    policyScope: revenue estimates
    margin: first two years after rate change
    horizon: short-run
    notes: Approximate value at a 20 percent capital-gains tax rate.
    sources:
      - label: TPC microsimulation model FAQ
        url: https://taxpolicycenter.org/resources/tax-model-resources/tpcs-microsimulation-model-faq
        kind: self

  - model: tpc-microsim
    domain: tax-incidence
    kind: incidence-assumption
    parameter: individual_income_tax_incidence
    label: Individual income tax borne by income taxpayers
    status: numeric
    value: 1
    unit: share of tax burden
    population: individual income taxpayers
    policyScope: distribution tables
    margin: statutory liability incidence
    horizon: conventional distributional analysis
    notes: TPC distributes the individual income tax directly to individual income taxpayers.
    sources: &tpc_incidence_sources
      - label: TPC microsimulation model FAQ
        url: https://taxpolicycenter.org/resources/tax-model-resources/tpcs-microsimulation-model-faq
        kind: self

  - model: tpc-microsim
    domain: tax-incidence
    kind: incidence-assumption
    parameter: payroll_tax_employee_incidence
    label: Employee and employer payroll tax borne by employees
    status: numeric
    value: 1
    unit: share of employee-plus-employer payroll tax burden
    population: employees
    policyScope: distribution tables
    margin: wage incidence
    horizon: conventional distributional analysis
    notes: Employer-side payroll taxes are assigned to employees, consistent with a lower-wage incidence assumption.
    sources: *tpc_incidence_sources

  - model: tpc-microsim
    domain: tax-incidence
    kind: incidence-assumption
    parameter: estate_tax_decedent_incidence
    label: Estate tax borne by decedents
    status: numeric
    value: 1
    unit: share of estate tax burden
    population: decedents
    policyScope: distribution tables
    margin: estate-tax incidence
    horizon: conventional distributional analysis
    sources: *tpc_incidence_sources

  - model: tpc-microsim
    domain: tax-incidence
    kind: incidence-assumption
    parameter: corporate_income_tax_shareholder_incidence
    label: Corporate income tax borne by corporate shareholders
    status: numeric
    value: 0.6
    unit: share of corporate income tax burden
    population: corporate shareholders
    policyScope: distribution tables
    margin: corporate-tax incidence
    horizon: conventional distributional analysis
    functionalForm: Assigned in proportion to reported dividends and the corporate-equity share of capital gains.
    sources: *tpc_incidence_sources

  - model: tpc-microsim
    domain: tax-incidence
    kind: incidence-assumption
    parameter: corporate_income_tax_all_capital_incidence
    label: Corporate income tax borne by all capital owners
    status: numeric
    value: 0.2
    unit: share of corporate income tax burden
    population: all capital owners
    policyScope: distribution tables
    margin: corporate-tax incidence
    horizon: conventional distributional analysis
    functionalForm: Assigned in proportion to capital income, including interest, dividends, capital gains, part of flow-through business income, and retirement-account investment returns.
    sources: *tpc_incidence_sources

  - model: tpc-microsim
    domain: tax-incidence
    kind: incidence-assumption
    parameter: corporate_income_tax_labor_incidence
    label: Corporate income tax borne by labor
    status: numeric
    value: 0.2
    unit: share of corporate income tax burden
    population: workers
    policyScope: distribution tables
    margin: corporate-tax incidence
    horizon: conventional distributional analysis
    functionalForm: Assigned in proportion to earnings.
    sources: *tpc_incidence_sources

  - model: tpc-microsim
    domain: tax-incidence
    kind: incidence-assumption
    parameter: excise_tax_burdened_income_and_consumption
    label: Excise-tax incidence through burdened income and consumption
    status: qualitative
    value: unknown
    population: tax units consuming taxed goods and receiving burdened income
    policyScope: distribution tables
    margin: excise-tax incidence
    horizon: conventional distributional analysis
    functionalForm: Excise taxes lower real incomes in proportion to labor income, above-normal capital income, and wage-indexed cash transfers, then are assigned to tax units using CEX-imputed consumption.
    sources: *tpc_incidence_sources

  - model: tpc-microsim
    domain: health-insurance
    kind: incidence-assumption
    parameter: aca_employer_mandate_employee_incidence
    label: ACA employer mandate borne by affected employees
    status: numeric
    value: 1
    unit: share of employer-mandate burden
    population: employees of firms offering inadequate health insurance coverage
    policyScope: distribution tables
    margin: health-insurance mandate incidence
    horizon: conventional distributional analysis
    sources: *tpc_incidence_sources

  - model: tpc-microsim
    domain: taxable-income
    kind: functional-form
    parameter: distribution_tables_static_behavior
    label: Distribution tables exclude behavioral responses
    status: not-modeled
    value: 0
    unit: behavioral response in distribution tables
    population: tax units
    policyScope: distribution tables
    margin: revenue-estimate behavior versus distributional burden
    horizon: conventional distributional analysis
    notes: TPC revenue estimates generally include taxable-income and capital-gains behavioral responses, but distribution tables conventionally distribute static tax changes, allowing tax-form behavior such as itemizers switching to the standard deduction.
    sources: *tpc_incidence_sources

  - model: jct-microsim
    domain: taxable-income
    kind: elasticity
    parameter: conventional_revenue_behavioral_effects
    label: Behavioral effects in conventional revenue estimates
    status: documented-undisclosed
    value: unknown
    population: taxpayers affected by proposal
    policyScope: conventional revenue estimates
    margin: timing, entity-form, portfolio, consumption, labor supply, and tax planning responses
    notes: JCT documents behavioral response categories but does not publish a current reusable elasticity table.
    sources:
      - label: JCT revenue estimating overview
        url: https://www.jct.gov/operations/revenue-estimating/
        kind: government
      - label: TPC comparison to JCT behavioral assumptions
        url: https://taxpolicycenter.org/resources/tax-model-resources/tpcs-microsimulation-model-faq
        kind: self

  - model: jct-microsim
    domain: capital-gains
    kind: elasticity
    parameter: capital_gains_realization_current
    label: Current capital-gains realization assumptions
    status: documented-undisclosed
    value: unknown
    population: capital-gains realizers
    policyScope: revenue estimates
    margin: realization timing and avoidance
    notes: TPC states JCT has not published the specific taxable-income or capital-gains elasticities it now uses.
    sources:
      - label: TPC microsimulation model FAQ
        url: https://taxpolicycenter.org/resources/tax-model-resources/tpcs-microsimulation-model-faq
        kind: self
      - label: JCT revenue estimating overview
        url: https://www.jct.gov/operations/revenue-estimating/
        kind: government

  - model: cbo-microsim
    domain: labor-supply
    kind: elasticity
    parameter: frisch_labor_supply_lifecycle_growth
    label: Frisch labor-supply elasticity in CBO life-cycle growth model
    status: numeric
    lower: 0.27
    central: 0.4
    upper: 0.53
    unit: percent labor supply per 1 percent temporary after-tax compensation
    population: aggregate labor supply
    policyScope: CBO dynamic fiscal-policy analysis
    margin: intertemporal substitution
    horizon: life-cycle growth model
    notes: This is CBO's life-cycle growth model parameter, not a public tax-microsim parameter file.
    sources:
      - label: CBO review of Frisch labor supply elasticity
        url: https://ecommons.cornell.edu/entities/publication/dea875a9-9eed-4812-b6e7-43187ac59281
        kind: government

  - model: cbo-microsim
    domain: taxable-income
    kind: elasticity
    parameter: tax_microsim_behavioral_elasticities
    label: Tax microsimulation behavioral elasticities
    status: documented-undisclosed
    value: unknown
    population: taxpayers affected by proposal
    policyScope: tax revenue and distribution analysis
    margin: taxpayer behavioral response
    notes: Public CBO methodology describes model use and output, but not a reusable public elasticity table for the internal tax microsimulation model.
    sources:
      - label: CBO tax microsimulation model methodology
        url: https://www.cbo.gov/publication/54096
        kind: government

  # ============================ Tax-Calculator / PSL =========================
  - model: tax-calculator
    domain: taxable-income
    kind: elasticity
    parameter: default_behavior_elasticities
    label: Default behavioral elasticities
    status: numeric
    value: 0
    unit: elasticity
    population: all filing units
    policyScope: federal individual income and payroll tax
    margin: all Tax-Calculator behavior parameters
    horizon: static default
    notes: Tax-Calculator's default is no behavioral response; nonzero behavior is supplied through external Behavioral-Responses inputs.
    sources:
      - label: Tax-Calculator behavior parameters
        url: https://taxcalc.pslmodels.org/guide/behavior_params.html
        kind: self

  - model: tax-calculator
    domain: taxable-income
    kind: functional-form
    parameter: psl_behavioral_responses
    label: Optional PSL Behavioral-Responses elasticities
    status: qualitative
    value: varies
    population: filing units or subgroups
    policyScope: federal individual income and payroll tax
    margin: partial-equilibrium behavioral response
    functionalForm: response function accepts user-specified elasticities; quantity_response can vary elasticities by subgroup.
    sources:
      - label: PSL Behavioral-Responses catalog
        url: https://pslmodels.org/Catalog/Behavioral-Responses.html
        kind: self
      - label: Behavioral-Responses documentation
        url: https://pslmodels.github.io/Behavioral-Responses/
        kind: self

  - model: nber-taxsim
    domain: taxable-income
    kind: elasticity
    parameter: default_behavior_elasticities
    label: Default behavioral elasticities
    status: not-modeled
    value: 0
    unit: elasticity
    population: input tax units
    policyScope: federal and state tax calculation
    margin: taxpayer behavioral response
    horizon: static tax calculation
    notes: TAXSIM calculates tax liabilities from user-supplied records; behavioral changes must be applied outside TAXSIM.
    sources:
      - label: NBER TAXSIM home page
        url: https://taxsim.nber.org/
        kind: self

  # ============================ Budget Lab ===================================
  - model: budgetlab-tax
    domain: labor-supply
    kind: participation-elasticity
    parameter: employment_participation_elasticity
    label: Employment participation elasticity
    status: numeric
    value: 0.4
    unit: percent employment per 1 percent return-to-work change
    population: EITC-range unmarried working mothers
    policyScope: partial-equilibrium employment feedback
    margin: extensive labor supply
    horizon: policy-specific
    sources: &budgetlab_employment_sources
      - label: Budget Lab microeconomic employment effects
        url: https://budgetlab.yale.edu/research/behavioral-responses-microeconomic-employment-effects
        kind: self

  - model: budgetlab-tax
    domain: labor-supply
    kind: participation-elasticity
    parameter: employment_participation_elasticity
    label: Employment participation elasticity
    status: numeric
    value: 0.2
    unit: percent employment per 1 percent return-to-work change
    population: other mothers with AGI below $80,000
    policyScope: partial-equilibrium employment feedback
    margin: extensive labor supply
    horizon: policy-specific
    sources: *budgetlab_employment_sources

  - model: budgetlab-tax
    domain: labor-supply
    kind: participation-elasticity
    parameter: employment_participation_elasticity
    label: Employment participation elasticity
    status: numeric
    value: 0.05
    unit: percent employment per 1 percent return-to-work change
    population: all others with AGI below $80,000
    policyScope: partial-equilibrium employment feedback
    margin: extensive labor supply
    horizon: policy-specific
    sources: *budgetlab_employment_sources

  - model: budgetlab-tax
    domain: labor-supply
    kind: participation-elasticity
    parameter: employment_participation_elasticity
    label: Employment participation elasticity
    status: numeric
    value: 0
    unit: percent employment per 1 percent return-to-work change
    population: AGI above $80,000
    policyScope: partial-equilibrium employment feedback
    margin: extensive labor supply
    horizon: policy-specific
    sources: *budgetlab_employment_sources

  - model: budgetlab-tax
    domain: capital-gains
    kind: elasticity
    parameter: capital_gains_realization_overall
    label: Revenue-estimate overall capital-gains realization elasticity
    status: numeric
    value: -0.62
    unit: percent realizations per 1 percent tax-rate change
    population: all capital-gains realizers
    policyScope: capital-gains revenue scoring
    margin: realization response
    horizon: policy-specific
    notes: Budget Lab starts from a historical overall elasticity of -0.72, estimates elastic and inelastic asset-group elasticities, then recomposes them with more recent asset shares to use -0.62 in revenue estimates.
    sources: &budgetlab_capgains_sources
      - label: Budget Lab capital-gains behavioral response
        url: https://budgetlab.yale.edu/research/behavioral-responses-capital-gains-realizations
        kind: self

  - model: budgetlab-tax
    domain: capital-gains
    kind: elasticity
    parameter: capital_gains_realization_historical_overall
    label: Historical overall capital-gains realization elasticity
    status: numeric
    value: -0.72
    unit: percent realizations per 1 percent tax-rate change
    population: all capital-gains realizers under historical asset shares
    policyScope: capital-gains elasticity calibration
    margin: realization response
    horizon: historical shares
    notes: Used to solve for elastic and inelastic asset-group elasticities before recomposing with recent asset shares.
    sources: *budgetlab_capgains_sources

  - model: budgetlab-tax
    domain: capital-gains
    kind: elasticity
    parameter: capital_gains_realization_elastic_group
    label: Capital-gains realization elasticity for elastic assets
    status: numeric
    value: -0.945
    unit: percent realizations per 1 percent tax-rate change
    population: elastic capital-gains asset holders
    policyScope: capital-gains revenue scoring
    margin: realization response
    horizon: policy-specific
    sources: *budgetlab_capgains_sources

  - model: budgetlab-tax
    domain: capital-gains
    kind: elasticity
    parameter: capital_gains_realization_inelastic_group
    label: Capital-gains realization elasticity for inelastic assets
    status: numeric
    value: -0.473
    unit: percent realizations per 1 percent tax-rate change
    population: inelastic capital-gains asset holders
    policyScope: capital-gains revenue scoring
    margin: realization response
    horizon: policy-specific
    sources: *budgetlab_capgains_sources

  - model: budgetlab-tax
    domain: capital-gains
    kind: calibration-target
    parameter: capital_gains_elastic_asset_share_historical
    label: Elastic asset share in historical SOCA composition
    status: numeric
    value: 0.52
    unit: share of capital-gains assets
    population: elastic assets
    policyScope: capital-gains elasticity calibration
    margin: asset-composition recomposition
    horizon: 1997 SOCA data
    sources: *budgetlab_capgains_sources

  - model: budgetlab-tax
    domain: capital-gains
    kind: calibration-target
    parameter: capital_gains_inelastic_asset_share_historical
    label: Inelastic asset share in historical SOCA composition
    status: numeric
    value: 0.48
    unit: share of capital-gains assets
    population: inelastic assets
    policyScope: capital-gains elasticity calibration
    margin: asset-composition recomposition
    horizon: 1997 SOCA data
    sources: *budgetlab_capgains_sources

  - model: budgetlab-tax
    domain: capital-gains
    kind: calibration-target
    parameter: capital_gains_elastic_asset_share_recent
    label: Elastic asset share in recent SOCA composition
    status: numeric
    value: 0.30
    unit: share of capital-gains assets
    population: elastic assets
    policyScope: capital-gains revenue scoring
    margin: asset-composition recomposition
    horizon: 2015 SOCA data
    sources: *budgetlab_capgains_sources

  - model: budgetlab-tax
    domain: capital-gains
    kind: calibration-target
    parameter: capital_gains_inelastic_asset_share_recent
    label: Inelastic asset share in recent SOCA composition
    status: numeric
    value: 0.70
    unit: share of capital-gains assets
    population: inelastic assets
    policyScope: capital-gains revenue scoring
    margin: asset-composition recomposition
    horizon: 2015 SOCA data
    sources: *budgetlab_capgains_sources

  - model: budgetlab-tax
    domain: financial-transactions
    kind: elasticity
    parameter: financial_transaction_volume_elasticity
    label: Financial transaction volume elasticity
    status: numeric
    value: -0.3
    unit: percent transaction volume per 1 percent tax-rate change
    population: financial transactions
    policyScope: off-model financial transactions tax estimates
    margin: transaction volume response
    horizon: policy-specific
    sources:
      - label: Budget Lab off-model budget estimates
        url: https://budgetlab.yale.edu/research/model-budget-estimates
        kind: self

  - model: budgetlab-tax
    domain: taxable-income
    kind: functional-form
    parameter: user_written_behavior_modules
    label: User-written behavioral feedback modules
    status: qualitative
    value: varies
    population: tax units
    policyScope: Tax-Simulator scenarios
    margin: arbitrary input-variable response to policy
    functionalForm: Scenario runscript can pass behavior modules that update tax-unit attributes before non-static tax calculation.
    sources:
      - label: Budget Lab tax microsimulation documentation
        url: https://budgetlab.yale.edu/research/tax-microsimulation-budget-lab
        kind: self

  # ============================ PolicyEngine UK / UK models ==================
  - model: policyengine-uk
    domain: labor-supply
    kind: elasticity
    parameter: labour_supply_income_effect_response
    label: Income-effect labour supply response
    status: not-modeled
    value: 0
    unit: elasticity
    population: all earners
    policyScope: UK tax-benefit reform simulation
    margin: income effect
    horizon: static default
    notes: PolicyEngine UK is static by default on this margin; unless users explicitly change the labour-supply response settings, the income-effect response is zero.
    sources:
      - label: policyengine-uk labour-supply income-effect setting
        url: https://github.com/PolicyEngine/policyengine-uk/blob/main/policyengine_uk/parameters/gov/simulation/labour_supply_responses/income_elasticity.yaml
        kind: self

