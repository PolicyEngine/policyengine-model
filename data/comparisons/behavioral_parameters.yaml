# Behavioral parameters and reverse-engineering assumptions.
#
# Use one row per public behavioral parameter, choice model, incidence
# assumption, or explicit "not modeled / undisclosed / unknown" fact. Numeric
# rows are scalar or range-like; qualitative rows capture public model
# mechanics that are not published as a single elasticity.

behavioralParameters:
  # ============================ PolicyEngine US ===============================
  - model: policyengine-us
    domain: labor-supply
    kind: elasticity
    parameter: labor_income_effect
    label: Income elasticity of labor supply
    status: numeric
    value: -0.05
    unit: percent hours per 1 percent net income
    population: all earners
    margin: income effect
    horizon: reform simulation
    functionalForm: Income effect plus substitution effect applied to top earners, then taxes and benefits are recomputed.
    notes: Default CBO-style behavioral response; users can override or set zero.
    sources:
      - label: PolicyEngine US behavioral responses explainer
        url: https://www.policyengine.org/us/research/us-behavioral-responses
        kind: self
      - label: policyengine-model elasticity defaults
        url: https://github.com/PolicyEngine/policyengine-model/blob/add-model-comparison/src/data/elasticities.ts
        kind: self

  - model: policyengine-us
    domain: labor-supply
    kind: elasticity
    parameter: labor_substitution_effect
    label: Substitution elasticity of labor supply
    status: numeric
    lower: 0.15
    central: 0.31
    upper: 0.47
    unit: percent hours per 1 percent net marginal wage
    population: income decile 0-10%
    margin: substitution effect
    horizon: reform simulation
    sources: &policyengine_us_labor_sources
      - label: PolicyEngine US behavioral responses explainer
        url: https://www.policyengine.org/us/research/us-behavioral-responses
        kind: self
      - label: policyengine-model elasticity defaults
        url: https://github.com/PolicyEngine/policyengine-model/blob/add-model-comparison/src/data/elasticities.ts
        kind: self

  - model: policyengine-us
    domain: labor-supply
    kind: elasticity
