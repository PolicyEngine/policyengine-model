        url: https://www.urban.org/sites/default/files/publication/86971/overlap_in_snap_and_medicaidchip_eligibility.pdf
        kind: self
        supports: [notableRegimes, updateCadence]

  - model: hipsm
    latestImplementedYear: 2025
    forwardYearsThrough: 2034
    handlesFutureDatedLegislation: yes
    updateCadence: annual
    updateLag: >
      Days to weeks for major health-care legislation when
      funder-supported scoring is requested. The model is
      recalibrated each year to actual Medicaid and marketplace
      enrollment in each state. Forward projection through the
      CBO 10-year budget window is supported.
    lastMajorRefresh: unknown
    notableRegimes: >
      ACA marketplace under current law (including IRA-extended
      premium tax credits), state Medicaid expansion variants,
      and OBBBA changes to ACA subsidies. Urban routinely
      publishes HIPSM scores of ACA repeal/expand scenarios and
      state Medicaid policy options within days of major
      proposals.
    notes: >
      Calibration cadence is annual but reform analyses are
      published continuously. Coverage in each state is tied to
      enrollment files that lag actual coverage by months.
    sources:
      - label: Urban — HIPSM for 2020 methodology
          (annual recalibration described)
        url: https://www.urban.org/sites/default/files/publication/103412/the-health-insurance-policy-simulation-model-for-2020.pdf
        kind: self
        supports: [updateCadence, latestImplementedYear, handlesFutureDatedLegislation, notableRegimes]
        quote: >-
          Each year, the model is calibrated to reproduce the
          latest available Medicaid and marketplace enrollment
          numbers in each state under the ACA.
      - label: HIPSM overview (annual cadence; quick-turnaround
          policy scoring)
        url: https://www.urban.org/research/data-methods/data-analysis/quantitative-data-analysis/microsimulation/health-insurance-policy-simulation-model-hipsm
        kind: self
        supports: [updateCadence, updateLag, notableRegimes]
      - label: Urban — Health Care Providers Would Experience
          Significant Revenue Losses (2025 HIPSM analysis of
          Medicaid expansion rollback)
        url: https://www.urban.org/sites/default/files/2025-03/Health-Care-Providers-Would-Experience-Significant-Revenue-Losses-and-Uncompensated-Care-Increases-in%20-the-Face-of-Reduced-Federal-Support-for-Medicaid-Expansion.pdf
        kind: self
        supports: [latestImplementedYear, notableRegimes, updateLag]

  - model: hisim2
    latestImplementedYear: 2026
    forwardYearsThrough: 2036
    handlesFutureDatedLegislation: yes
    updateCadence: continuous
    updateLag: >
      Days to weeks for major health legislation. HISIM2 scored
      OBBBA marketplace and Medicaid provisions in CBO's June 2025
      OBBBA coverage analysis. Baseline refreshed twice yearly
      with the Budget and Economic Outlook.
    lastMajorRefresh: 2026-02
    notableRegimes: >
      Current-law baseline reflecting ACA, IRA-extended premium
      tax credits, and OBBBA (P.L. 119-21, enacted July 4, 2025).
      Coverage projections extend through the 10-year CBO budget
      window (2026-2036). Used in essentially every CBO score of
      ACA marketplace, Medicaid, and employer-coverage reforms.
    notes: >
      HISIM2 is one of several CBO models the agency uses jointly
      with its microsim tax model (cbo-microsim) and CBOLT to
      produce a unified federal score. Subsequent working papers
      may refine specific modules but no public successor
      ("HISIM3") has been released.
    sources:
      - label: CBO — HISIM2 Used in Preparing July 2021 Baseline
          (model documentation)
        url: https://www.cbo.gov/publication/57205
        kind: government
        supports: [updateCadence, handlesFutureDatedLegislation, notableRegimes]
      - label: CBO — Methods for Analyzing Health Insurance
          Coverage (HISIM2 in current methodology stack)
        url: https://www.cbo.gov/topics/health-care/methods-analyzing-health-insurance-coverage
        kind: government
        supports: [latestImplementedYear, updateCadence, notableRegimes]
      - label: CBO — Budget and Economic Outlook 2026 to 2036
          (HISIM2-based health coverage baseline)
        url: https://www.cbo.gov/publication/62105
        kind: government
        supports: [latestImplementedYear, forwardYearsThrough, lastMajorRefresh, notableRegimes]
