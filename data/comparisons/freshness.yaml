  - model: ukmod
    latestImplementedYear: 2025
    forwardYearsThrough: 2025
    handlesFutureDatedLegislation: partial
    updateCadence: annual
    updateLag: >
      Annual release cycle tied to CeMPA's UKMOD update; new policy
      year usually published within several months of the relevant
      fiscal event and FRS data update.
    lastMajorRefresh: 2025
    notableRegimes: >
      Annual UKMOD releases (UKMOD A1.0 onwards) implement Autumn
      Budget and Spring Statement measures through the current tax
      year. Devolved Scottish income tax bands tracked. Pre-announced
      future-dated reforms generally only encoded once they take
      effect.
    notes: >
      UKMOD follows the EUROMOD release model: one or two consolidated
      releases per year with all enacted policies for the new policy
      year. Forward projection of legislation that has been announced
      but not yet effective is supported case-by-case rather than as a
      standard 10-year window.
    sources:
      - label: UKMOD release history and country reports
        url: https://www.microsimulation.ac.uk/ukmod/country-reports
        kind: self
        supports: [latestImplementedYear, lastMajorRefresh, updateCadence, notableRegimes]
      - label: UKMOD home page (annual update cadence)
        url: https://www.microsimulation.ac.uk/ukmod
        kind: self
        supports: [updateCadence, updateLag]
      - label: JRC EUROMOD release cycle (parent framework cadence)
        url: https://euromod-web.jrc.ec.europa.eu/resources/release-notes
        kind: government
        supports: [updateCadence, handlesFutureDatedLegislation]
      - label: UK Data Service FRS release schedule (drives data
          refresh timing)
        url: https://ukdataservice.ac.uk/find-data/series/?id=200017
        kind: government
        supports: [updateLag, updateCadence]

  - model: ifs-taxben
    latestImplementedYear: 2026
    forwardYearsThrough: 2029
    handlesFutureDatedLegislation: yes
    updateCadence: continuous
    updateLag: >
      Days for major fiscal events — IFS routinely publishes TAXBEN
      distributional analyses within hours of Budget speeches and
      Spring Statements.
    lastMajorRefresh: unknown
    notableRegimes: >
      Current law as of the most recent Budget or Spring Statement
      (Autumn Budget 2024 freezes, Spring Statement 2025 measures).
      IFS analyses regularly project frozen-threshold "fiscal drag"
      and announced welfare changes several years forward.
    notes: >
      TAXBEN's purpose is to score proposed and scheduled fiscal
      changes; forward-projection over the OBR scorecard horizon is
      routine. Refresh cadence is event-driven (Budgets and Spring
      Statements) rather than annual.
    sources:
      - label: IFS Green Budget 2024 (TAXBEN-based forward-projected
          distributional chapters)
