  - model: ukmod
    latestImplementedYear: 2026
    forwardYearsThrough: 2030
    handlesFutureDatedLegislation: yes
    updateCadence: annual
    updateLag: >
      Annual country-report cycle pegged to FRS data refresh, with
      multiple intra-year point releases. In 2025 alone there were
      nine releases (B2025.01 through B2025.09) tracking Autumn Budget,
      Spring Statement and devolved measures. UKMOD also constructs future
      systems several years ahead using announced policy changes, statutory
      uprating rules, and official projections.
    lastMajorRefresh: 2026
    notableRegimes: >
      UKMOD releases span A1.0 (2020) through B2026.01 (March 2026).
      Annual country reports document tax-benefit systems through the
      latest fiscal year plus six forward years (currently 2023-2030),
      including projected future policy systems.
      Devolved Scottish income tax rates and bands (devolved April 2016)
      and Scottish family/social benefits (from 2018) are tracked
      separately. Welsh income tax devolution (April 2019) is supported
      structurally though rates have not diverged from rUK.
    notes: >
      UKMOD inherits the EUROMOD release model: one annual full country
      report plus multiple incremental point releases per year. Each
      release ships with a versioned change log (Documentation/
      directory in the GitHub repo). The public framework includes future
      systems, though the horizon is shorter than the standard 10-year US
      budget window.
    sources:
      - label: UKMOD release history and country reports
        url: https://www.microsimulation.ac.uk/ukmod/country-reports
        kind: self
        supports: [latestImplementedYear, lastMajorRefresh, updateCadence, notableRegimes]
      - label: UKMOD-PUBLIC GitHub tags (B2024.21 ... B2026.01)
        url: https://github.com/centreformicrosimulation/UKMOD-PUBLIC/tags
        kind: self
        supports: [lastMajorRefresh, updateCadence]
      - label: UKMOD home page (annual update cadence)
        url: https://www.microsimulation.ac.uk/ukmod
        kind: self
        supports: [updateCadence, updateLag]
      - label: JRC EUROMOD news and release announcements (parent framework cadence)
        url: https://euromod-web.jrc.ec.europa.eu/news-and-events/news
