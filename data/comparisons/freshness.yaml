# Freshness: how current each model's policy parameters are, whether it
# implements legislation that is enacted but not yet effective, and how
# quickly it absorbs new legislation. This is one of the more visible
# differences between continuously-maintained open-source models and
# annually-refreshed contracted models.
#
# Sources tagged with `supports` corroborate specific fields. Aim for at
# least two distinct source kinds on confident claims (yes / specific
# year). `unknown` claims don't need expanded corroboration — they're
# already explicit about absence of evidence.

freshness:
  - model: policyengine-us
    latestImplementedYear: 2026
    forwardYearsThrough: 2034
    handlesFutureDatedLegislation: yes
    updateCadence: continuous
    updateLag: Days to weeks for major legislation; same-day for many parameter updates via merged PRs.
    lastMajorRefresh: 2026-05
    notableRegimes: >
      Pre-TCJA, TCJA (2018-2025), OBBBA (One Big Beautiful Bill Act, signed
      2025 — CTC $2,200 in 2026, TCJA extensions, expanded standard
      deduction). Pending-reversion years (post-OBBBA expirations) tracked
      through 2034 where parameters are scheduled by statute.
    notes: >
      Parameter YAML files use a date-indexed structure (`values:
      {2024-01-01: ..., 2026-01-01: ...}`) so future-dated changes can be
      encoded as soon as legislation passes. Calibration is to enhanced
      CPS calibrated to 2024 administrative totals; runtime can project
      forward via CBO baseline uprating.
    sources:
      - label: policyengine-us OBBBA implementation (commits Apr-Jul 2025)
        url: https://github.com/PolicyEngine/policyengine-us/pulls?q=is%3Apr+obbba
        kind: self
        supports: [latestImplementedYear, lastMajorRefresh, notableRegimes]
      - label: Parameter file with date-indexed effective dates (CTC max amount)
        url: https://github.com/PolicyEngine/policyengine-us/blob/main/policyengine_us/parameters/gov/irs/credits/ctc/refundable/individual_max.yaml
        kind: self
        supports: [handlesFutureDatedLegislation, forwardYearsThrough]
      - label: policyengine-us commit history (continuous merges)
        url: https://github.com/PolicyEngine/policyengine-us/commits/master
        kind: self
        supports: [updateCadence, updateLag, lastMajorRefresh]
      - label: PolicyEngine research blog — OBBBA analysis published 2025
        url: https://www.policyengine.org/us/research
        kind: self
        supports: [updateLag, notableRegimes]
      - label: PolicyEngine merged PRs (release cadence)
        url: https://github.com/PolicyEngine/policyengine-us/releases
        kind: self
        supports: [updateCadence, lastMajorRefresh]

  - model: trim3
    latestImplementedYear: unknown
    forwardYearsThrough: unknown
    handlesFutureDatedLegislation: unknown
    updateCadence: annual
    updateLag: >
      Annual refresh tied to CPS-ASEC release (~6 months after the survey
      year). TRIM3 typically simulates historical policy years.
    lastMajorRefresh: unknown
    notableRegimes: >
      Backward-looking distributional analysis tool. Recent ASPE reports
      use TRIM3 to score 2022-2023 tax-year impacts. Forward projection of
      legislation (e.g. OBBBA) not documented in public materials.
    notes: >
      Public documentation at boreas.urban.org does not expose a parameter
      effective-date catalogue or a current "latest tax year" indicator.
      The annual cadence is tied to ASPE-funded baseline updates rather
      than to legislative passage.
    sources:
      - label: TRIM3 introduction and history (lists annual updates, no
          forward-projection module described)
        url: https://boreas.urban.org/T3IntroHistory.php
        kind: self
        supports: [updateCadence, handlesFutureDatedLegislation, notableRegimes]
      - label: ASPE Welfare Indicators Annual Report (annual TRIM3 use)
        url: https://aspe.hhs.gov/reports/welfare-indicators-risk-factors-24th-report-congress
        kind: government
        supports: [updateCadence, notableRegimes]
      - label: Zedlewski (Urban) — TRIM, A Tool for Social Policy Analysis (data description)
        url: https://www.urban.org/sites/default/files/publication/82921/2000878-TRIM-A-Tool-for-Social-Policy-Analysis.pdf
        kind: self
        supports: [updateCadence, updateLag, latestImplementedYear]
      - label: Wheaton & Tran (Urban) — TRIM3 SNAP analyses use prior tax years
        url: https://www.urban.org/research/publication/antipoverty-effects-supplemental-nutrition-assistance-program
        kind: self
        supports: [notableRegimes, latestImplementedYear]

  - model: attis
    latestImplementedYear: 2023
    forwardYearsThrough: 2025
    handlesFutureDatedLegislation: yes
    updateCadence: continuous
    updateLag: >
      Tied to ACS release plus reweighting to most recent year. ATTIS
      published modeling of the Senate Budget Reconciliation SNAP
      provisions within ~16 days of Senate passage (bill passed July 1,
      2025; brief published July 2025).
    lastMajorRefresh: 2025-07
    notableRegimes: >
      One Big Beautiful Bill Act (2025) SNAP and budget reconciliation
      provisions modeled in July 2025 brief. State-level analyses of
      pandemic-era safety-net changes via State of the Safety Net Initiative.
    notes: >
      Data baseline uses combined 2022 and 2023 ACS reweighted to 2023
      population and income, with rules aged to recent policy year.
    sources:
      - label: ATTIS canonical page
        url: https://www.urban.org/research-methods/attis-microsimulation-model
        kind: self
        supports: [updateCadence, handlesFutureDatedLegislation, notableRegimes]
      - label: How the Senate Budget Reconciliation SNAP Proposals Will Affect Families in
          Every US State (Wheaton et al., July 2025) — uses 2022+2023 ACS reweighted to 2023
        url: https://www.urban.org/sites/default/files/2025-07/How-the-Senate-Budget-Reconciliation-SNAP-Proposals-Will-Affect-Families-in-Every-US-State.pdf
        kind: self
        supports: [latestImplementedYear, forwardYearsThrough, lastMajorRefresh, notableRegimes]
      - label: Census ACS release schedule (drives ATTIS update lag)
        url: https://www.census.gov/programs-surveys/acs/news/data-releases.html
        kind: government
        supports: [updateCadence, updateLag]
      - label: State of the Safety Net brief series (point-in-time analyses)
        url: https://www.urban.org/projects/state-safety-net
        kind: self
        supports: [notableRegimes, updateCadence]

  - model: tpc-microsim
    latestImplementedYear: 2025
    forwardYearsThrough: 2035
    handlesFutureDatedLegislation: yes
    updateCadence: annual
    updateLag: >
      Annual baseline refresh after the CBO Budget and Economic Outlook
      (typically late January / early February). Interim adjustments
      between annual updates when CBO substantially revises projections.
      Distributional tables for major bills published within days of
      Congressional releases.
    lastMajorRefresh: 2025
    notableRegimes: >
      Current-law baseline including TCJA (P.L. 115-97), CARES Act, ARPA,
      TCJA-extension scenarios, OBBBA, and tariff burden analyses through
      TPC's separate tariff models.
    notes: >
      Forward projection is a core TPC capability — the model's purpose
      is to score proposed and scheduled tax law changes. Microdata aging
      is keyed to CBO baseline assumptions. TPC's tariff analysis is a
      separate model family that feeds distributional burden estimates.
    sources:
      - label: TPC Brief Description of the Tax Model (CBO baseline aging)
        url: https://www.taxpolicycenter.org/resources/brief-description-tax-model
        kind: self
        supports: [handlesFutureDatedLegislation, forwardYearsThrough,
                   latestImplementedYear, notableRegimes]
      - label: TPC Model Estimates catalogue (rolling distributional tables)
        url: https://www.taxpolicycenter.org/model-estimates
        kind: self
        supports: [updateCadence, latestImplementedYear, notableRegimes]
      - label: TPC — Description of TPC's Tariff Models
        url: https://taxpolicycenter.org/projects/resources/description-tax-policy-centers-tariff-models
        kind: self
        supports: [latestImplementedYear, notableRegimes]
      - label: TPC — Baseline Definitions
        url: https://taxpolicycenter.org/resources/tax-model-resources/tpc-baseline-definitions
        kind: self
        supports: [forwardYearsThrough, notableRegimes]
      - label: CBO Budget and Economic Outlook (baseline TPC ages to)
        url: https://www.cbo.gov/topics/budget
        kind: government
        supports: [forwardYearsThrough, updateLag]

  - model: jct-microsim
    latestImplementedYear: 2025
    forwardYearsThrough: 2035
    handlesFutureDatedLegislation: yes
    updateCadence: continuous
    updateLag: >
      Days for major bills. JCX-26-25 scored OBBBA-as-passed-by-House on
      May 28, 2025 (six days after House passage on May 22). JCX-29-25
      scored the Senate substitute on June 21, 2025 (five days after the
      draft was released). Models are reviewed and recalibrated annually.
    lastMajorRefresh: 2025-06
    notableRegimes: >
      Current law including TCJA (P.L. 115-97) and OBBBA (P.L. 119-21,
      enacted July 4, 2025), with revenue scoring of proposed legislation
      over the 10-year CBO budget window. Annual tax-expenditure
      estimates published in JCX-48-24 (December 2024) cover FY 2024-2028.
    notes: >
      JCT operates four microsimulation models (Individual, Corporate,
      International Cross Border, and Estate and Gift). The Individual
      model uses an SOI sample of approximately 360,000 returns. Models
      are reviewed and recalibrated annually; baseline aligns with CBO
      Budget and Economic Outlook updates twice yearly.
    sources:
      - label: JCT — Revenue Estimating (model list and recalibration cadence)
        url: https://www.jct.gov/operations/revenue-estimating/
        kind: government
        supports: [updateCadence, notableRegimes, latestImplementedYear]
        quote: >-
          The microsimulation models are reviewed and recalibrated on an
          annual basis.
      - label: JCT — JCX-26-25 (OBBBA House-passed revenue estimate, May 28, 2025)
        url: https://www.jct.gov/publications/2025/jcx-26-25/
        kind: government
        supports: [updateLag, lastMajorRefresh, notableRegimes]
      - label: JCT — JCX-29-25 (OBBBA Senate substitute, June 21, 2025)
        url: https://www.jct.gov/publications/2025/jcx-29-25/
        kind: government
        supports: [updateLag, lastMajorRefresh, notableRegimes]
      - label: JCT — JCX-48-24 (tax expenditures FY 2024-2028, December 2024)
        url: https://www.jct.gov/publications/2024/jcx-48-24/
        kind: government
        supports: [latestImplementedYear, notableRegimes]
      - label: CRS — Dynamic Scoring for Tax Legislation A Review of Models (R43381)
        url: https://www.congress.gov/crs-product/R43381
        kind: government
        supports: [updateCadence, handlesFutureDatedLegislation]
      - label: CBO Budget and Economic Outlook (baseline JCT aligns with)
        url: https://www.cbo.gov/topics/budget
        kind: government
        supports: [forwardYearsThrough, updateCadence]

  - model: cbo-microsim
    latestImplementedYear: 2026
    forwardYearsThrough: 2036
    handlesFutureDatedLegislation: yes
    updateCadence: continuous
    updateLag: >
      Days to weeks for major legislation. CBO published the dynamic
      analysis of OBBBA SNAP provisions in June 2025 (publication
      61505) and an interactive distributional tool for H.R. 1
      (OBBBA) on June 13, 2025 (publication 61469), three weeks after
      House passage on May 22, 2025. Baseline refreshed annually with
      the Budget and Economic Outlook.
    lastMajorRefresh: 2026-02
    notableRegimes: >
      Current-law baseline reflecting TCJA (P.L. 115-97) and OBBBA
      (P.L. 119-21). The February 2026 Budget and Economic Outlook
      (publication 62105) reflects legislation enacted through
      January 14, 2026. Earlier scorings of H.R. 1 / OBBBA standalone
      include publications 61387, 61422, 61461, 61469, 61505.
    notes: >
      CBO is not one model but a family of models, including the
      microsimulation tax model (income and payroll), HISIM2 (health
      insurance coverage including Medicaid and PTC), CBOLT (long-term
      including Social Security), the Conventional Tariff Analysis
      Model, and an underreporting-adjustment model for means-tested
      transfers. Code for several models is published on CBO's GitHub.
    sources:
      - label: CBO — Budget and Economic Outlook 2026 to 2036 (February 2026)
        url: https://www.cbo.gov/publication/62105
        kind: government
        supports: [latestImplementedYear, forwardYearsThrough,
                   lastMajorRefresh, notableRegimes,
                   handlesFutureDatedLegislation]
      - label: CBO — How H.R. 1 (OBBBA) would affect distribution of
          household resources (June 13, 2025)
        url: https://www.cbo.gov/publication/61469
        kind: government
        supports: [updateLag, notableRegimes, handlesFutureDatedLegislation]
      - label: CBO — Estimated Budgetary Effects of H.R. 1 (OBBBA, June 2025)
        url: https://www.cbo.gov/publication/61461
        kind: government
        supports: [updateLag, notableRegimes]
      - label: CBO — Dynamic Analysis of SNAP changes in H.R. 1 (June 2025)
        url: https://www.cbo.gov/publication/61505
        kind: government
        supports: [updateLag, notableRegimes]
      - label: CBO — Advanced Models (list of CBO models with GitHub code)
        url: https://www.cbo.gov/models/details
        kind: government
        supports: [updateCadence]
      - label: CBO — An Overview of CBO's Microsimulation Tax Model (2018)
        url: https://www.cbo.gov/publication/54096
        kind: government
        supports: [updateCadence, handlesFutureDatedLegislation]

  - model: itep-microsim
    latestImplementedYear: 2025
    forwardYearsThrough: 2026
    handlesFutureDatedLegislation: partial
    updateCadence: annual
    updateLag: >
      Annual refresh tied to the Who Pays? state tax incidence series.
      Federal legislation scored ad-hoc; ITEP published a national and
      state-level distributional analysis of OBBBA-as-passed-by-House
      within days of the May 22, 2025 House passage; post-enactment
      analyses followed the July 4, 2025 signing.
    lastMajorRefresh: 2024-10
    notableRegimes: >
      Who Pays? 7th edition (October 2024) covers state and local tax
      law as of January 1, 2024 applied to 2023 income. Federal
      analyses extend to TCJA (P.L. 115-97), OBBBA as enacted
      (P.L. 119-21), and the 2025 tariff package. Aging through 2026
      supported via CBO baseline targets.
    notes: >
      ITEP's primary cadence is the Who Pays? series; the underlying
      microsimulation supports federal reform scoring on demand. The
      model is initially anchored to 2019 data and aged forward via
      IRS, CBO, and other targets. State EITCs (31 states + DC) and
      state CTCs are modeled within state personal income tax modules.
    sources:
      - label: ITEP — Who Pays? 7th Edition methodology
        url: https://itep.org/who-pays-7th-edition-methodology-and-discussion/
        kind: self
        supports: [latestImplementedYear, lastMajorRefresh, updateCadence,
                   notableRegimes]
        quote: >-
          The report shows the amount of income, consumption, and
          property taxes that would have been paid by residents in 2023
          with the January 1, 2024 law in place.
      - label: ITEP — Tax Microsimulation Model Overview (aging methodology)
        url: https://itep.org/itep-tax-model/
        kind: self
        supports: [forwardYearsThrough, updateCadence]
        quote: >-
          For years after 2019, the model adjusts the value of every
          component of personal income, and the weights associated with
          each record, to reflect targets published by the Internal
          Revenue Service, the Congressional Budget Office, and other
          sources.
      - label: ITEP — Analysis of OBBBA tax provisions (May 2025)
        url: https://itep.org/analysis-of-tax-provisions-in-house-reconciliation-bill/
        kind: self
        supports: [updateLag, notableRegimes, handlesFutureDatedLegislation]
      - label: ITEP — OBBBA topic page
        url: https://itep.org/one-big-beautiful-bill-act/
        kind: self
        supports: [notableRegimes, handlesFutureDatedLegislation]
      - label: Treasury (Cilke) — Re-weighting to produce state-level
          microsimulation estimates (cites ITEP methodology)
        url: https://home.treasury.gov/system/files/131/TP-6.pdf
        kind: government
        supports: [updateCadence]

  - model: tax-calculator
    latestImplementedYear: 2026
    forwardYearsThrough: 2036
    handlesFutureDatedLegislation: yes
    updateCadence: continuous
    updateLag: >
      Open-source PR cadence. OBBBA (signed July 4, 2025) was tracked
      in issue #2926 opened July 5, 2025; OBBBA-ready test harness
      shipped in release 5.0.0 on July 2, 2025; OBBBA parameter
      additions shipped in 5.1.0 (July 22, 2025); OBBBA-as-current-law
      shipped in 5.2.0 on August 8, 2025 — five weeks from law to
      baseline. Subsequent bug-fix releases through 6.5.3 (April 27,
      2026) tightened OBBBA phase-outs.
    lastMajorRefresh: "2026-04-27"
    notableRegimes: >
      Current-law baseline reflecting TCJA (P.L. 115-97) and OBBBA
      (P.L. 119-21) — including the OBBBA $2,200 CTC, senior
      deduction, overtime and tip deductions, and revised QBI
      parameters. Reform JSON files for ARPA expansions and NoOBBBA
      counterfactual. Aging via growfactors that extend through 2036
      (added in release 6.5.0, March 2026); Policy.LAST_KNOWN_YEAR
      advanced to 2026 in release 6.2.0.
    notes: >
      Date-indexed parameters in policy_current_law.json allow
      scheduling of future-dated changes. CPS and PUF aggregate tests
      extended through 2035 in release 5.2.0. Validated against
      NBER's TAXSIM-35 with cent-level agreement on federal income and
      payroll tax liabilities.
    sources:
      - label: Tax-Calculator releases page (release history through 6.5.3)
        url: https://github.com/PSLmodels/Tax-Calculator/releases
        kind: self
        supports: [latestImplementedYear, lastMajorRefresh, updateCadence]
      - label: Tax-Calculator OBBBA implementation tracking issue #2926
        url: https://github.com/PSLmodels/Tax-Calculator/issues/2926
        kind: self
        supports: [updateLag, notableRegimes, handlesFutureDatedLegislation]
        quote: >-
          The One Big Beautiful Bill Act (OBBBA) became law on July 4,
          2025. This issue lays out plans for revising Tax-Calculator
          so that it can simulate income tax elements of OBBBA.
      - label: Tax-Calculator release notes (docs/about/releases.md)
        url: https://github.com/PSLmodels/Tax-Calculator/blob/master/docs/about/releases.md
        kind: self
        supports: [updateLag, lastMajorRefresh, notableRegimes]
      - label: Tax-Calculator policy_current_law.json (date-indexed parameters)
        url: https://github.com/PSLmodels/Tax-Calculator/blob/master/taxcalc/policy_current_law.json
        kind: self
        supports: [handlesFutureDatedLegislation, forwardYearsThrough,
                   notableRegimes]
      - label: Tax-Calculator vs TAXSIM-35 cross-model validation
        url: https://github.com/PSLmodels/Tax-Calculator/blob/master/taxcalc/validation/taxsim35/README.md
        kind: self
        supports: [updateCadence]
      - label: Tax-Calculator commit history (continuous merges)
        url: https://github.com/PSLmodels/Tax-Calculator/commits/master
        kind: self
        supports: [updateCadence, updateLag]

  - model: budgetlab-tax
    latestImplementedYear: 2026
    forwardYearsThrough: 2034
    handlesFutureDatedLegislation: yes
    updateCadence: continuous
    updateLag: >
      Continuous merges to the Tax-Simulator repo, including PR #102
      (obbba_dist.R) on June 23, 2025 — within three weeks of House
      passage of OBBBA. House and Senate versions of OBBBA tracked as
      separate scenarios under config/scenarios/tax_law/public/obbb.
      No tagged releases; latest commit on master as of late April 2026.
    lastMajorRefresh: 2026-04
    notableRegimes: >
      Baseline 2024 (pre-OBBBA), baseline_2024_tcja_ext (TCJA extension
      counterfactual), and public reform scenarios for OBBBA (House
      and Senate versions), Booker Keep Your Pay Act, Harris campaign,
      Gale tax reform, and a 2025 rebate. Combined OBBBA + tariff
      distributional analysis published June 12, 2025. Forward
      projection aligned with CBO 10-year window.
    notes: >
      Tax-Simulator is built on R with YAML parameter files for each
      tax module (eitc.yaml, ctc.yaml, cdctc.yaml, amt.yaml, niit.yaml,
      pr.yaml for payroll, etc.). Estate tax, safety-net programs,
      and tariffs are handled by separate Budget Lab repos
      (Estate-Tax-Distribution, Safety-Net, Tariff-Model). No tagged
      releases; commit history is the primary versioning signal.
    sources:
      - label: Budget Lab — Tax-Simulator merged PRs (e.g. #102 obbba_dist)
        url: https://github.com/Budget-Lab-Yale/Tax-Simulator/pulls?q=is%3Apr+is%3Aclosed
        kind: self
        supports: [updateCadence, updateLag, lastMajorRefresh, notableRegimes]
      - label: Budget Lab Tax-Simulator OBBBA scenario directories
