      DYNASIM4 starts with a 2006 population and simulates 2007-2100,
      projecting Social Security benefits, retirement income, long-term
      services and supports need, disability, mortality, and household
      formation under project-specific assumptions.
    notes: >
      DYNASIM is unusual among Urban's microsims in that it projects
      forward many decades, not just one tax-year forward. The model
      handles future-dated legislation when an analysis specifically scores
      it, but does not run a rolling "current-law plus scheduled changes"
      baseline like CBO's models.
    sources:
      - label: DYNASIM overview (Urban; lifetime projection
          framing)
        url: https://www.urban.org/research/data-methods/data-analysis/quantitative-data-analysis/microsimulation/dynamic-simulation-income-model-dynasim
        kind: self
        supports: [updateCadence, notableRegimes, handlesFutureDatedLegislation]
      - label: Urban — Dynamic Simulation of Income Model 4 fact sheet
        url: https://www.urban.org/sites/default/files/2024-09/Urban%E2%80%99s%20Dynamic%20Simulation%20of%20Income%20Model%204.pdf
        kind: self
        supports: [latestImplementedYear, forwardYearsThrough,
                   lastMajorRefresh, notableRegimes]
      - label: ASPE — DYNASIM long-term LTSS projections
          (commissioned analysis cadence)
        url: https://aspe.hhs.gov/reports/risk-needing-ltss-dynasim-projections
        kind: government
        supports: [updateCadence, updateLag, notableRegimes]
      - label: Favreault, Smith & Johnson — A Primer on DYNASIM3
          (lifecycle methodology)
        url: https://www.urban.org/sites/default/files/publication/71226/410961-A-Primer-on-the-Dynamic-Simulation-of-Income-Model-DYNASIM-.PDF
        kind: self
        supports: [notableRegimes, handlesFutureDatedLegislation]

  - model: cbolt
    latestImplementedYear: 2026
    forwardYearsThrough: 2099
    handlesFutureDatedLegislation: yes
    updateCadence: annual
    updateLag: >
      Annual refresh tied to The Long-Term Budget Outlook
      (typically March) and the Long-Term Projections for Social
      Security (typically late summer). Demographic and economic
      assumptions update with each release. Major legislation
      (e.g. OBBBA enacted July 4, 2025) is incorporated in the
      next scheduled long-term update.
    lastMajorRefresh: 2026-02
    notableRegimes: >
      75-year horizon covering Social Security under current law
      and scheduled benefit/tax changes. The Long-Term Budget
      Outlook 2026 to 2056 extends budget projections through 2056;
      2026 Long-Term Projections for Social Security project through
      2099.
    notes: >
      CBOLT's forward horizon is much longer than CBO's 10-year
      microsim suite (which the cbo-microsim entry covers).
      Updates are paced by the Long-Term Budget Outlook and
      Long-Term Social Security cycle.
    sources:
      - label: CBO — An Overview of CBOLT (April 2018)
        url: https://www.cbo.gov/publication/53667
        kind: government
        supports: [updateCadence, handlesFutureDatedLegislation, notableRegimes]
      - label: CBO — The Long-Term Budget Outlook 2026 to 2056
        url: https://www.cbo.gov/publication/62044
        kind: government
        supports: [latestImplementedYear, forwardYearsThrough, lastMajorRefresh, notableRegimes]
      - label: CBO — Long-Term Projections for Social Security,
          2026 to 2099
        url: https://www.cbo.gov/publication/61882
        kind: government
        supports: [latestImplementedYear, forwardYearsThrough, notableRegimes]
      - label: CBO — Long-Term Budget Analysis topic page
          (annual cadence catalogue)
        url: https://www.cbo.gov/topics/budget/long-term-budget-analysis
        kind: government
        supports: [updateCadence, updateLag]

  - model: mcesm
    latestImplementedYear: 2020
    forwardYearsThrough: unknown
    handlesFutureDatedLegislation: partial
    updateCadence: as-funded
    updateLag: >
      Public materials do not document a standing update cycle. Urban
      applies the model to funded, point-in-time Medicaid/CHIP eligibility
      studies; a 2021 Commonwealth Fund analysis used 2020 eligibility
      policies and a hypothetical 12-month postpartum extension.
    lastMajorRefresh: 2021-01
    notableRegimes: >
      Public documentation covers pre-ACA eligibility for 2008-2012,
      ACA-era 2014 Medicaid and CHIP rules, Puerto Rico 2011 eligibility,
      and later 2020 Medicaid/CHIP eligibility policies for postpartum
      extension analysis.
    notes: >
      The public record shows that Urban updates MCESM for specific
      analyses, but it does not expose a current rule catalogue, code
      history, or forward-year parameter schedule comparable to
      PolicyEngine's date-indexed parameters.
    sources:
      - label: Urban Medicaid/CHIP Eligibility Simulation Model
        url: https://www.urban.org/research/publication/urban-institute-health-policy-centers-medicaidchip-eligibility-simulation-model
