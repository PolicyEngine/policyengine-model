# Concrete artifacts produced or maintained by each model: codebases,
# datasets, parameter databases, web apps, APIs, papers.

artifacts:
  # ============================ PolicyEngine US ===============================
  - model: policyengine-us
    type: codebase
    name: policyengine-us
    public: yes
    license: AGPL-3.0-or-later
    url: https://github.com/PolicyEngine/policyengine-us
    description: Rules engine implementation of US federal and state tax/benefit policy.
    sources:
      - label: Repository
        url: https://github.com/PolicyEngine/policyengine-us

  - model: policyengine-us
    type: parameter-database
    name: policyengine_us parameters (YAML)
    public: yes
    license: AGPL-3.0-or-later
    url: https://github.com/PolicyEngine/policyengine-us/tree/master/policyengine_us/parameters
    description: All policy parameters as inspectable YAML with inline statutory references.
    sources:
      - label: Parameters tree
        url: https://github.com/PolicyEngine/policyengine-us/tree/master/policyengine_us/parameters

  - model: policyengine-us
    type: dataset
    name: Enhanced CPS (policyengine-us-data)
    public: yes
    license: AGPL-3.0-or-later
    url: https://huggingface.co/policyengine
    description: CPS-ASEC enhanced with PUF imputations and L0 calibration to admin totals.
    sources:
      - label: policyengine-us-data
        url: https://github.com/PolicyEngine/policyengine-us-data

  - model: policyengine-us
    type: api
    name: api.policyengine.org
    public: yes
    license: AGPL-3.0-or-later
    url: https://api.policyengine.org
    description: HTTP API for household calculations and society-wide simulations.
    sources:
      - label: PolicyEngine API
        url: https://api.policyengine.org

  - model: policyengine-us
    type: web-application
    name: policyengine.org
    public: yes
    license: AGPL-3.0-or-later
    url: https://policyengine.org/us
    description: Public web app for household calculations, reform analyses, and policy comparisons.
    sources:
      - label: PolicyEngine
        url: https://policyengine.org/us

  - model: policyengine-us
    type: documentation-site
    name: PolicyEngine US docs
    public: yes
    license: AGPL-3.0-or-later
    url: https://policyengine.github.io/policyengine-us/
    description: Methodology, validation results, model documentation.
    sources:
      - label: Docs
        url: https://policyengine.github.io/policyengine-us/

  - model: policyengine-us
    type: cli
    name: policyengine.py
    public: yes
    license: AGPL-3.0-or-later
    url: https://github.com/PolicyEngine/policyengine.py
    description: Python package for programmatic access to all country models.
    sources:
      - label: policyengine.py
        url: https://github.com/PolicyEngine/policyengine.py

  # =================================== TRIM3 ==================================
  - model: trim3
    type: codebase
    name: TRIM3
    public: no
    license: proprietary
    description: SAS/Fortran codebase maintained at Urban Institute under ASPE contract.
    sources:
      - label: TRIM3 access policy
        url: https://boreas.urban.org/T3IntroAccess.php

  - model: trim3
    type: dataset
    name: TRIM3 augmented CPS-ASEC
    public: no
    license: ASPE-restricted
    description: CPS-ASEC enhanced with caseload-aligned program participation and imputed income components.
    sources:
      - label: TRIM3 data description
        url: https://boreas.urban.org/T3IntroData.php

  - model: trim3
    type: documentation-site
    name: boreas.urban.org TRIM3 documentation
    public: yes
    license: proprietary
    url: https://boreas.urban.org/T3IntroHistory.php
    description: Public summary documentation for TRIM3 modules.
    sources:
      - label: TRIM3 docs
        url: https://boreas.urban.org/T3IntroHistory.php

  - model: trim3
    type: web-application
    name: TRIM3 user interface
    public: no
    license: proprietary
    description: Restricted-access web interface for running TRIM3 simulations.
    sources:
      - label: TRIM3 access
        url: https://boreas.urban.org/T3IntroAccess.php

  # =================================== ATTIS ==================================
  - model: attis
    type: codebase
    name: ATTIS
    public: no
    license: proprietary
    description: Microsimulation built on ACS microdata; implementation not public.
    sources:
      - label: ATTIS overview
        url: https://www.urban.org/research/data-methods/data-analysis/quantitative-data-analysis/microsimulation/analysis-transfers-taxes-and-income-security-attis

  - model: attis
    type: dataset
    name: ATTIS-prepared ACS
    public: no
    license: proprietary
    description: ACS microdata with imputed transfers and taxes.
    sources:
      - label: ATTIS overview
        url: https://www.urban.org/research/data-methods/data-analysis/quantitative-data-analysis/microsimulation/analysis-transfers-taxes-and-income-security-attis

  - model: attis
    type: paper
    name: State of the Safety Net briefs (ATTIS-derived)
    public: yes
    license: Urban editorial
    url: https://www.urban.org/projects/state-safety-net
    description: Public-facing reports based on ATTIS analyses.
    sources:
      - label: State of the Safety Net
        url: https://www.urban.org/projects/state-safety-net

  # ============================ TPC microsim =================================
  - model: tpc-microsim
    type: codebase
    name: TPC microsimulation model
    public: no
    license: proprietary
    description: SAS implementation; not public.
    sources:
      - label: TPC Brief Description
        url: https://www.taxpolicycenter.org/resources/brief-description-tax-model

  - model: tpc-microsim
    type: dataset
    name: SOI PUF + CPS-ASEC matched microdata
    public: no
    license: SOI restricted
    description: SOI PUF (purchased from IRS) augmented with statistically-matched CPS variables.
    sources:
      - label: SOI Public Use File
        url: https://www.irs.gov/statistics/soi-tax-stats-individual-public-use-microdata-files

  - model: tpc-microsim
    type: web-application
    name: TPC distributional tables
    public: yes
    license: TPC editorial
    url: https://www.taxpolicycenter.org/model-estimates
    description: Public catalogue of model-produced distributional tables.
    sources:
      - label: TPC tables
        url: https://www.taxpolicycenter.org/model-estimates

  - model: tpc-microsim
    type: documentation-site
    name: TPC Brief Description of the Tax Model
    public: yes
    license: TPC editorial
    url: https://www.taxpolicycenter.org/resources/brief-description-tax-model
    description: Summary description of the model architecture.
    sources:
      - label: Brief Description
        url: https://www.taxpolicycenter.org/resources/brief-description-tax-model

  # =================================== JCT microsim ==========================
  - model: jct-microsim
    type: codebase
    name: JCT internal tax simulator
    public: no
    license: proprietary
    description: SOI-microdata-based revenue estimating system; not public.
    sources:
      - label: JCT methodology publications
        url: https://www.jct.gov/publications/

  - model: jct-microsim
    type: paper
    name: JCT revenue estimates
    public: yes
    license: government
    url: https://www.jct.gov/publications/
    description: Official Congressional revenue estimates for proposed tax legislation.
    sources:
      - label: JCT publications
        url: https://www.jct.gov/publications/

  # =================================== CBO microsim ==========================
  - model: cbo-microsim
    type: codebase
    name: CBO internal microsim models
    public: no
    license: proprietary
    description: Multiple internal microsim models for tax revenue, payroll, SNAP, Medicaid.
    sources:
      - label: CBO working papers
        url: https://www.cbo.gov/about/products/working-papers

  - model: cbo-microsim
    type: paper
    name: CBO Budget and Economic Outlook
    public: yes
    license: government
    url: https://www.cbo.gov/topics/budget
    description: Authoritative 10-year baseline budget projection.
    sources:
      - label: CBO Budget topics
        url: https://www.cbo.gov/topics/budget

  - model: cbo-microsim
    type: paper
    name: CBO distribution of household income
    public: yes
    license: government
    url: https://www.cbo.gov/topic/income-distribution
    description: Distributional analyses of taxes, transfers, and income.
    sources:
      - label: CBO income distribution
        url: https://www.cbo.gov/topic/income-distribution

  # =================================== ITEP microsim =========================
  - model: itep-microsim
    type: codebase
    name: ITEP Microsimulation Tax Model
    public: no
    license: proprietary
    description: Federal + state tax incidence model; implementation not public.
    sources:
      - label: ITEP methodology
        url: https://itep.org/methodology/

  - model: itep-microsim
    type: paper
    name: Who Pays? state tax incidence reports
    public: yes
    license: ITEP editorial
    url: https://itep.org/whopays/
    description: The canonical analysis of state-by-state tax progressivity.
    sources:
      - label: Who Pays?
        url: https://itep.org/whopays/

  # =================================== Tax-Calculator ========================
  - model: tax-calculator
    type: codebase
    name: Tax-Calculator
    public: yes
    license: CC0-1.0
    url: https://github.com/PSLmodels/Tax-Calculator
    description: Open-source federal individual income + payroll tax microsimulation.
    sources:
      - label: Tax-Calculator repo
        url: https://github.com/PSLmodels/Tax-Calculator

  - model: tax-calculator
    type: parameter-database
    name: Tax-Calculator policy parameters (JSON)
    public: yes
    license: CC0-1.0
    url: https://github.com/PSLmodels/Tax-Calculator/blob/master/taxcalc/policy_current_law.json
    description: All federal tax policy parameters with effective dates in JSON.
    sources:
      - label: policy_current_law.json
        url: https://github.com/PSLmodels/Tax-Calculator/blob/master/taxcalc/policy_current_law.json

  - model: tax-calculator
    type: dataset
    name: taxdata (Tax-Calculator data prep)
    public: partial
    license: CC0-1.0 (code); IRS PUF required separately
    url: https://github.com/PSLmodels/taxdata
    description: Open data-prep pipeline; PUF build requires SOI purchase.
    sources:
      - label: taxdata repo
        url: https://github.com/PSLmodels/taxdata

  - model: tax-calculator
    type: documentation-site
    name: Tax-Calculator documentation
    public: yes
    license: CC0-1.0
    url: https://taxcalc.pslmodels.org
    description: Full methodology and API documentation.
    sources:
      - label: Tax-Calculator docs
        url: https://taxcalc.pslmodels.org

  # =================================== Budget Lab ============================
  - model: budgetlab-tax
    type: codebase
    name: Budget Lab Tax Model
    public: partial
    license: MIT
    url: https://github.com/yale-budget-lab
    description: Per-analysis R code published in Budget Lab GitHub organization.
    sources:
      - label: Yale Budget Lab GitHub
        url: https://github.com/yale-budget-lab

  - model: budgetlab-tax
    type: paper
    name: Budget Lab research catalogue
    public: yes
    license: Budget Lab editorial
    url: https://budgetlab.yale.edu/research
    description: Methodology and scoring papers for individual analyses.
    sources:
      - label: Budget Lab research
        url: https://budgetlab.yale.edu/research

  - model: budgetlab-tax
    type: documentation-site
    name: Budget Lab methodology
    public: yes
    license: Budget Lab editorial
    url: https://budgetlab.yale.edu/topic/methodology
    description: Documentation of methodology across Budget Lab analyses.
    sources:
      - label: Budget Lab methodology
        url: https://budgetlab.yale.edu/topic/methodology

  # =================================== PolicyEngine UK =======================
  - model: policyengine-uk
    type: codebase
    name: policyengine-uk
    public: yes
    license: AGPL-3.0-or-later
    url: https://github.com/PolicyEngine/policyengine-uk
    description: Rules engine implementation of UK tax and benefit policy.
    sources:
      - label: Repository
        url: https://github.com/PolicyEngine/policyengine-uk

  - model: policyengine-uk
    type: parameter-database
    name: policyengine_uk parameters (YAML)
    public: yes
    license: AGPL-3.0-or-later
    url: https://github.com/PolicyEngine/policyengine-uk/tree/master/policyengine_uk/parameters
    description: All UK policy parameters as inspectable YAML with inline statutory references.
    sources:
      - label: Parameters tree
        url: https://github.com/PolicyEngine/policyengine-uk/tree/master/policyengine_uk/parameters

  - model: policyengine-uk
    type: dataset
    name: Enhanced Family Resources Survey (policyengine-uk-data)
    public: partial
    license: AGPL-3.0-or-later (code); UK Data Service licence required for base FRS
    url: https://github.com/PolicyEngine/policyengine-uk-data
    description: FRS enhanced with imputations and L0-calibrated weights to HMRC/DWP totals; base FRS access via UK Data Service.
    sources:
      - label: policyengine-uk-data repository
        url: https://github.com/PolicyEngine/policyengine-uk-data
      - label: UK Data Service FRS series
        url: https://ukdataservice.ac.uk/find-data/series/?id=200017

  - model: policyengine-uk
    type: web-application
    name: policyengine.org/uk
    public: yes
    license: AGPL-3.0-or-later
    url: https://policyengine.org/uk
    description: Public web app for household calculations, UK reform analyses, and policy comparisons.
    sources:
      - label: PolicyEngine UK
        url: https://policyengine.org/uk

  - model: policyengine-uk
    type: documentation-site
    name: PolicyEngine UK docs
    public: yes
    license: AGPL-3.0-or-later
    url: https://policyengine.github.io/policyengine-uk/
    description: Methodology, validation, and model documentation for UK.
    sources:
      - label: Docs
        url: https://policyengine.github.io/policyengine-uk/

  # =================================== UKMOD =================================
  - model: ukmod
    type: codebase
    name: UKMOD source files
    public: yes
    license: EUROMOD Public License (custom; free for research)
    url: https://www.microsimulation.ac.uk/ukmod/access
    description: Parameter rules and DSL policy files distributed to registered users; no public source control.
    sources:
      - label: UKMOD access
        url: https://www.microsimulation.ac.uk/ukmod/access

  - model: ukmod
    type: dataset
    name: UKMOD-prepared FRS input
    public: no
    license: UK Data Service licence
    description: Prepared FRS-derived input file; underlying FRS requires UK Data Service registered licence.
    sources:
      - label: UK Data Service FRS
        url: https://ukdataservice.ac.uk/find-data/series/?id=200017

  - model: ukmod
    type: documentation-site
    name: UKMOD country reports and home page
    public: yes
    license: CeMPA editorial
    url: https://www.microsimulation.ac.uk/ukmod
    description: Public documentation of UKMOD policies, releases, and methodology.
    sources:
      - label: UKMOD home
        url: https://www.microsimulation.ac.uk/ukmod

  - model: ukmod
    type: paper
    name: CeMPA working paper series
    public: yes
    license: CeMPA editorial
    url: https://www.microsimulation.ac.uk/publications/working-papers
    description: Academic working papers using and documenting UKMOD.
    sources:
      - label: CeMPA working papers
        url: https://www.microsimulation.ac.uk/publications/working-papers

  # =================================== IFS TAXBEN ============================
  - model: ifs-taxben
    type: codebase
    name: TAXBEN
    public: no
    license: proprietary
    description: IFS in-house tax-benefit microsimulation; implementation not public.
    sources:
      - label: IFS TAXBEN tool page
        url: https://ifs.org.uk/tools_and_resources/taxben

  - model: ifs-taxben
    type: paper
    name: IFS Green Budget (annual TAXBEN-based analysis)
    public: yes
    license: IFS editorial
    url: https://ifs.org.uk/green-budget
    description: Annual macroeconomic and distributional analysis built on TAXBEN.
    sources:
      - label: IFS Green Budget
        url: https://ifs.org.uk/green-budget

  - model: ifs-taxben
    type: documentation-site
    name: IFS TAXBEN tool description
    public: yes
    license: IFS editorial
    url: https://ifs.org.uk/tools_and_resources/taxben
    description: High-level description of TAXBEN's scope and methodology.
    sources:
      - label: TAXBEN tool page
        url: https://ifs.org.uk/tools_and_resources/taxben

  # =================================== IGOTM =================================
  - model: igotm
    type: codebase
    name: HM Treasury Intra-Governmental Tax and Benefit Model
    public: no
    license: proprietary
    description: HM Treasury microsimulation model shared with HMRC and DWP; not externally accessible.
    sources:
      - label: HM Treasury distributional analysis
        url: https://www.gov.uk/government/publications/impact-on-households-distributional-analysis-to-accompany-budget-2024

  - model: igotm
    type: paper
    name: HM Treasury — Impact on households (Budget annex)
    public: yes
    license: Open Government Licence
    url: https://www.gov.uk/government/publications/impact-on-households-distributional-analysis-to-accompany-budget-2024
    description: Official distributional analysis annex accompanying each Budget; outputs of IGOTM.
    sources:
      - label: Impact on households (Autumn Budget 2024)
        url: https://www.gov.uk/government/publications/impact-on-households-distributional-analysis-to-accompany-budget-2024

  # ============================ Columbia CPSP ================================
  - model: columbia-cpsp
    type: codebase
    name: CPSP internal poverty microsimulation
    public: no
    license: proprietary
    description: Stata/R poverty microsim layered on top of NBER TAXSIM for tax calculations; not public.
    sources:
      - label: CPSP working papers (methodology described, code not released)
        url: https://www.povertycenter.columbia.edu

  - model: columbia-cpsp
    type: paper
    name: CPSP working paper series
    public: yes
    license: CPSP editorial
    url: https://www.povertycenter.columbia.edu
    description: Methodology and findings papers from CPSP poverty analyses, including monthly poverty trackers and anchored SPM series.
    sources:
      - label: Hamilton, Wimer, Collyer et al. — Monthly cash payments paper
        url: https://povertycenter.columbia.edu/sites/povertycenter.columbia.edu/files/content/Publications/Monthly-Cash-Payments-Reduce-Spells-of-Poverty-CPSP-2022.pdf
      - label: Koutavas, Wang, Slopen et al. — Expanding Paid Parental Leave
        url: https://povertycenter.columbia.edu/sites/povertycenter.columbia.edu/files/content/Publications/Expanding-Paid-Parental-Leave-in-New-York-CPSP-2024.pdf

  - model: columbia-cpsp
    type: paper
    name: National Academies child poverty roadmap (CPSP simulations)
    public: yes
    license: NAS editorial
    url: https://nap.nationalacademies.org/catalog/25246
    description: Influential 2019 report using both CPSP and TRIM3 simulations to evaluate child poverty reduction options.
    sources:
      - label: National Academies report page
        url: https://nap.nationalacademies.org/catalog/25246
