# Canonical list of policies / programs compared across models.
#
# Each program is a discrete tax or benefit rule-set. Statutes use bluebook
# citation style.
#
# Fiscal scale is split by direction of money flow:
#   annualOutlaysUsd: government spending (benefit programs, refundable
#                     tax credits paid out as refunds)
#   annualRevenueUsd: government receipts (income tax, payroll tax,
#                     tariffs, estate/gift tax)
# Values are rough order-of-magnitude latest-available-year figures and
# are for context only. Every program row carries `sources` citing the
# statute and the fiscal figure.

programs:
  # ----------------------------- US federal taxes -----------------------------
  - id: us-federal-income-tax
    name: Federal individual income tax
    fullName: Federal individual income tax
    jurisdiction: us-federal
    agency: IRS
    type: income-tax
    statute: 26 USC §§ 1-59B
    annualRevenueUsd: 2_200_000_000_000
    affectedUnits: ~155M tax units
    asOfYear: 2025
    sources:
      - label: 26 USC subtitle A — Income Taxes
        url: https://uscode.house.gov/browse/prelim@title26/subtitleA&edition=prelim
        kind: government
      - label: CBO Monthly Budget Review — individual income tax receipts
        url: https://www.cbo.gov/topics/budget/monthly-budget-review
        kind: government

  - id: us-payroll-tax
    name: Federal payroll taxes
    fullName: FICA, SECA, FUTA
    jurisdiction: us-federal
    agency: IRS / SSA
    type: payroll-tax
    statute: 26 USC §§ 3101-3128, 3301-3311
    annualRevenueUsd: 1_700_000_000_000
    affectedUnits: ~170M workers
    asOfYear: 2025
