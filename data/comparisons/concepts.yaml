# Comparable methodology concepts.
#
# These IDs decouple the comparison from any one model's internal variable
# names. Each concept is a question we can ask of every model: how do you
# determine SNAP participation? How do you impute capital gains? How do you
# age the dataset forward to the budget year? The answers (Imputation rows)
# get grouped by concept in the UI so contributors can see model methods
# side by side.

concepts:
  # ---------------- Participation / take-up imputations -------------------
  - id: snap-participation
    name: SNAP participation imputation
    description: >
      Determining which CPS/ACS units that are simulated-eligible for SNAP
      actually receive benefits. Critical because measured eligibility
      exceeds measured participation, and the gap varies by state, family
      type, and over time.
    category: imputation
    program: us-snap

  - id: tanf-participation
    name: TANF participation imputation
    description: >
      Assigning TANF receipt to eligible families given the wide variation
      across state rules and the very low national take-up rate (~20% of
      eligible families nationally).
    category: imputation
    program: us-tanf

  - id: ssi-participation
    name: SSI participation imputation
    description: >
      Assigning SSI receipt to eligible individuals given disability
      determination is not directly observable in survey microdata.
    category: imputation
    program: us-ssi

  - id: medicaid-participation
    name: Medicaid participation imputation
    description: >
      Assigning Medicaid coverage to eligible individuals, especially for
      categorical-eligibility programs (e.g. waivers, pregnancy, age
      groups) that survey data only partially captures.
    category: imputation
    program: us-medicaid

  - id: chip-participation
    name: CHIP participation imputation
    description: >
      Assigning CHIP coverage to eligible children or pregnant people,
      including cases where Medicaid and CHIP eligibility interact and
      survey respondents may not distinguish Medicaid from CHIP coverage.
    category: imputation
    program: us-chip

  - id: aca-ptc-participation
    name: ACA marketplace / PTC take-up imputation
    description: >
      Assigning marketplace coverage and premium tax credit claiming to
      eligible tax units. This affects whether the tax unit receives ACA
      PTC values and whether members are treated as marketplace covered.
    category: imputation
    program: us-premium-tax-credit

  - id: eitc-claiming
    name: EITC claiming imputation
    description: >
      Assigning whether eligible tax units claim the EITC and file the
      federal return needed to receive it. This is distinct from EITC
      statutory eligibility because many otherwise eligible nonfilers or
      low-income filers do not claim.
    category: imputation
    program: us-eitc

  - id: dc-ptc-claiming
    name: DC property tax credit claiming imputation
    description: >
      Assigning whether eligible District of Columbia tax units claim the
      local property tax credit. Included as a model-specific claiming
      gate even though it is narrower than the federal programs in the
      main comparison matrix.
    category: imputation

  - id: wic-participation
    name: WIC participation imputation
    description: >
      Assigning WIC claiming and related eligibility inputs such as
      nutritional risk for otherwise eligible pregnant people, postpartum
      or breastfeeding people, infants, and children.
    category: imputation
    program: us-wic

  - id: head-start-participation
    name: Head Start participation imputation
    description: >
      Assigning Head Start enrollment among eligible children when survey
      microdata do not observe participation directly.
    category: imputation

  - id: early-head-start-participation
    name: Early Head Start participation imputation
    description: >
      Assigning Early Head Start enrollment among eligible infants and
      toddlers when survey microdata do not observe participation
      directly.
    category: imputation

  - id: voluntary-tax-filing
    name: Voluntary tax filing imputation
    description: >
      Assigning whether a tax unit files a return even when not legally
      required and not filing to claim a refundable credit. This affects
      tax liability and credit receipt for low-income nonrequired filers.
    category: imputation

  - id: child-care-subsidy-participation
    name: Child care subsidy participation imputation
    description: >
      Assigning CCDF receipt to eligible families given the program is
      heavily rationed (only ~15% of eligible children served nationally).
    category: imputation
    program: us-ccdf

  # ------------------- Tax variable imputations ----------------------------
  - id: capital-gains
    name: Capital gains imputation
    description: >
      Imputing realized capital gains, which are top-coded or absent in
      survey microdata. Models typically statistically match to SOI PUF
      records or condition on AGI bins.
    category: imputation

  - id: itemized-deductions
    name: Itemized deductions imputation
    description: >
      Imputing the components of itemized deductions (mortgage interest,
      SALT paid, charitable contributions) onto survey microdata.
    category: imputation

  - id: retirement-income
    name: Retirement income imputation
    description: >
      Imputing taxable vs nontaxable portions of pension, IRA, and Social
      Security income onto survey microdata.
    category: imputation

  # ---------------- Calibration / aging --------------------------------------
  - id: dataset-aging
    name: Dataset aging to budget year
    description: >
      Projecting a base-year microdata file forward to the target budget
      year — typically via per-cell or per-record growth factors tied to
      a baseline forecast (CBO, Treasury, or in-house).
    category: calibration

  - id: aggregate-calibration
    name: Aggregate-total calibration
    description: >
      Reconciling simulated program totals (caseloads, outlays, revenues)
      to administrative or scorekeeper totals. Methods include caseload-
      driven selection, reweighting, or post-hoc scaling.
    category: calibration

  # ============================================================================
  # Supplemental Poverty Measure (SPM) — one concept per atomic methodology
  # choice. Census publishes annual SPM Research File imputations for each
  # of these components; models can take Census's imputed values, compute
  # the component from their own rules, or use a hybrid (compute when
  # simulating a reform that affects the component, otherwise use Census).
  # ============================================================================

  - id: spm-unit-definition
    name: SPM unit definition
    description: >
      How the family/resource-sharing unit is constructed for SPM
      calculations (cohabitors, foster children, unmarried partners,
      etc.). Census defines the SPM unit more broadly than the Census
      family; models can adopt Census's definition or implement their
      own.
    category: spm

  - id: spm-thresholds
    name: SPM thresholds
    description: >
      Determining the poverty threshold for each SPM unit. Census
      publishes thresholds annually keyed to housing tenure (owner with
      mortgage, owner without mortgage, renter), geographic area, and
      family composition. Models typically adopt Census thresholds
      verbatim because they reflect consumer-expenditure-based amounts
      that don't depend on policy parameters.
    category: spm

  - id: spm-cash-income
    name: SPM resources — cash income
    description: >
      The cash income component of SPM resources (earnings, interest,
      dividends, retirement income, etc.). Almost universally taken as
      survey-reported from CPS-ASEC or ACS.
    category: spm

  - id: spm-eitc
    name: SPM resources — EITC
    description: >
      The refundable Earned Income Tax Credit value added to SPM
      resources. Census uses its own tax model imputation; tax-rules
      models can compute EITC from their own EITC rules.
    category: spm

  - id: spm-ctc
    name: SPM resources — CTC (refundable portion)
    description: >
      The refundable portion of the Child Tax Credit added to SPM
      resources.
    category: spm

  - id: spm-snap
    name: SPM resources — SNAP
    description: >
      SNAP benefit value added to SPM resources. Census imputes from
      administrative SNAP totals; rules-engine models compute from
      eligibility and benefit formulae.
    category: spm

  - id: spm-housing-subsidy
    name: SPM resources — housing subsidy
    description: >
      Imputed value of HUD housing assistance (Section 8 vouchers,
      public housing, project-based subsidies) added to SPM resources.
    category: spm

  - id: spm-liheap
    name: SPM resources — LIHEAP / energy assistance
    description: >
      Value of LIHEAP energy assistance added to SPM resources.
    category: spm

  - id: spm-wic
    name: SPM resources — WIC
    description: >
      Imputed value of WIC nutrition benefits added to SPM resources.
    category: spm

  - id: spm-school-meals
    name: SPM resources — school meals
    description: >
      Imputed value of free or reduced-price school meals added to SPM
      resources.
    category: spm

  - id: spm-tax-federal
    name: SPM deduction — federal income tax
    description: >
      Federal income tax (before refundable credits) subtracted from SPM
      resources. Census imputes via its tax model; rules-engine models
      compute from their own tax rules.
    category: spm

  - id: spm-tax-payroll
    name: SPM deduction — payroll tax (employee side)
    description: >
      FICA employee-side payroll tax subtracted from SPM resources.
    category: spm

  - id: spm-tax-state
    name: SPM deduction — state income tax
    description: >
      State income tax subtracted from SPM resources. Census imputes via
      TAXSIM or equivalent; state-rules models compute from their own
      state tax rules.
    category: spm

  - id: spm-work-expenses
    name: SPM deduction — work-related expenses
    description: >
      Work-related expenses subtracted from SPM resources for each
      working adult. Census uses a fixed schedule (median weekly amount
      from SIPP capped by earnings); models can replicate this or
      implement an alternative.
    category: spm

  - id: spm-child-care-expenses
    name: SPM deduction — child care expenses
    description: >
      Out-of-pocket child care expenses subtracted from SPM resources.
      Imputed from survey-reported amounts.
    category: spm

  - id: spm-medical-oop
    name: SPM deduction — medical out-of-pocket (MOOP)
    description: >
      Medical out-of-pocket expenses subtracted from SPM resources.
      Census imputes from CPS / MEPS-derived measures.
    category: spm

  - id: spm-child-support-paid
    name: SPM deduction — child support paid
    description: >
      Court-ordered child support paid subtracted from SPM resources
      (paid by the payer, added to the SPM unit of the receiver).
    category: spm

  - id: spm-poverty-rate
    name: SPM poverty rate (final output)
    description: >
      The final SPM poverty rate — share of population with SPM
      resources below the SPM threshold, after all pluses and minuses.
      All decisions on the previous components compose into this output.
    category: spm
