# Coverage matrix: (model × program) -> status + metadata.
#
# When a model does not cover a program, prefer 'not-implemented' over 'unknown'
# only when you have direct confirmation that it is excluded from scope. Default
# to 'unknown' otherwise; a thin row with a citation is better than a guess.

coverage:
  # ============================ PolicyEngine US ===============================
  - model: policyengine-us
    program: us-federal-income-tax
    status: implemented
    parametersModeled: unknown
    statuteTraceable: yes
    testCoverage: high
    docsUrl: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/parameters/gov/irs
    asOfYear: 2026
    sources:
      - label: policyengine_us IRS parameters
        url: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/parameters/gov/irs

  - model: policyengine-us
    program: us-payroll-tax
    status: implemented
    statuteTraceable: yes
    testCoverage: high
    docsUrl: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/variables/gov/irs/tax/payroll
    asOfYear: 2026
    sources:
      - label: policyengine_us payroll variables
        url: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/variables/gov/irs/tax/payroll

  - model: policyengine-us
