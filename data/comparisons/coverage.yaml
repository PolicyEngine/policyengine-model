  # ============================ IGOTM ========================================
  - model: igotm
    program: uk-income-tax
    status: implemented
    statuteTraceable: unknown
    testCoverage: unknown
    asOfYear: 2025
    notes: >
      IGOTM underpins HM Treasury's Budget distributional analysis of
      tax and benefit reforms, including personal-tax measures.
    sources:
      - label: HM Treasury — Impact on households distributional analysis (Budget 2025)
        url: https://www.gov.uk/government/publications/supporting-documents-for-budget-2025
        kind: government

  - model: igotm
    program: uk-national-insurance
    status: implemented
    statuteTraceable: unknown
    testCoverage: unknown
    asOfYear: 2025
    notes: >
      National Insurance is part of the direct-tax side of Treasury's
      distributional tax-benefit analysis, but public implementation
      detail is limited.
    sources:
      - label: HM Treasury — Impact on households distributional analysis (Budget 2025)
        url: https://www.gov.uk/government/publications/supporting-documents-for-budget-2025
        kind: government

  - model: igotm
    program: uk-council-tax
    status: partial
    statuteTraceable: unknown
    testCoverage: unknown
    asOfYear: 2025
    notes: >
      Council Tax can enter household distributional analysis, but
      local tax rules and Council Tax Reduction schemes are not exposed
      in public IGOTM documentation.
    sources:
      - label: HM Treasury — Impact on households distributional analysis (Budget 2025)
        url: https://www.gov.uk/government/publications/supporting-documents-for-budget-2025
        kind: government

  - model: igotm
    program: uk-vat
    status: implemented
    statuteTraceable: unknown
    testCoverage: unknown
    asOfYear: 2025
    notes: >
      IGOTM is LCF-based and used for fiscal-event distributional
      analysis that includes indirect tax measures such as VAT.
    sources:
      - label: HM Treasury — Impact on households distributional analysis (Budget 2025)
        url: https://www.gov.uk/government/publications/supporting-documents-for-budget-2025
        kind: government

  - model: igotm
    program: uk-universal-credit
    status: implemented
    statuteTraceable: unknown
    testCoverage: unknown
    asOfYear: 2025
    notes: >
      Welfare measures are included in Treasury distributional analysis;
      detailed Universal Credit rules are shared across the
      HMT-DWP-HMRC modeling toolchain rather than published as IGOTM
      source code.
    sources:
      - label: Office for Budget Responsibility — Welfare trends report (HMT/DWP microsimulation toolchain)
        url: https://obr.uk/docs/dlm_uploads/Welfare-trends-report-October-2024.pdf
        kind: government

  - model: igotm
    program: uk-housing-benefit
    status: partial
    statuteTraceable: unknown
    testCoverage: unknown
    asOfYear: 2025
    notes: >
      Housing Benefit enters household-income analysis, but legacy
      caseload and local-rent details are not separately documented in
      public IGOTM materials.
    sources:
      - label: Office for Budget Responsibility — Welfare trends report (HMT/DWP microsimulation toolchain)
        url: https://obr.uk/docs/dlm_uploads/Welfare-trends-report-October-2024.pdf
        kind: government

  - model: igotm
    program: uk-pension-credit
    status: implemented
    statuteTraceable: unknown
    testCoverage: unknown
    asOfYear: 2025
