        url: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/variables/gov/hud

  - model: policyengine-us
    program: us-ssdi
    status: partial
    statuteTraceable: partial
    testCoverage: low
    asOfYear: 2024
    notes: SSDI benefits treated as exogenous income; benefit determination not modeled.
    sources:
      - label: Repository search for SSDI
        url: https://github.com/PolicyEngine/policyengine-us/search?q=ssdi

  - model: policyengine-us
    program: us-oasi
    status: partial
    statuteTraceable: partial
    testCoverage: low
    asOfYear: 2024
    notes: OASI benefits treated as exogenous income; PIA/AIME computation not modeled in detail.
    sources:
      - label: Social Security variables
        url: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/variables/gov/ssa

  - model: policyengine-us
    program: us-ui
    status: partial
    statuteTraceable: partial
    testCoverage: low
    asOfYear: 2024
    notes: UI benefits treated as exogenous income; eligibility not modeled.
    sources:
      - label: UI variables
        url: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/variables/gov/states/unemployment_compensation.py

  - model: policyengine-us
    program: us-liheap
    status: implemented
    statuteTraceable: yes
    testCoverage: medium
    asOfYear: 2025
    sources:
      - label: LIHEAP variables
        url: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/parameters/gov/hhs/liheap

  - model: policyengine-us
    program: us-ccdf
    status: implemented
    statuteTraceable: yes
    testCoverage: medium
    asOfYear: 2025
    notes: >
      Federal CCDF eligibility, copay, and subsidy formulas
      implemented at gov/hhs/ccdf. Seven state programs have
      detailed implementations: CalWORKs Childcare (CA), CCAP (CO),
      CCAP (IL — eligibility only), CCFA (MA), CCSP (DC), SCCA (NC),
      and CCS (TX); states without a state-specific implementation
      fall back to federal defaults plus the state SMI parameters.
      Take-up is not currently calibrated to administrative
      caseloads (see imputations.yaml) — simulated CCDF receipt
      equals simulated CCDF eligibility, which overstates actual
      enrolment.
    sources:
      - label: CCDF variables (federal)
        url: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/variables/gov/hhs/ccdf
      - label: CA CalWORKs child care
        url: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/parameters/gov/states/ca/cdss/tanf/child_care
      - label: CO CCAP
        url: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/parameters/gov/states/co/ccap
      - label: IL CCAP
        url: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/parameters/gov/states/il/dhs/ccap
      - label: DC CCSP
        url: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/parameters/gov/states/dc

  - model: policyengine-us
    program: us-state-income-tax
    status: implemented
    statuteTraceable: yes
    testCoverage: high
    asOfYear: 2025
    notes: All 41 income-taxing states + DC implemented.
    sources:
      - label: State tax parameters
        url: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/parameters/gov/states

  - model: policyengine-us
    program: us-state-eitc
    status: implemented
    statuteTraceable: yes
    testCoverage: high
    asOfYear: 2025
    notes: 31 state EITCs + DC.
    sources:
      - label: State EITC variables
        url: https://github.com/PolicyEngine/policyengine-us/search?q=state+eitc

  - model: policyengine-us
