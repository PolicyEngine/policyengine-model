    status: implemented
    statuteTraceable: yes
    testCoverage: medium
    asOfYear: 2025
    notes: 15 state CTCs + DC.
    sources:
      - label: State CTC search
        url: https://github.com/PolicyEngine/policyengine-us/search?q=state+ctc

