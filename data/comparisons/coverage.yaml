    testCoverage: medium
    docsUrl: https://github.com/Budget-Lab-Yale/Tax-Simulator
    asOfYear: 2026
    notes: >
      Federal individual income tax with ordinary rates, preferred rates
      (qualified dividends/long-term capital gains), AMT, and NIIT.
      Implementation in R with YAML parameter files.
    sources:
      - label: Budget Lab Tax-Simulator README (federal individual income tax scope)
        url: https://github.com/Budget-Lab-Yale/Tax-Simulator/blob/main/README.md
        kind: self
