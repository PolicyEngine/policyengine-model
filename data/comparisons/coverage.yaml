  - model: policyengine-us
    program: us-premium-tax-credit
    status: implemented
    statuteTraceable: yes
    testCoverage: high
    asOfYear: 2025
    sources:
      - label: PTC variables
        url: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/variables/gov/aca/ptc

  - model: policyengine-us
    program: us-estate-tax
    status: not-implemented
    statuteTraceable: no
    testCoverage: none
    asOfYear: unknown
    notes: Not covered. PolicyEngine focuses on annual income tax + transfers.
    sources:
      - label: Repository search (no estate-tax variables)
        url: https://github.com/PolicyEngine/policyengine-us/search?q=estate+tax

  - model: policyengine-us
    program: us-tariffs
    status: not-implemented
    statuteTraceable: no
    testCoverage: none
    asOfYear: unknown
    notes: >
      No public tariff/customs-duty variable or tariff-incidence reform is
      present in the policyengine-us tree; prior citation pointed to USDA
