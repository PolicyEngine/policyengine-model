        url: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/variables/gov/irs/credits/ctc

  - model: policyengine-us
    program: us-cdcc
    status: implemented
    statuteTraceable: yes
    testCoverage: high
    asOfYear: 2025
    sources:
      - label: CDCC variables
