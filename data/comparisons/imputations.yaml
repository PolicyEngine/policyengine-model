  - model: policyengine-us
    concept: dataset-aging
    method: other
    description: >
      The default Microcosm US 2024 release is a 2024 file. For later years,
      policyengine-us computes each stored input with its uprating parameter: for
      example, wages grow with an IRS SOI employment income series extended by CBO's
      income-by-source projections, and household weights grow with CBO's population
      projection. policyengine.py writes these uprated inputs to one file per year.
      Within the 2024 build, earlier-year dollar targets are aged to 2024 before
      calibration, mostly by IRS SOI tax year 2023 growth chained with CBO's 2024
      projection of AGI or wages; count targets are not aged.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    calibrationTargets:
      - CBO income-by-source and population projections (uprating parameters)
