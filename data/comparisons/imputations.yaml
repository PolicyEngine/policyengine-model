  # ----------------------------- Cash income ----------------------------------
  - model: policyengine-us
    concept: spm-cash-income
    method: other
    description: >
      The build duplicates each CPS ASEC household into a survey copy and a
      tax-detail copy, each with half its weight. The released file keeps 22,200
      survey copies and 35,040 tax-detail copies (9,963 households keep both), and
      calibration then sets all weights. Survey copies keep ASEC-reported wages, self-employment, interest, dividends, rents,
      pensions, Social Security and unemployment compensation, with fixed splits where
      the ASEC reports only a total: 68% of interest taxable, 44.8% of dividends
      qualified, 59% of pensions and annuities taxable and 88% of capital gains long
      term. Tax-detail copies replace tax-return items (wages, self-employment,
      interest, dividends, capital gains, taxable pensions and IRA distributions,
      Social Security, rents, partnership and S corporation income, and others) with
      draws from the weighted QRF trained on the IRS 2015 PUF uprated to 2024. The
      source files lack person-level survivor benefits and financial assistance, so
      those resource components are zero.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
