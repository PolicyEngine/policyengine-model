        kind: self
      - label: PolicyEngine US 2.2.1 capped work and child care expenses
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/household/expense/childcare/spm_unit_capped_work_childcare_expenses.py
        kind: self
      - label: Census Bureau SPM technical documentation
        url: https://www2.census.gov/programs-surveys/supplemental-poverty-measure/technical-documentation/spm_techdoc.pdf
        kind: government

  - model: trim3
