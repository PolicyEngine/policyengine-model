  # ----------------------------- LIHEAP ---------------------------------------
  - model: policyengine-us
    concept: spm-liheap
    method: survey-reported
    description: >
      policyengine-us 2.2.1 adds the input `spm_unit_energy_subsidy` to SPM resources
      rather than computing energy assistance from program rules. In the default
      Microcosm US 2024 release that input is the ASEC SPM energy subsidy
      (`SPM_ENGVAL`) on survey copies and a weighted QRF imputation trained on ASEC
      on tax-detail copies; policyengine-us uprates it by CPI-U for later years.
      Household weights are calibrated to the number of households LIHEAP served in
      fiscal year 2024 (one national target from HHS ACF).
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    calibrationTargets:
      - HHS ACF LIHEAP FY2024 households served, national
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
    reproducible: yes
