  # ----------------------------- Housing subsidy ------------------------------
  - model: policyengine-us
    concept: spm-housing-subsidy
    method: rule-based
    description: >
      policyengine-us 2.2.1 computes HUD's housing assistance payment (the lesser of
      the maximum subsidy and gross rent minus total tenant payment) for SPM units
      that take up assistance. In the default Microcosm US 2024 release the take-up
      flag equals reported receipt on survey copies (ASEC `SPM_CAPHOUSESUB` above
      zero) and receipt imputed by a weighted QRF trained on ASEC on tax-detail copies,
      so only units flagged as receiving get a payment. SPM resources count the
      payment capped, as in Census's SPM method, at the threshold's housing portion
      minus the tenant payment.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    documentationUrl: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/household/income/spm_unit/spm_unit_capped_housing_subsidy.py
