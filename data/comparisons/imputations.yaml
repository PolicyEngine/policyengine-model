  # ============================ Retirement income =============================
  - model: policyengine-us
    concept: retirement-income
    method: other
    description: >
      On survey copies of CPS ASEC households, pensions and annuities
      (`PNSN_VAL` plus `ANN_VAL`) are split 59% taxable and 41% tax-exempt, and
      retirement account distributions follow the ASEC account codes: 401(k), 403(b),
      regular IRA and SEP distributions are taxable, Roth IRA distributions are
      tax-exempt, and Keogh distributions are carried separately. Social Security is
      split into retirement, disability, survivor and dependent benefits from the
      ASEC's reason codes. On tax-detail copies, taxable pensions,
      taxable IRA distributions and the Social Security components come from the
      weighted QRF trained on the uprated IRS 2015 PUF, and 401(k), 403(b), Keogh and
      SEP distributions from weighted QRFs trained on the ASEC. Before calibration,
      the build rescales each Social Security component so its weighted total equals
      SSA's 2024 total for that benefit type. policyengine-us computes the taxable
      share of Social Security. Household weights are calibrated
      to IRS SOI taxable pensions, IRA distributions and Social Security (tax year
      2022 by state, tax year 2023 nationally) and SSA 2024 benefit totals by type.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    calibrationTargets:
      - IRS SOI TY2022 taxable pensions, IRA distributions and Social Security, national and 51 states (amounts aged to 2024)
      - IRS SOI TY2023 Tables 1.4 and 2.1 taxable pensions, IRA distributions and Social Security, national
      - SSA 2024 OASDI benefit totals (retirement, disability, survivors, dependents)
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
