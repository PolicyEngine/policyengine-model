  # ----------------------------- Medical OOP ----------------------------------
  - model: policyengine-us
    concept: spm-medical-oop
    method: survey-reported
    description: >
      Medical out-of-pocket spending adds ASEC-reported other medical expenses
      (`PMED_VAL`) and over-the-counter spending (`POTC_VAL`) to premiums. Premiums
      policyengine-us 2.2.1 computes for Marketplace coverage net of the premium tax
      credit, CHIP, Medicaid, Medicare Parts A and B and the Part D income-related
      surcharge are modeled; the remaining premium input is the ASEC premium total
      (`PHIP_VAL`) net of the modeled Marketplace, CHIP and Medicaid premiums, imputed
      with a weighted QRF trained on ASEC on tax-detail copies.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
