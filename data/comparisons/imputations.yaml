# Methodology comparisons grouped by concept.
#
# Each row pairs one model with one concept (from concepts.yaml) and
# describes how that model handles it. The UI groups rows by concept so a
# reader can compare side-by-side: "how does PolicyEngine US do SNAP
# participation? How does TRIM3? How does ATTIS?"

imputations:
  # ============================ SNAP participation ============================
  - model: policyengine-us
    concept: snap-participation
    method: caseload-driven
    description: >
      PolicyEngine US computes SNAP eligibility and benefits from program rules and
      pays them only to SPM units whose `takes_up_snap_if_eligible` flag is true. In
      the default Microcosm US 2024 release, every unit that reported SNAP in the CPS
      ASEC (`SPM_SNAPSUB` above zero) takes up. Other units draw against a state rate
      (USDA FNS fiscal year 2024 average monthly SNAP households over the state's
      weighted modeled-eligible units), and eligible non-reporting units are then
      added or dropped in draw order until each state's weighted count of taking-up
      units matches the FNS count at the build's starting weights. Where the FNS
      count exceeds modeled eligibility, every eligible unit takes up. This state
      assignment replaces an earlier national fill at FNS's 82% participation rate.
      Household weights are then calibrated to FNS fiscal year 2024 SNAP benefits
      and average monthly households, nationally and for every state.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    calibrationTargets:
      - USDA FNS FY2024 SNAP benefits, national and 51 state totals
      - USDA FNS FY2024 average monthly SNAP households, national and 51 states
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
    reproducible: yes
    sources:
      - label: Microcosm SNAP state take-up stage (cae8640)
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us_runtime/snap_state_take_up.py#L225-L300
        kind: self
      - label: Microcosm greedy count calibration of take-up flags
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us_runtime/source_runtime.py#L451-L629
        kind: self
      - label: Microcosm national SNAP take-up stage
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us_runtime/snap_take_up.py#L161-L237
        kind: self
      - label: Microcosm source stages (snap_take_up, snap_state_take_up)
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
        kind: self
      - label: Default release calibration diagnostics
        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-spm-20260915/releases/populace-us-2024-spm-20260915/calibration_diagnostics.json
        kind: self
      - label: PolicyEngine US 2.2.1 SNAP formula
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/gov/usda/snap/snap.py
        kind: self
      - label: USDA FNS SNAP state participation and benefit data (FY2024)
        url: https://www.fns.usda.gov/sites/default/files/resource-files/snap-zip-fy69tocurrent-6.zip
        kind: government

  - model: trim3
    concept: snap-participation
    method: caseload-driven
    description: >
      TRIM3 simulates monthly SNAP eligibility and benefits, always
      includes eligible true CPS reporters in the baseline caseload, and
      selects other eligible units by comparing participation
      probabilities to program-specific random numbers. Probabilities
      vary by unit type, benefit level, state, and citizenship; the
      baseline is aligned to administrative caseload targets.
    baseDataset: CPS-ASEC
    calibrationTargets:
      - administrative caseload by state
      - caseload composition by unit type, benefit band, and citizenship
    documentationUrl: https://boreas.urban.org/documentation/foodstamps/main.php
    reproducible: no
    sources:
      - label: TRIM3 SNAP methodology
        url: https://boreas.urban.org/documentation/foodstamps/main.php
        kind: self
      - label: National Academies — TRIM3 technical specification
        url: https://www.ncbi.nlm.nih.gov/books/NBK547352/
        kind: government
      - label: Wheaton & Tran (Urban) — SNAP anti-poverty effects
        url: https://www.urban.org/research/publication/antipoverty-effects-supplemental-nutrition-assistance-program
        kind: self

  - model: attis
    concept: snap-participation
    method: caseload-driven
    description: >
      Documented as similar to TRIM3 (caseload-aligned), applied to ACS
      data. Specific imputation logic not public.
    baseDataset: American Community Survey
    reproducible: no
    sources:
      - label: ATTIS overview
        url: https://www.urban.org/research-methods/attis-microsimulation-model
        kind: self

  # ============================ Capital gains =================================
  - model: policyengine-us
    concept: capital-gains
    method: machine-learning
    description: >
      The default Microcosm US 2024 release holds survey copies and tax-detail copies
      of CPS ASEC households. On survey copies, ASEC-reported capital gains (`CAP_VAL`)
      are split 88% long term and 12% short term. On tax-detail copies, short-term,
      long-term, collectibles and non-Schedule D gains are drawn from a chained,
      weighted quantile regression forest (QRF) trained on the IRS 2015 Public Use
      File uprated to 2024, conditioned on the copy's filing status, tax-unit size,
      wages, self-employment income, interest, dividends and survey capital gains.
      Before calibration, capital gain distributions reported directly on Form 1040
      are rescaled to the IRS SOI tax year 2023 Table 1.4 total. Household weights are
      calibrated to IRS SOI net capital
      gains (tax year 2022 by state, aged to 2024; tax year 2023 nationally), SOI
      capital gain distributions and CBO's 2024 net capital gain projection.
      Rebuilding the file requires the PUF, which the build reads from a non-public
      artifact.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    calibrationTargets:
      - IRS SOI TY2022 net capital gains, amount and returns, 51 states (aged to 2024)
      - IRS SOI TY2023 Table 1.4 net capital gains and capital gain distributions, national
      - CBO February 2026 projection of 2024 net capital gains
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
    reproducible: partial
    sources:
      - label: Microcosm PUF tax-detail predictors and outputs
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us_runtime/puf_support.py#L112-L180
        kind: self
      - label: Microcosm support-copy construction
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us_runtime/puf_support.py#L433-L501
        kind: self
      - label: Microcosm ASEC capital gains split
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us_runtime/cps_carried.py#L26-L29
        kind: self
      - label: Microcosm pre-calibration distribution rescale
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/tools/build_us_fiscal_refresh_release.py#L5062-L5130
        kind: self
      - label: Microcosm weighted QRF
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-fit/src/populace/fit/qrf.py#L1-L38
        kind: self
      - label: Microcosm source stages (puf_tax_detail, capital_gain_distributions)
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
        kind: self
      - label: Default release calibration diagnostics
        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-spm-20260915/releases/populace-us-2024-spm-20260915/calibration_diagnostics.json
        kind: self
      - label: IRS SOI individual public use microdata files
        url: https://www.irs.gov/statistics/soi-tax-stats-individual-public-use-microdata-files
        kind: government
      - label: IRS SOI Publication 1304 Table 1.4 (TY2023)
        url: https://www.irs.gov/pub/irs-soi/23in14ar.xls
        kind: government

  - model: tpc-microsim
    concept: capital-gains
    method: statistical-matching
    description: >
      The SOI Public Use File is the tax-return base. CPS-ASEC records are
      matched in for demographics and nonfilers, while wealth/unrealized
      gains inputs come from SCF-style matching. Realized capital-gains
      tax-return variables are aged forward to CBO/SOI targets rather than
      imputed from SOI onto a CPS base.
    baseDataset: SOI Public Use File + CPS-ASEC
    calibrationTargets:
      - CBO revenue baseline
      - SOI tax-return tabulations
    documentationUrl: https://www.taxpolicycenter.org/resources/brief-description-tax-model
    reproducible: no
    sources:
      - label: TPC Brief Description
        url: https://www.taxpolicycenter.org/resources/brief-description-tax-model
        kind: self

  # ============================ TANF participation ============================
  - model: policyengine-us
    concept: tanf-participation
    method: parameterized-take-up
    description: >
      PolicyEngine US multiplies state TANF cash benefits by `takes_up_tanf_if_eligible`.
      In the default Microcosm US 2024 release each SPM unit gets a seeded draw, keyed
      to its survey identity so both copies of a household agree, and takes up when the
      draw falls below 21.9%, the HHS ASPE TRIM3-based TANF participation rate among
      eligible families for 2022. Reported TANF receipt is not used as an anchor.
      Household weights are calibrated to HHS ACF fiscal year 2024 TANF basic
      assistance spending nationally and for 22 states.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    calibrationTargets:
      - HHS ACF FY2024 TANF basic assistance (federal and MOE funds), national and 22 states
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
    reproducible: yes
    sources:
      - label: Microcosm take-up seeding (TANF, EITC)
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us_runtime/take_up.py#L224-L283
        kind: self
      - label: Microcosm take-up contract (TANF rate and source)
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/take_up_contract.json
        kind: self
      - label: Default release calibration diagnostics
        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-spm-20260915/releases/populace-us-2024-spm-20260915/calibration_diagnostics.json
        kind: self
      - label: PolicyEngine US 2.2.1 TANF formula
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/gov/hhs/tanf/cash/tanf.py
        kind: self
      - label: HHS ASPE 24th Welfare Indicators report (Table 10)
        url: https://aspe.hhs.gov/sites/default/files/documents/0cfb67b2619c9f7ef4fd40b14a5d4da7/24th%20Welfare%20Indicators%20Report%20to%20Congress.pdf
        kind: government
      - label: HHS ACF FY2024 TANF and MOE financial data
        url: https://acf.gov/ofa/data/tanf-financial-data-fy-2024
        kind: government

  - model: trim3
    concept: tanf-participation
    method: caseload-driven
    description: >
      TRIM3 computes monthly TANF eligibility, potential benefits, and
      participation under detailed state rules. Participation uses a
      monthly probit function with benefit, family-head, child,
      employment, disability, and state-status predictors; baseline
      probabilities and random numbers are adjusted so true reporters
      are included and the caseload matches administrative targets.
    baseDataset: CPS-ASEC
    calibrationTargets:
      - administrative TANF caseload size
      - caseload composition by state and unit type
    documentationUrl: https://boreas.urban.org/documentation/TANF/Main.php
    reproducible: no
    sources:
      - label: TRIM3 TANF methodology
        url: https://boreas.urban.org/documentation/TANF/Main.php
        kind: self
      - label: National Academies — TRIM3 technical specification
        url: https://www.ncbi.nlm.nih.gov/books/NBK547352/
        kind: government

  # ============================ SSI participation =============================
  - model: policyengine-us
    concept: ssi-participation
    method: caseload-driven
    description: >
      PolicyEngine US pays SSI only to people whose `takes_up_ssi_if_eligible` flag is
      true. In the default Microcosm US 2024 release, every person who reported SSI in
      the CPS ASEC (`SSI_VAL` above zero) takes up. Every other person draws once
      against an age-band prior (under 18, 18 to 64, 65 and over) derived from SSA's
      December 2024 count of people receiving a federal SSI payment, and the decision
      is shared by a person's survey and tax-detail copies. Household weights are calibrated to
      those three SSA age-band counts and to SSA 2024 SSI recipients and payments by
      state. The release's SSI diagnostics show the under-18 band saturated: about
      177,000 weighted recipients against SSA's 1.0 million.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    calibrationTargets:
      - SSA December 2024 SSI recipients with a federal payment, three age bands
      - SSA 2024 SSI recipients and payments, 51 states
      - SSA 2024 total SSI payments, national
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
    reproducible: yes
    sources:
      - label: Microcosm SSI take-up stage
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us_runtime/ssi_take_up.py#L506-L531
        kind: self
      - label: Microcosm take-up contract (SSI)
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/take_up_contract.json
        kind: self
      - label: Calibrating build's SSI take-up diagnostics
        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-buildp-sparse-rmloss100-cae8640-20260728T011454Z/releases/populace-us-2024-buildp-sparse-rmloss100-cae8640-20260728T011454Z/us_ssi_take_up.json
        kind: self
      - label: Default release calibration diagnostics
        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-spm-20260915/releases/populace-us-2024-spm-20260915/calibration_diagnostics.json
        kind: self
      - label: PolicyEngine US 2.2.1 SSI formula
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/gov/ssa/ssi/ssi.py
        kind: self
      - label: SSA SSI Monthly Statistics, December 2024, Table 1
        url: https://www.ssa.gov/policy/docs/statcomps/ssi_monthly/2024-12/table01.html
        kind: government
      - label: SSA Annual Statistical Supplement 2025, Table 7.B1
        url: https://www.ssa.gov/policy/docs/statcomps/supplement/2025/7b.html
        kind: government

  - model: trim3
    concept: ssi-participation
    method: caseload-driven
    description: >
      TRIM3 simulates monthly SSI eligibility and benefits, then makes an
      annual participation decision for eligible units. Eligible true CPS
      reporters participate in the baseline; other eligible units are
      selected with participation probabilities by unit type, federal
      benefit category, state, and citizenship, with random numbers
      constrained for likely correct nonreporters.
    baseDataset: CPS-ASEC
    calibrationTargets:
      - administrative SSI caseload and benefits
      - caseload composition by benefit level, state, and citizenship
    documentationUrl: https://boreas.urban.org/documentation/SSI/Main.php
    reproducible: no
    sources:
      - label: TRIM3 SSI methodology
        url: https://boreas.urban.org/documentation/SSI/Main.php
        kind: self
      - label: National Academies — TRIM3 technical specification
        url: https://www.ncbi.nlm.nih.gov/books/NBK547352/
        kind: government

  # ============================ Medicaid participation ========================
  - model: policyengine-us
    concept: medicaid-participation
    method: caseload-driven
    description: >
      PolicyEngine US computes Medicaid eligibility by category and state rules and
      enrolls eligible people whose `takes_up_medicaid_if_eligible` flag is true. In
      the default Microcosm US 2024 release, every person who reported Medicaid
      coverage at the CPS ASEC interview takes up. Other people draw against a state
      rate (CMS December 2024 Medicaid enrollment over the state's weighted
      modeled-eligible people), and eligible non-reporting people are then added or
      dropped in draw order until each state's weighted enrollment matches the CMS
      count at the build's starting weights. Where the CMS count exceeds modeled
      eligibility, every eligible person enrolls. Rhode Island uses its November 2024
      count because CMS reports no December figure for the state. Household weights
      are then calibrated to CMS Medicaid enrollment and combined Medicaid and CHIP
      enrollment, nationally and by state.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    calibrationTargets:
      - "CMS December 2024 Medicaid enrollment, national and 51 states (Rhode Island: November 2024)"
      - CMS December 2024 Medicaid and CHIP enrollment, national and 50 states
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
    reproducible: yes
    sources:
      - label: Microcosm Medicaid take-up stage
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us_runtime/medicaid_take_up.py#L214-L340
        kind: self
      - label: Microcosm greedy count calibration of take-up flags
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us_runtime/source_runtime.py#L451-L629
        kind: self
      - label: Microcosm source stages (medicaid_take_up)
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
        kind: self
      - label: Calibrating build manifest (Rhode Island substitution)
        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-buildp-sparse-rmloss100-cae8640-20260728T011454Z/releases/populace-us-2024-buildp-sparse-rmloss100-cae8640-20260728T011454Z/build_manifest.json
        kind: self
      - label: Default release calibration diagnostics
        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-spm-20260915/releases/populace-us-2024-spm-20260915/calibration_diagnostics.json
        kind: self
      - label: PolicyEngine US 2.2.1 Medicaid enrollment formula
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/gov/hhs/medicaid/medicaid_enrolled.py
        kind: self
      - label: CMS Medicaid and CHIP enrollment data (April 2026 release)
        url: https://download.medicaid.gov/data/pi-dataset-april-2026-release.csv
        kind: government

  - model: trim3
    concept: medicaid-participation
    method: baseline-import-and-logit
    description: >
      TRIM3's MedicaidCHIP module simulates monthly eligibility by
      pathway and distinguishes eligibility from enrollment. Baseline
      enrollment comes from an out-of-model SAS enrollment decision file.
      Alternative simulations keep baseline enrollment decisions for
      people eligible in the same month in the baseline; newly eligible
      people receive logit enrollment probabilities that TRIM3 combines
      into a family-level decision. Continuous-enrollment settings then
      extend coverage under state and category-specific program rules.
    baseDataset: CPS-ASEC
    documentationUrl: https://boreas.urban.org/documentation/MedicaidCHIP/Main.php
    reproducible: no
    sources:
      - label: TRIM3 Medicaid and CHIP module
        url: https://boreas.urban.org/documentation/MedicaidCHIP/Main.php
        kind: self

  - model: attis
    concept: medicaid-participation
    method: not-modeled
    description: >
      ATTIS does not model Medicaid participation. Urban's separate
      Medicaid/CHIP Eligibility Simulation Model approximates Medicaid
      and CHIP eligibility, and HIPSM simulates Medicaid/CHIP enrollment,
      costs, and broader health coverage choices.
    baseDataset: ACS for separate Urban health models; not ATTIS
    documentationUrl: https://www.urban.org/research-methods/attis-microsimulation-model
    reproducible: no
    sources:
      - label: ATTIS canonical page
        url: https://www.urban.org/research-methods/attis-microsimulation-model
        kind: self
      - label: Urban Medicaid/CHIP Eligibility Simulation Model
        url: https://www.urban.org/research/publication/urban-institute-health-policy-centers-medicaidchip-eligibility-simulation-model
        kind: self
      - label: Urban HIPSM overview
        url: https://www.urban.org/research/data-methods/data-analysis/quantitative-data-analysis/microsimulation/health-insurance-policy-simulation-model-hipsm
        kind: self

  - model: policyengine-us
    concept: chip-participation
    method: not-modeled
    description: >
      PolicyEngine US computes CHIP eligibility through child and pregnant-person
      pathways and enrolls eligible people whose `takes_up_chip_if_eligible` flag is
      true. The default Microcosm US 2024 release does not carry that flag, so it takes
      the policyengine-us default (true) and every CHIP-eligible person enrolls.
      Microcosm's take-up contract leaves CHIP unseeded until CMS's CHIP count, which
      combines Medicaid-expansion CHIP with separate CHIP, can be split to match the
      separate CHIP the model simulates. Household weights are still calibrated to CMS
      December 2024 CHIP enrollment and combined Medicaid and CHIP enrollment.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    calibrationTargets:
      - CMS December 2024 CHIP enrollment, national and 31 states
      - CMS December 2024 Medicaid and CHIP enrollment, national and 50 states
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/take_up_contract.json
    reproducible: yes
    sources:
      - label: Microcosm take-up contract (CHIP left unseeded)
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/take_up_contract.json
        kind: self
      - label: Default release calibration diagnostics
        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-spm-20260915/releases/populace-us-2024-spm-20260915/calibration_diagnostics.json
        kind: self
      - label: PolicyEngine US 2.2.1 CHIP take-up default
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/gov/hhs/chip/takes_up_chip_if_eligible.py
        kind: self
      - label: PolicyEngine US 2.2.1 CHIP category formula
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/gov/hhs/chip/chip_category.py
        kind: self
      - label: CMS Medicaid and CHIP enrollment data (April 2026 release)
        url: https://download.medicaid.gov/data/pi-dataset-april-2026-release.csv
        kind: government

  - model: trim3
    concept: chip-participation
    method: baseline-import-and-logit
    description: >
      TRIM3 handles CHIP participation inside the same MedicaidCHIP
      enrollment system as Medicaid. The module treats Medicaid and CHIP
      survey reporters as an undifferentiated reporter group, assigns
      monthly baseline enrollment through an out-of-model file, and uses
      the alternative-run logit for newly eligible people. Public
      documentation reports CHIP child enrollment probabilities from 26%
      to 93% by age and family income, plus 58% for adult CHIP.
    baseDataset: CPS-ASEC
    documentationUrl: https://boreas.urban.org/documentation/MedicaidCHIP/Main.php
    reproducible: no
    sources:
      - label: TRIM3 Medicaid and CHIP module
        url: https://boreas.urban.org/documentation/MedicaidCHIP/Main.php
        kind: self

  - model: attis
    concept: chip-participation
    method: not-modeled
    description: >
      ATTIS does not model CHIP participation. Urban's separate
      Medicaid/CHIP Eligibility Simulation Model approximates Medicaid
      and CHIP eligibility, and HIPSM simulates Medicaid/CHIP enrollment
      and broader health coverage choices.
    baseDataset: ACS for separate Urban health models; not ATTIS
    documentationUrl: https://www.urban.org/research-methods/attis-microsimulation-model
    reproducible: no
    sources:
      - label: ATTIS canonical page
        url: https://www.urban.org/research-methods/attis-microsimulation-model
        kind: self
      - label: Urban Medicaid/CHIP Eligibility Simulation Model
        url: https://www.urban.org/research/publication/urban-institute-health-policy-centers-medicaidchip-eligibility-simulation-model
        kind: self
      - label: Urban HIPSM overview
        url: https://www.urban.org/research/data-methods/data-analysis/quantitative-data-analysis/microsimulation/health-insurance-policy-simulation-model-hipsm
        kind: self

  # ============================ ACA / PTC participation =======================
  - model: policyengine-us
    concept: aca-ptc-participation
    method: caseload-driven
    description: >
      PolicyEngine US pays the premium tax credit to eligible tax units whose
      `takes_up_aca_if_eligible` flag is true. In the default Microcosm US 2024
      release, eligible tax units with a member who reported subsidized Marketplace
      coverage at the CPS ASEC interview take up. Other eligible units draw against a
      state rate (CMS 2024 open enrollment APTC recipients over the state's weighted
      modeled-eligible tax units). The assignment is then adjusted in draw order
      toward CMS state APTC recipient counts and IRS SOI state premium tax credit
      returns and amounts. A selected-plan-to-benchmark premium ratio is also set for
      each tax unit and clipped to 0.5–1.5. Household weights are calibrated to CMS
      2024 open enrollment Marketplace enrollment and APTC recipients by state, and to
      IRS SOI tax year 2022 premium tax credit returns and amounts, nationally and by
      state.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    calibrationTargets:
      - CMS 2024 open enrollment Marketplace enrollment and APTC recipients, 51 states
      - IRS SOI TY2022 premium tax credit returns and amounts, national and 51 states (amounts aged to 2024)
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
    reproducible: yes
    sources:
