  # ============================ Aggregate calibration =========================
  - model: policyengine-us
    concept: aggregate-calibration
    method: gradient-reweighting
    description: >
      The default Microcosm US 2024 release has 57,240 households. Their starting
      weights are the build's base weights scaled to a 334.2 million-person benchmark.
      Calibration then runs 6,000 Adam steps on log household weights. The loss is
      the weighted mean, across 5,659 targets, of each target's relative error capped
      at 100%; dollar and count targets carry equal total loss weight, and within each
      a target's weight grows with the square root of its size. After every step no
      weight may exceed five times its starting value, and the household-weight total
      is held fixed. The targets are 447 national and 5,211 state statistics from
      IRS SOI, Census, CMS, SSA, USDA, HHS, CBO, JCT, BEA and the Federal Reserve,
      plus one build-internal constraint; the default has no congressional-district
      targets. 95.7% of targets end within 10%. The default release
      (populace-us-2024-spm-20260915) inherits these weights unchanged from its parent
      build.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    calibrationTargets:
      - 4,182 IRS SOI targets (state Historic Table 2, national Publication 1304 tables, filing-season statistics)
      - 936 Census population estimates by age (national and state, vintage 2024)
      - 135 CMS Medicaid and CHIP enrollment and 102 CMS Marketplace targets
      - 111 SSA, 104 USDA SNAP, 23 HHS TANF and 44 Census state income tax targets
      - 11 JCT tax expenditure, 5 CBO projection, 2 BEA and 3 other national totals
    documentationUrl: https://huggingface.co/datasets/policyengine/populace-us/tree/populace-us-2024-spm-20260915/releases/populace-us-2024-spm-20260915
    reproducible: partial
    sources:
      - label: Microcosm calibration loss and optimizer
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-calibrate/src/populace/calibrate/solve.py#L498-L860
        kind: self
      - label: Microcosm target loss weights
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/tools/build_us_fiscal_refresh_release.py#L5282-L5316
        kind: self
      - label: Default release calibration diagnostics
        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-spm-20260915/releases/populace-us-2024-spm-20260915/calibration_diagnostics.json
        kind: self
      - label: Default release build manifest (calibration inherited)
        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-spm-20260915/releases/populace-us-2024-spm-20260915/build_manifest.json
        kind: self
      - label: Calibrating build manifest (base population scale)
        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-buildp-sparse-rmloss100-cae8640-20260728T011454Z/releases/populace-us-2024-buildp-sparse-rmloss100-cae8640-20260728T011454Z/build_manifest.json
        kind: self
      - label: Census population estimates, vintage 2024 (state by age)
        url: https://www2.census.gov/programs-surveys/popest/datasets/2020-2024/state/asrh/sc-est2024-alldata6.csv
        kind: government
      - label: IRS SOI Historic Table 2 (TY2022)
        url: https://www.irs.gov/pub/irs-soi/22in55cmcsv.csv
        kind: government

  # ===========================================================================
  # Supplemental Poverty Measure (SPM) — atomic methodology rows.
  #
  # Census publishes annual SPM Research File imputations for every
  # resources component. The methodology question is per-component: does
  # each model compute that component from its own rules, take Census's
  # imputed value, or use survey-reported data unchanged?
  #
  # The pattern that emerges:
  #   - PolicyEngine US computes taxes and most program benefits from its
  #     own rules. Energy assistance and the medical, child care and child
  #     support deductions come from ASEC-reported values (imputed on the
  #     tax-detail copies of the Microcosm file).
  #   - TRIM3 and ATTIS use Census's SPM Research File as the baseline
  #     and overwrite specific components when the simulation changes
  #     them — a hybrid that anchors to Census totals on unchanged
  #     components.
  # ===========================================================================

  # ----------------------------- SPM unit definition --------------------------
  - model: policyengine-us
    concept: spm-unit-definition
    method: survey-reported
    description: >
      SPM units in the default Microcosm US 2024 release are the Census Bureau's own
      CPS ASEC SPM units: each person's unit follows the ASEC `SPM_ID`, so unit
      membership (cohabiting partners, foster children, unrelated children) is the
      one Census assigned, on both survey and tax-detail copies. For the SPM
      equivalence scale, policyengine-us 2.2.1 counts people aged 18 and over as
      adults, plus 15- to 17-year-olds flagged as independent. The release adds that
      flag (`is_spm_independent_minor_role`) from ASEC relationship fields, and with
      it reproduces Census's adult and child counts in all 59,900 SPM units.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    documentationUrl: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-spm-20260915/releases/populace-us-2024-spm-20260915/source_enrichment.json
    reproducible: yes
    sources:
