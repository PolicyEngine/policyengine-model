  # ============================ Itemized deductions ===========================
  - model: policyengine-us
    concept: itemized-deductions
    method: machine-learning
    description: >
      On tax-detail copies of CPS ASEC households, charitable cash
      and non-cash gifts, real estate taxes, home mortgage interest, investment
      interest, casualty losses and unreimbursed employee
      expenses are drawn from the weighted QRF trained on the IRS 2015 Public Use File
      uprated to 2024. Mortgage interest is then converted into first- and
      second-mortgage balances and interest using SCF 2022 mortgage debt. Survey
      copies carry none of these amounts. State and local income taxes and the
      medical expense deduction are computed by policyengine-us rules. Household
      weights are calibrated to IRS SOI itemized deductions, real estate taxes and
      medical expenses by state (tax year 2022), SOI tax year 2023 national totals
      for itemized deductions, charitable gifts, mortgage interest, interest paid and
      state and local taxes, and JCT's 2024 tax expenditure estimates for the SALT,
      mortgage interest, charitable and medical deductions. Rebuilding the file
      requires the PUF, which the build reads from a non-public artifact.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    calibrationTargets:
      - IRS SOI TY2022 itemized deductions, real estate taxes and medical expenses, national and 51 states (amounts aged to 2024)
      - IRS SOI TY2023 Tables 1.2, 2.1 and 4.3 itemized deduction totals, national
      - JCT 2024 tax expenditures for SALT, mortgage interest, charitable and medical deductions
