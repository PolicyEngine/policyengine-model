    description: >
      Child support paid is the ASEC's annual amount paid (`CHSP_VAL`) on survey
      copies and a weighted QRF imputation trained on ASEC on tax-detail copies. policyengine-us 2.2.1 subtracts it from SPM resources and uprates it
      by CPI-U for later years.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
    reproducible: yes
    sources:
      - label: Microcosm source stages (child_support_inputs)
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
        kind: self
      - label: PolicyEngine US 2.2.1 child support expense
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/household/expense/child_support/child_support_expense.py
        kind: self
      - label: PolicyEngine US 2.2.1 SPM expenses
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/household/income/spm_unit/spm_unit_spm_expenses.py
        kind: self
      - label: Census CPS ASEC
        url: https://www.census.gov/programs-surveys/cps.html
        kind: government

  - model: trim3
    concept: spm-child-support-paid
    method: census-research-file
    description: Child support paid taken from Census SPM Research File.
    baseDataset: TRIM3 augmented CPS-ASEC
    reproducible: no
    sources:
      - label: Census SPM methodology
        url: https://www2.census.gov/programs-surveys/supplemental-poverty-measure/technical-documentation/spm_techdoc.pdf
        kind: government

  # ----------------------------- Final poverty rate ---------------------------
  - model: policyengine-us
    concept: spm-poverty-rate
    method: rule-based
    description: >
      policyengine-us 2.2.1 marks an SPM unit poor when its SPM net income (market
      income plus benefits, minus taxes and SPM expenses, all computed or carried as
      the rows above describe) is below its spm-calculator threshold. Baseline and
      reform runs share the same thresholds, which depend only on year, tenure, unit
      composition and county, so a policy reform moves the poverty rate only through
      resources.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    documentationUrl: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/household/income/spm_unit/spm_unit_is_in_spm_poverty.py
    reproducible: yes
    sources:
      - label: PolicyEngine US 2.2.1 SPM poverty status
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/household/income/spm_unit/spm_unit_is_in_spm_poverty.py
        kind: self
      - label: PolicyEngine US 2.2.1 SPM net income
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/household/income/spm_unit/spm_unit_net_income.py
        kind: self
      - label: spm-calculator 1.0.0 threshold calculation
        url: https://github.com/PolicyEngine/spm-calculator/blob/37d748096cfca4ac8c6edd7601c529521524dc3c/spm_calculator/rolling_forecast.py#L569-L630
        kind: self

  - model: trim3
    concept: spm-poverty-rate
    method: rule-based
    description: >
      SPM poverty rate computed from Census thresholds and a hybrid
      resources stack (TRIM3 outputs substituted for simulated
      components, Census research file values used otherwise).
    baseDataset: TRIM3 augmented CPS-ASEC
    reproducible: no
    sources:
      - label: Giannarelli, Wheaton & Shantz — 2021 Poverty Projections (TRIM3-based)
        url: https://www.urban.org/research/publication/2021-poverty-projections
        kind: self

  - model: attis
    concept: spm-poverty-rate
    method: rule-based
    description: >
      SPM poverty rate produced for sub-state geographies using
      ATTIS-computed program values and Census SPM Research File
      values for unchanged components.
    baseDataset: ATTIS-prepared ACS
    reproducible: no
    sources:
      - label: State of the Safety Net (sub-state SPM analyses)
        url: https://www.urban.org/projects/state-safety-net
        kind: self

  - model: cbo-microsim
    concept: spm-poverty-rate
    method: rule-based
    description: >
      CBO produces poverty rate estimates as part of its distributional
      analyses of taxes and transfers; methodology details are in CBO's
      published working papers.
    baseDataset: CBO matched CPS + SOI
    reproducible: no
    sources:
      - label: CBO Distribution of Household Income
        url: https://www.cbo.gov/topic/income-distribution
        kind: government

  # ============================ Columbia CPSP SPM rows =======================
  - model: columbia-cpsp
    concept: spm-thresholds
    method: census-research-file
    description: >
      Adopts Census-published SPM thresholds; also produces anchored
      variants (threshold fixed at a base year and inflated by CPI) for
      historical trend work.
    baseDataset: CPS-ASEC
    reproducible: no
    sources:
      - label: CPSP working papers
        url: https://www.povertycenter.columbia.edu
        kind: self

  - model: columbia-cpsp
    concept: spm-tax-federal
    method: other
    description: >
      Federal income tax computed via Census ASEC tax variables for most
      CPS-ASEC analyses and via NBER TAXSIM when the underlying data
      lacks tax fields (e.g. SIPP-based volatility analyses) or when
      historical years pre-date Census's tax model.
    baseDataset: CPS-ASEC (or SIPP + TAXSIM in select analyses)
    reproducible: no
    sources:
      - label: Hamilton, Wimer, Collyer et al. — Monthly cash payments
          (SIPP + TAXSIM example)
        url: https://povertycenter.columbia.edu/sites/povertycenter.columbia.edu/files/content/Publications/Monthly-Cash-Payments-Reduce-Spells-of-Poverty-CPSP-2022.pdf
        kind: academic
      - label: NBER TAXSIM home page
        url: https://taxsim.nber.org/
        kind: academic

  - model: columbia-cpsp
    concept: spm-tax-state
    method: other
    description: >
      State income tax computed via Census ASEC variables in routine
      CPS-ASEC analyses, via NBER TAXSIM in SIPP-based or pre-1978
      historical analyses, and via Urban Institute TRIM3 adjustments in
      some safety-net analyses. CPSP does not maintain its own state-tax
      rules engine.
    baseDataset: CPS-ASEC (or SIPP + TAXSIM in select analyses)
    reproducible: no
    sources:
      - label: NBER TAXSIM (state tax modules)
        url: https://taxsim.nber.org/
        kind: academic

  - model: columbia-cpsp
    concept: spm-eitc
    method: other
    description: EITC value taken from TAXSIM output and added to SPM resources.
    baseDataset: CPS-ASEC + TAXSIM
    reproducible: no
    sources:
      - label: CPSP working papers
        url: https://www.povertycenter.columbia.edu
        kind: self

  - model: columbia-cpsp
    concept: spm-ctc
    method: rule-based
    description: >
      CTC under simulated policy scenarios — CPSP's signature use case
      during the 2021 ARPA expansion, simulating CTC under both
      pre-ARPA and ARPA rules to estimate monthly poverty impacts.
    baseDataset: CPS-ASEC
    reproducible: no
    sources:
      - label: Hamilton, Wimer, Collyer et al. — Monthly cash payments
        url: https://povertycenter.columbia.edu/sites/povertycenter.columbia.edu/files/content/Publications/Monthly-Cash-Payments-Reduce-Spells-of-Poverty-CPSP-2022.pdf
        kind: academic

  - model: columbia-cpsp
    concept: spm-snap
    method: census-research-file
    description: >
      SNAP value taken from Census SPM Research File unless the
      simulation specifically reforms SNAP.
    baseDataset: CPS-ASEC
    reproducible: no
    sources:
      - label: CPSP working papers (Census SPM baseline)
        url: https://www.povertycenter.columbia.edu
        kind: self

  - model: columbia-cpsp
    concept: spm-poverty-rate
    method: rule-based
    description: >
      SPM poverty rate computed from CPSP-modified resources (TAXSIM
      taxes, simulated reform components, Census Research File for
      unchanged components) against Census thresholds; anchored
      variants enable historical trend comparison.
    baseDataset: CPS-ASEC + TAXSIM
    reproducible: no
    sources:
      - label: National Academies — Roadmap to Reducing Child Poverty
        url: https://nap.nationalacademies.org/catalog/25246
        kind: academic
      - label: Hamilton, Wimer, Collyer et al. — Monthly cash payments
        url: https://povertycenter.columbia.edu/sites/povertycenter.columbia.edu/files/content/Publications/Monthly-Cash-Payments-Reduce-Spells-of-Poverty-CPSP-2022.pdf
        kind: academic
