        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/household/income/spm_unit/spm_unit_benefits.py
        kind: self
      - label: Default release calibration diagnostics
        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-spm-20260915/releases/populace-us-2024-spm-20260915/calibration_diagnostics.json
        kind: self
      - label: HHS ACF LIHEAP FY2024 national profile
        url: https://liheappm.acf.gov/sites/default/files/private/congress/profiles/2024/FY2024_AllStates%28National%29_Profile.pdf
        kind: government

  - model: trim3
