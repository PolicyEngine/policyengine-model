  - model: trim3
    concept: wic-participation
    method: caseload-driven
    description: >
      TRIM3 has a WIC module that simulates monthly demographic,
      income, and adjunctive eligibility, assumes otherwise eligible
      people are nutritionally at risk, and assigns family-level
      participation. True family WIC reporters participate in the
