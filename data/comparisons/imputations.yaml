  # ----------------------------- State income tax -----------------------------
  - model: policyengine-us
    concept: spm-tax-state
    method: rule-based
    description: >
      policyengine-us 2.2.1 computes state income tax from per-state rules, including
      state income bases, deductions, exemptions, rate schedules and the refundable
      and nonrefundable credits it implements, adds state use tax, and subtracts the
      sum from SPM resources.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    documentationUrl: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/household/expense/tax/spm_unit_state_tax.py
    reproducible: yes
    sources:
      - label: PolicyEngine US 2.2.1 SPM state tax
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/household/expense/tax/spm_unit_state_tax.py
        kind: self
      - label: PolicyEngine US 2.2.1 state tax parameters
        url: https://github.com/PolicyEngine/policyengine-us/tree/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/parameters/gov/states
        kind: self
      - label: PolicyEngine US 2.2.1 modeled policies
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/programs.yaml
        kind: self

  - model: trim3
    concept: spm-tax-state
    method: rule-based
    description: >
      TRIM3's StateTax module computes state income tax and substitutes it
      into SPM deductions. The module starts from Federal Tax module tax
      units and federal outputs, then applies a common state-tax
      calculation sequence with mostly state-specific settings for filing,
      income-base, deduction, exemption, bracket/rate, and credit
      dimensions. State-specific special-processing options handle rules
      that do not fit the common dimensions; documented credits include
      EITCs, child care credits, low-income credits, property tax credits,
      and selected other refundable and nonrefundable credits.
    baseDataset: TRIM3 augmented CPS-ASEC
    reproducible: no
    sources:
      - label: TRIM3 state tax module
        url: https://boreas.urban.org/documentation/StateTax/main.php
        kind: self

  - model: nber-taxsim
    concept: spm-tax-state
    method: rule-based
    description: >
      TAXSIM returns state income tax liability after credits from
      user-supplied tax-unit records, plus optional intermediate state tax
      components. It can supply the tax calculation used in an SPM
      resource stack, but it does not itself construct SPM units,
      resources, thresholds, or representative population weights.
    baseDataset: User-supplied tax-unit records
    reproducible: partial
    sources:
      - label: Internet TAXSIM35 documentation
        url: https://taxsim.nber.org/taxsim35/
        kind: self

  - model: attis
    concept: spm-tax-state
    method: rule-based
    description: >
      ATTIS simulates state income tax liabilities and credits on
      ACS-based tax units, using federal tax simulation outputs when state
      rules rely on federal return concepts. Public documentation says its
      state tax rules cover filing status, taxable income, deductions,
      exemptions, rates/brackets, and credits; it does not publish enough
      implementation detail to determine whether the state tax model is a
      shared rule table, bespoke per-state formulas, or a hybrid.
    baseDataset: ATTIS-prepared ACS
    reproducible: no
    sources:
      - label: Urban/TPC — Expanding the EITC for workers without resident children
        url: https://taxpolicycenter.org/sites/default/files/publication/157236/expanding_the_eitc_for_workers_without_resident_children_6.pdf
        kind: self
      - label: ATTIS model overview
        url: https://www.urban.org/sites/default/files/2026-03/ATTIS%20Model%20Overview.pdf
        kind: self

  # ----------------------------- Work expenses --------------------------------
  - model: policyengine-us
    concept: spm-work-expenses
    method: rule-based
    description: >
      policyengine-us 2.2.1 sets work expenses to a weekly amount (a Census SPM
      parameter) times weeks worked for each adult with earnings. Work and child care
      expenses are subtracted together, capped at the lower of the reference person's
      and their spouse's or partner's earnings (the reference person's earnings when
      there is no spouse or partner). Weeks worked are the ASEC's reported weeks on
      survey copies.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    documentationUrl: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/household/expense/childcare/spm_unit_work_expenses.py
