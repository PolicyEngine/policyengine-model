        kind: self
      - label: Microcosm support-copy construction (half weight each)
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us_runtime/puf_support.py#L433-L500
        kind: self
      - label: "Calibrating build manifest (known gaps: survivor benefits, financial assistance)"
        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-buildp-sparse-rmloss100-cae8640-20260728T011454Z/releases/populace-us-2024-buildp-sparse-rmloss100-cae8640-20260728T011454Z/build_manifest.json
        kind: self
      - label: PolicyEngine US 2.2.1 SPM benefits list
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/household/income/spm_unit/spm_unit_benefits.py
        kind: self
      - label: Census CPS ASEC
        url: https://www.census.gov/programs-surveys/cps.html
