        kind: government

  - model: policyengine-us
    concept: early-head-start-participation
    method: not-modeled
    description: >
      The default Microcosm US 2024 release does not seed
      `takes_up_early_head_start_if_eligible`, so it takes the policyengine-us default
      (true) and every eligible child under the age limit, or pregnant person, is
      counted as enrolled. Microcosm's take-up contract rejects the retired 9% NIEER
