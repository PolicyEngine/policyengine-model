  # ----------------------------- EITC (resources +) ---------------------------
  - model: policyengine-us
    concept: spm-eitc
    method: rule-based
    description: >
      policyengine-us 2.2.1 computes the EITC from its rules, gated by the seeded
      `takes_up_eitc` flag and filing (see EITC claiming). Refundable credits reach SPM
      resources through federal income tax: SPM net income subtracts each unit's
