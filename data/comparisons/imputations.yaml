        kind: government

  # ============================ Head Start participation ======================
  - model: policyengine-us
    concept: head-start-participation
    method: machine-learning
    description: >
      PolicyEngine US values Head Start for eligible children whose
      `takes_up_head_start_if_eligible` flag is true. In the default Microcosm US 2024
      release, a weighted quantile regression forest trained on December responses in
      the 2023 SIPP predicts that flag once for each child aged 3 to 5, shared by the
      child's survey and tax-detail copies; the flag is false at other ages. The SIPP item asks
      whether a preschool enrollee attends a federally sponsored program and names
      Head Start among its examples, so the label is a Head Start proxy. The default
      release has no Head Start calibration target.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
