  # ----------------------------- School meals ---------------------------------
  - model: policyengine-us
    concept: spm-school-meals
    method: rule-based
    description: >
      policyengine-us 2.2.1 places each SPM unit in a free, reduced-price or paid
      school meal tier from its income, categorical eligibility and any state
      universal free meals policy, then values the National School Lunch and School
      Breakfast Program subsidy above the paid rate per K-12 child per school day by
      state group and tier. Free and reduced-price meal values are added to SPM
      resources; the ASEC's reported school lunch value is not used.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    documentationUrl: https://github.com/PolicyEngine/policyengine-us/tree/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/gov/usda/school_meals
