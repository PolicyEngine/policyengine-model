        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-spm-20260915/releases/populace-us-2024-spm-20260915/source_enrichment.json
        kind: self
      - label: spm-calculator 1.0.0 SPM adult and child counts
        url: https://github.com/PolicyEngine/spm-calculator/blob/37d748096cfca4ac8c6edd7601c529521524dc3c/spm_calculator/policyengine_adapter.py#L326-L371
        kind: self
      - label: PolicyEngine US 2.2.1 SPM system
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/spm.py
        kind: self
      - label: Census Bureau SPM technical documentation
        url: https://www2.census.gov/programs-surveys/supplemental-poverty-measure/technical-documentation/spm_techdoc.pdf
        kind: government

  - model: trim3
    concept: spm-unit-definition
    method: census-research-file
    description: >
      Uses Census's SPM unit definition as published in the SPM
      Research File.
    baseDataset: TRIM3 augmented CPS-ASEC
    reproducible: no
    sources:
      - label: Census Bureau — SPM Research File
        url: https://www.census.gov/topics/income-poverty/supplemental-poverty-measure/data/datasets.2019.html
        kind: government

  # ----------------------------- SPM thresholds -------------------------------
  - model: policyengine-us
    concept: spm-thresholds
    method: rule-based
    description: >
      policyengine-us 2.2.1 takes SPM thresholds from the spm-calculator package
      (1.0.0). A unit's threshold is the national reference threshold for its housing
      tenure (owner with a mortgage, owner without one, renter) times the SPM
      equivalence scale for its adults and children, times a geographic adjustment for
      the SPM area its county maps to. Reference thresholds for 2022 to 2025 are the
      BLS-published values; later years come from the package's rolling forecast,
      built from Consumer Expenditure Survey and ACS data. policyengine.py 6.3.4 pins
      that forecast by content hash and selects its `ce_trend` scenario with county
      geography (2020 counties).
    baseDataset: spm-calculator 1.0.0 forecast (BLS thresholds, CE and ACS data)
    documentationUrl: https://github.com/PolicyEngine/spm-calculator/blob/37d748096cfca4ac8c6edd7601c529521524dc3c/spm_calculator/rolling_forecast.py
    reproducible: yes
