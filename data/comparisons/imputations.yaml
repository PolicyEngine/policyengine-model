  # ============================ Voluntary tax filing ==========================
  - model: policyengine-us
    concept: voluntary-tax-filing
    method: machine-learning
    description: >
      PolicyEngine US treats a tax unit as filing if it is required to file, would
      file to claim a refundable credit it is eligible for, or would file voluntarily.
      In the default Microcosm US 2024 release, `would_file_taxes_voluntarily` comes
      from a weighted quantile regression forest trained on 2023 SIPP December
      answers about whether people filed, or expected to file, a federal return. It is
      predicted once per source tax unit and shared by that unit's copies. The
      refundable-credit filing propensity is not in the file and takes its
      policyengine-us default (true). No calibration target measures filing directly.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
