        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/tools/build_us_fiscal_refresh_release.py#L2327-L2350
        kind: self
      - label: Microcosm source stages (aca_marketplace_inputs)
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
        kind: self
      - label: Default release calibration diagnostics
        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-spm-20260915/releases/populace-us-2024-spm-20260915/calibration_diagnostics.json
        kind: self
      - label: PolicyEngine US 2.2.1 ACA take-up default
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/gov/aca/takes_up_aca_if_eligible.py
        kind: self
      - label: CMS 2024 open enrollment state-level public use file
        url: https://www.cms.gov/files/zip/2024-oep-state-level-public-use-file.zip
        kind: government
      - label: IRS SOI Historic Table 2 (TY2022)
        url: https://www.irs.gov/pub/irs-soi/22in55cmcsv.csv
        kind: government

  # ============================ EITC claiming =================================
  - model: policyengine-us
    concept: eitc-claiming
    method: parameterized-take-up
    description: >
      PolicyEngine US pays the EITC only to eligible tax units whose `takes_up_eitc`
      flag is true and that file a return (they are required to, would file
      voluntarily, or would file to claim a refundable credit). In the default
      Microcosm US 2024 release, each tax unit draws once, keyed to its survey
      identity, against the IRS National Taxpayer Advocate's tax year 2016
      participation rate for its number of children: 65% with none, 86% with one, 85%
      with two and 82% with three or more, counting members under 19 as children.
      Reported EITC receipt is not used as an anchor. The file carries no
      `would_file_if_eligible_for_refundable_credit` input, so that propensity takes
      its policyengine-us default (true). Household weights are calibrated to IRS EITC
      claims and amounts by state and number of children (tax year 2022), nationally
      by AGI band and number of children (tax year 2023), and nationally by AGI band
      from filing-season statistics for tax year 2024.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    calibrationTargets:
      - IRS SOI TY2022 EITC claims and amounts by number of children, 51 states (amounts aged to 2024)
      - IRS SOI TY2023 Table 2.5 EITC returns and amounts by AGI band and number of children, national
      - IRS 2025 filing-season statistics (week 47) EITC returns and amounts by AGI band, TY2024
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
    reproducible: yes
    sources:
      - label: Microcosm take-up seeding (EITC child-count rates)
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us_runtime/take_up.py#L182-L283
        kind: self
      - label: Microcosm take-up contract (EITC rates and source)
        url: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/take_up_contract.json
        kind: self
      - label: Default release calibration diagnostics
        url: https://huggingface.co/datasets/policyengine/populace-us/blob/populace-us-2024-spm-20260915/releases/populace-us-2024-spm-20260915/calibration_diagnostics.json
        kind: self
      - label: PolicyEngine US 2.2.1 EITC formula
        url: https://github.com/PolicyEngine/policyengine-us/blob/f88982f25ee3b21f08f7f876fc059fae5a3fbe90/policyengine_us/variables/gov/irs/credits/earned_income/eitc.py
        kind: self
      - label: IRS National Taxpayer Advocate 2020 report, Vol. 3
        url: https://www.taxpayeradvocate.irs.gov/wp-content/uploads/2020/08/JRC20_Volume3.pdf
        kind: government
      - label: IRS SOI Publication 1304 Table 2.5 (TY2023)
        url: https://www.irs.gov/pub/irs-soi/23in25ic.xls
        kind: government
      - label: IRS filing season statistics, week 47 of 2025
        url: https://www.irs.gov/pub/irs-soi/25inweek47.xlsx
        kind: government

  - model: trim3
    concept: eitc-claiming
    method: rule-based
    description: >
      TRIM3 assigns EITC to all units found eligible according to
      CPS-ASEC data in the National Academies baseline specification. The
      same source notes that assigning additional units would require
      modeling noncompliant receipt or adjusting CPS earnings and family
      composition, which was outside that study's scope.
    baseDataset: CPS-ASEC
    documentationUrl: https://www.ncbi.nlm.nih.gov/books/NBK547352/
    reproducible: no
    sources:
      - label: National Academies — TRIM3 technical specification
        url: https://www.ncbi.nlm.nih.gov/books/NBK547352/
        kind: government

  # ============================ DC PTC claiming ===============================
  - model: policyengine-us
    concept: dc-ptc-claiming
    method: not-modeled
    description: >
      PolicyEngine US computes DC's property tax credit (Schedule H) and pays it to DC
      tax units whose `takes_up_dc_ptc` flag is true. The default Microcosm US 2024
      release leaves that flag unseeded, so it takes the policyengine-us default
      (true) and every eligible DC tax unit claims. Microcosm's take-up contract
      rejects the retired 32% claiming rate because it divided DC's 37,133 tax year
      2021 claims by a PolicyEngine estimate rather than an eligible population. No
      calibration target covers the credit.
