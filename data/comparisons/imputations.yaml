  # ============================ WIC participation =============================
  - model: policyengine-us
    concept: wic-participation
    method: parameterized-take-up
    description: >
      PolicyEngine US pays WIC to eligible people whose take-up input is true. The
      default Microcosm US 2024 release stores a seeded claim draw, `would_claim_wic`,
      assigned at USDA FNS calendar year 2022 coverage rates by participant category:
      45.6% for pregnant women, 68.9% for women with an infant in the family (FNS's
      all-postpartum rate, since the sources carry no breastfeeding status), 78.4% for
      infants and 46.0% for children aged 1 to 4. policyengine.py 6.3.4 maps that
      stored column onto policyengine-us 2.2.1's `takes_up_wic_if_eligible`. The
      release has no nutritional-risk input, so `is_wic_at_nutritional_risk` takes its
      default (true) for everyone in a WIC category who meets the income or categorical
      test. The default release has no WIC calibration target.
    baseDataset: Microcosm US 2024 (CPS ASEC + IRS PUF)
    documentationUrl: https://github.com/PolicyEngine/microcosm/blob/cae8640f9e65e274aea65c7916cb37b956978e32/packages/populace-build/src/populace/build/us/source_stages.json
