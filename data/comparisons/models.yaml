      - Christopher Wimer
      - Sophie Collyer
      - Megan Curran
    summary: >
      Tax-and-transfer microsimulation specialized for poverty
      measurement and reform analysis, particularly anchored SPM
      historical trends, child-poverty projections, and the monthly
      Child Tax Credit poverty trackers during the 2021 ARPA expansion.
      Tax computation is handled case by case: Census ASEC tax variables
      underpin most CPS-ASEC-based analyses; NBER's TAXSIM is used in
      SIPP-based and pre-1980 historical work; Urban Institute TRIM3
      adjustments are used for safety-net program analyses. CPSP layers
      benefit-program simulation, household-level resource accounting,
      and SPM threshold comparison on top.
