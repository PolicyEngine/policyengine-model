          (Urban Institute methodology report)
        url: https://www.urban.org/sites/default/files/publication/71226/410961-A-Primer-on-the-Dynamic-Simulation-of-Income-Model-DYNASIM-.PDF
        kind: self
        quote: >-
          DYNASIM3 is a dynamic microsimulation model designed to
          analyze the long-run distributional consequences of
          retirement and aging issues.
