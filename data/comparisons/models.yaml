    summary: >
      Urban Institute's detailed microsimulation of the US health
      insurance system. HIPSM jointly models ACA marketplace
      eligibility and enrollment, Medicaid and CHIP, employer-
      sponsored insurance, and the uninsured. Calibrated each year
      to actual Medicaid and marketplace enrollment in each state.
      Used for quick-turnaround scoring of ACA repeal/expand
      scenarios, Medicaid expansion uptake, marketplace subsidy
      generosity, and state-specific policy variants. Funded by
      Robert Wood Johnson Foundation, Commonwealth Fund, Kaiser
      Family Foundation, and others. Source code is not public.
