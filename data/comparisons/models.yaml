  - id: attis
    name: ATTIS
    organization: Urban Institute
    organizationUrl: https://www.urban.org
    siblings: [trim3, dynasim, hipsm]
    country: us
    sector: non-profit
    type: microsimulation
    jurisdictions: [us-federal, us-states, us-substate]
    inceptionYear: 2015
    license: proprietary
    codePublic: false
    languages: [unknown]
    primaryDataset: American Community Survey (ACS)
    documentationUrl: https://www.urban.org/research-methods/attis-microsimulation-model
    leads:
      - Linda Giannarelli
      - Sarah Minton
      - Laura Wheaton
    summary: >
      The Analysis of Transfers, Taxes, and Income Security model uses
      Census American Community Survey microdata to simulate major
      safety-net programs and federal and state income taxes. Designed
      for sub-state geographic analyses that the smaller CPS sample cannot
      support. Primary funding from the Robert Wood Johnson Foundation
      through Urban's From Safety Net to Solid Ground initiative; project
      funding from Annie E. Casey Foundation, David and Lucile Packard
      Foundation, and state agencies.
