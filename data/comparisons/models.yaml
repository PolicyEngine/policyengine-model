    primaryDataset: User-supplied (CPS-ASEC, SCF, custom records)
    documentationUrl: https://taxsim.nber.org/
    leads:
      - Daniel Feenberg
    summary: >
      Long-running federal and state individual income tax calculator
      maintained at NBER, written in Fortran and updated annually since
      the late 1970s. TAXSIM accepts user-supplied records of income and
      demographic characteristics and returns computed federal and state
      liabilities. The engine itself is not public; client wrappers in
      Stata, R, SAS, Python (and Julia) are widely used. Originally
      written by Amy Taylor in 1976 for charitable-giving research
      [Feldstein and Taylor, 1976] and given its present form by Daniel
      Frisch for corporate-personal tax integration analysis [Feldstein
      and Frisch, 1977]. Over a thousand academic papers cite the
      Feenberg & Coutts (1993) reference paper.
