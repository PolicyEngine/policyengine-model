  - id: columbia-cpsp
    name: Columbia CPSP poverty microsim
    organization: Center on Poverty and Social Policy at Columbia University
    organizationUrl: https://www.povertycenter.columbia.edu
    country: us
    sector: academic
    type: microsimulation
    jurisdictions: [us-federal, us-states]
    inceptionYear: 2015
    license: proprietary
    codePublic: false
    languages: [Stata, R]
    primaryDataset: CPS-ASEC with CPSP-specific imputations
    documentationUrl: https://www.povertycenter.columbia.edu
    leads:
      - Christopher Wimer
      - Sophie Collyer
      - Megan Curran
    summary: >
      Tax-and-transfer microsimulation specialized for poverty
      measurement and reform analysis, particularly anchored SPM
      historical trends, child-poverty projections (e.g. the National
      Academies child poverty roadmap), and the monthly Child Tax
      Credit poverty trackers during the 2021 ARPA expansion. Tax
      computation is typically delegated to NBER's TAXSIM rather than
      being implemented internally; CPSP layers benefit-program
      simulation, household-level resource accounting, and SPM
      threshold comparison on top.
    capabilities:
      reformImpact: yes
      integratedMicrodata: yes
      localAreas: partial
      publicInterface: no
      apiAccess: no
    sources:
      - label: Center on Poverty and Social Policy at Columbia University
        url: https://www.povertycenter.columbia.edu
        kind: self
      - label: Hamilton, Wimer, Collyer et al. (2022) — Monthly cash payments
          reduce spells of poverty (CPSP working paper)
        url: https://povertycenter.columbia.edu/sites/povertycenter.columbia.edu/files/content/Publications/Monthly-Cash-Payments-Reduce-Spells-of-Poverty-CPSP-2022.pdf
        kind: academic
        quote: >
          We use the Current Population Survey Annual Social and
          Economic Supplement and TAXSIM to estimate the policy impact.
