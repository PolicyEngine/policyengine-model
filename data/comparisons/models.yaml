      early 2000s to score Social Security solvency, CBOLT now
      underpins The Long-Term Budget Outlook, the annual Long-Term
      Projections for Social Security, and Social Security Policy
      Options. Combines demographic, microsimulation, long-term
      budget, and policy-growth components. Source code is not
      public; the 2018 working paper publication 53667 provides an
      authoritative model overview.
