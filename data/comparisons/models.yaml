  - id: dynasim
    name: DYNASIM3
    organization: Urban Institute
    organizationUrl: https://www.urban.org
    siblings: [trim3, attis, hipsm]
    country: us
    sector: non-profit
    type: microsimulation
    jurisdictions: [us-federal]
    inceptionYear: 1976
    license: proprietary
    codePublic: false
    languages: [unknown]
    primaryDataset: Survey of Income and Program Participation (SIPP) panels matched to administrative earnings
    documentationUrl: https://www.urban.org/research/data-methods/data-analysis/quantitative-data-analysis/microsimulation/dynamic-simulation-income-model-dynasim
    leads:
      - Melissa Favreault
      - Karen Smith
      - Damir Cosic
    summary: >
      The Dynamic Simulation of Income Model (DYNASIM3) is Urban
      Institute's dynamic, lifecycle microsimulation of retirement
      income, aging, and intergenerational wealth. Unlike Urban's
      annual cross-sectional models (TRIM3, ATTIS), DYNASIM3 ages
      a representative starting sample year by year, simulating
      demographic events (births, deaths, marriages, divorces) and
      economic events (earnings, hours, disability onset,
      retirement) decades into the future. Used extensively under
      HHS/ASPE and SSA funding to project Social Security
      benefits, long-term care need and financing, and lifetime
      economic risk. Source code is not public.
    capabilities:
      reformImpact: yes
      integratedMicrodata: partial
      localAreas: no
      publicInterface: no
      apiAccess: no
    sources:
      - label: DYNASIM model overview (Urban Institute)
        url: https://www.urban.org/research/data-methods/data-analysis/quantitative-data-analysis/microsimulation/dynamic-simulation-income-model-dynasim
