    documentationUrl: https://www.gov.uk/government/publications/supporting-documents-for-spring-statement-2025/impact-on-households-distributional-analysis-to-accompany-spring-statement-2025
    summary: >
      The Intra-Governmental Tax and Benefit Microsimulation Model is
      HM Treasury's official microsimulation tool for assessing the
      distributional impact of UK tax and benefit reforms at fiscal
      events. IGOTM is the basis for Treasury's published "Impact on
      Households" annex that accompanies each Budget. Per HMT's
      methodology, IGOTM is underpinned by the ONS Living Costs and
      Food Survey. The model is shared across UK government
      departments (Treasury, HMRC, DWP) under information-sharing
      arrangements; code, parameters, and prepared microdata are not
      public.
    capabilities:
