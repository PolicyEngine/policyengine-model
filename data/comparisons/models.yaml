  - id: itep-microsim
    name: ITEP microsim
    organization: Institute on Taxation and Economic Policy
    organizationUrl: https://itep.org
    country: us
    sector: non-profit
    type: microsimulation
    jurisdictions: [us-federal, us-states]
    inceptionYear: 1996
    license: proprietary
    codePublic: false
    languages: [unknown]
    primaryDataset: IRS Public Use File + ACS PUMS + multi-survey
      imputations (BLS CEX, SIPP, PSID, SCF); aged via CBO/IRS targets
    documentationUrl: https://itep.org/who-pays-7th-edition-methodology-and-discussion/
    leads:
      - Carl Davis
      - Erika Frankel
      - Matt Gardner
    summary: >
      The ITEP Microsimulation Tax Model estimates federal, state, and
      local tax incidence and revenue. Distinguishing capability is
      comprehensive state-and-local coverage including personal income,
      sales/excise, and property taxes for every state and DC; the
      "Who Pays?" series (7th edition, 2024) is the canonical analysis
      of state tax progressivity. Federal estate/gift, customs duties,
      and federal excise are estimated off-model and folded into
      distributional totals. Model code, parameters, and the SOI-PUF-
      derived microdata are not public.
    capabilities:
      reformImpact: yes
      integratedMicrodata: no
      localAreas: no
      publicInterface: no
      apiAccess: no
    sources:
      - label: ITEP Tax Microsimulation Model Overview
        url: https://itep.org/itep-tax-model/
        kind: self
      - label: ITEP Microsimulation Tax Model methodology (Who Pays? 7th edition)
