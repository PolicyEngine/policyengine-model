    documentationUrl: https://www.entitledto.co.uk/help/default.aspx
    leads:
      - Phil Agulnik
      - Steve Gibson
    summary: >
      A UK benefits entitlement calculator covering means-tested and
      contribution-based benefits including Universal Credit, legacy
      benefits, tax credits, Housing Benefit, Council Tax Reduction,
      Carer's Allowance, and pension-age benefits. EntitledTo is
      offered as a free public calculator (with a fair-use limit) and
      as a paid product for advisers, local authorities, housing
      associations, and other organisations. It is a per-claimant
      rules engine rather than a population microsimulation: there is
      no FRS-based weighting and the system answers eligibility and
      entitlement for an individual household given user inputs.
      Recommended on GOV.UK alongside Turn2us and Policy in Practice.
