  - id: igotm
    name: IGOTM
    organization: HM Treasury
    organizationUrl: https://www.gov.uk/government/organisations/hm-treasury
    country: uk
    sector: government
    type: microsimulation
    jurisdictions: [uk]
    inceptionYear: unknown
    license: proprietary
    codePublic: false
