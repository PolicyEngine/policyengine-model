  - model: ukmod
    metric: housing-benefit-expenditure
    program: uk-housing-benefit
    year: 2023
    targetValue: 15_773_000_000
    predictedValue: 10_005_000_000
    units: gbp
    targetSource:
      label: DWP benefit expenditure tables (UKMOD Country Report Table 4.6, official estimates column)
      url: https://www.iser.essex.ac.uk/wp-content/uploads/files/working-papers/cempa/cempa8-26.pdf
      kind: government
    predictedSource:
      label: CeMPA WP 8/26 — UKMOD Country Report 2023-2030, Table 4.6
      url: https://www.iser.essex.ac.uk/wp-content/uploads/files/working-papers/cempa/cempa8-26.pdf
      kind: academic
    notes: >
      UKMOD substantially understates Housing Benefit: simulated
      expenditure (£10,005m) was about £5.8bn below the official figure
      (£15,773m), a 37% shortfall the report attributes to FRS
      under-representation of Housing Benefit recipients. Included as a
      documented case where a model diverges materially from
      administrative data.

  - model: ukmod
    metric: income-tax-revenue-non-devolved
    program: uk-income-tax
    year: 2023
    targetValue: 277_419_000_000
    predictedValue: 239_662_000_000
    units: gbp
    targetSource:
      label: HMRC income tax liabilities statistics (UKMOD Country Report Table 4.6, official estimates column)
      url: https://www.iser.essex.ac.uk/wp-content/uploads/files/working-papers/cempa/cempa8-26.pdf
      kind: government
    predictedSource:
      label: CeMPA WP 8/26 — UKMOD Country Report 2023-2030, Table 4.6
      url: https://www.iser.essex.ac.uk/wp-content/uploads/files/working-papers/cempa/cempa8-26.pdf
      kind: academic
    notes: >
      UKMOD-simulated non-devolved income tax revenue (£239,662m) was
      13.6% below the HMRC figure (£277,419m); the report attributes the
      gap to FRS under-capture of top incomes.
