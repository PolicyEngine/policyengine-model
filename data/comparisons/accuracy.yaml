  - model: ukmod
    metric: pension-credit-expenditure
    program: uk-pension-credit
    year: 2023
    targetValue: 5_467_000_000
    predictedValue: 5_350_000_000
    units: gbp
    targetSource:
      label: DWP benefit expenditure tables (UKMOD Country Report Table 4.6, official estimates column)
      url: https://www.iser.essex.ac.uk/wp-content/uploads/files/working-papers/cempa/cempa8-26.pdf
      kind: government
    predictedSource:
      label: CeMPA WP 8/26 — UKMOD Country Report 2023-2030, Table 4.6
      url: https://www.iser.essex.ac.uk/wp-content/uploads/files/working-papers/cempa/cempa8-26.pdf
      kind: academic
    notes: >
      UKMOD-simulated Pension Credit expenditure (£5,350m) was 2.1% below
