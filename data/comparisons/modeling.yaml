# Atomic modeling mechanics by model.
#
# These rows capture concrete methodological details that are too granular for
# models.yaml summaries: simulation unit, base microdata, aging/uprating,
# take-up modeling, macro linkage, dynamic lifecycle events, and model
# architecture. Add one row per cited detail rather than expanding prose
# summaries.

modeling:
  - model: policyengine-us
    category: architecture
    label: Formula graph on policyengine-core
    detail: >
      Computes policy variables as period-indexed formulas over PolicyEngine
      entities, with parameters stored separately as date-indexed YAML.
    scope: tax-benefit rules
    sources:
      - label: policyengine-us documentation
        url: https://policyengine.github.io/policyengine-us/
        kind: self
      - label: policyengine-us repository
        url: https://github.com/PolicyEngine/policyengine-us
        kind: self

  - model: policyengine-us
    category: data-enhancement
    label: Enhanced CPS with tax and benefit imputations
    detail: >
      Starts from CPS-ASEC, imputes missing tax and benefit variables, and
      calibrates weights/participation so simulated totals align with
      administrative targets.
    scope: US population microdata
    sources:
      - label: PolicyEngine US Data repository
        url: https://github.com/PolicyEngine/policyengine-us-data
        kind: self

  - model: policyengine-us
    category: take-up
    label: Seeded take-up priors before calibration
    detail: >
      Enhanced CPS construction assigns take-up and claiming gates for
      SNAP, ACA/PTC, DC PTC, Head Start, Early Head Start, housing
      assistance, SSI, Medicaid, TANF, EITC, WIC, WIC nutritional
      risk, and voluntary tax filing. Priors are external-rate tables;
      SNAP, SSI, ACA, and Medicaid preserve available
      reported-recipient or coverage anchors. CCDF is not currently
      seeded — simulated CCDF receipt equals simulated CCDF
      eligibility.
    scope: Enhanced CPS program participation and claiming inputs
    sources:
      - label: policyengine-us-data CPS take-up assignment
        url: https://github.com/PolicyEngine/policyengine-us-data/blob/main/policyengine_us_data/datasets/cps/cps.py
        kind: self
      - label: policyengine-us-data take-up parameters
        url: https://github.com/PolicyEngine/policyengine-us-data/tree/main/policyengine_us_data/parameters/take_up
        kind: self
      - label: policyengine-us-data take-up helpers
        url: https://github.com/PolicyEngine/policyengine-us-data/blob/main/policyengine_us_data/datasets/cps/takeup.py
        kind: self

  - model: policyengine-us
    category: calibration
    label: Take-up targets recomputed in the calibration matrix
    detail: >
      For take-up-affected targets, PolicyEngine US Data computes
      eligible target values with all relevant gates open, then applies
      block-level seeded take-up draws while building calibration matrix
      entries. L0 reweighting then determines the final weighted
      population totals against administrative targets; WIC and EITC are
      also constrained through target totals even when their gates are not
      in the shared rerandomized target list.
    scope: SNAP, ACA/PTC, Medicaid, TANF, SSI, selected tax and benefit targets
    sources:
      - label: policyengine-us-data take-up target mapping
        url: https://github.com/PolicyEngine/policyengine-us-data/blob/main/policyengine_us_data/utils/takeup.py
        kind: self
      - label: policyengine-us-data unified matrix builder
        url: https://github.com/PolicyEngine/policyengine-us-data/blob/main/policyengine_us_data/calibration/unified_matrix_builder.py
        kind: self
      - label: policyengine-us-data calibration target config
        url: https://github.com/PolicyEngine/policyengine-us-data/blob/main/policyengine_us_data/calibration/target_config.yaml
        kind: self

  - model: policyengine-us
    category: tax-modeling
    label: Open state income tax formula graph
    detail: >
      PolicyEngine computes state individual income tax inside the same
      household tax-benefit simulation as federal taxes and transfers. The
      public rule set covers income-taxing states and DC with
      state-specific filing treatment, income-base definitions,
      deductions, exemptions, rate schedules, and refundable and
      nonrefundable credits where PolicyEngine implements them;
      PolicyEngine uses comparable TAXSIM-style outputs for validation.
    scope: state individual income tax
    sources:
      - label: PolicyEngine US modeled policies metadata
        url: https://github.com/PolicyEngine/policyengine-us/blob/main/policyengine_us/programs.yaml
        kind: self
      - label: PolicyEngine US state tax parameters
        url: https://github.com/PolicyEngine/policyengine-us/tree/main/policyengine_us/parameters/gov/states
        kind: self
      - label: PolicyEngine US validation against TAXSIM
        url: https://policyengine.github.io/policyengine-us/validation/taxsim.html
        kind: self

  - model: policyengine-us
    category: health-insurance
    label: Annual Medicaid and CHIP formula graph
    detail: >
      PolicyEngine models Medicaid and CHIP as person-level annual
      formula graphs. Medicaid assigns one category by precedence, tests
      immigration status, work requirements, selected state-funded
      coverage, and take-up, and values enrolled people with
      state-by-group per-capita costs. CHIP runs separate child and
      pregnant-person pathways, excludes Medicaid-eligible children and
      child applicants with employer-sponsored insurance, applies a CHIP
      take-up gate, and values enrolled people with state per-capita CHIP
      spending. PolicyEngine does not model month-by-month Medicaid/CHIP
      eligibility spells or continuous enrollment.
    scope: Medicaid and CHIP eligibility, enrollment, and per-capita costs
    sources:
      - label: PolicyEngine US Medicaid eligibility category formula
        url: https://github.com/PolicyEngine/policyengine-us/blob/main/policyengine_us/variables/gov/hhs/medicaid/eligibility/categories/medicaid_category.py
        kind: self
      - label: PolicyEngine US Medicaid enrollment formula
        url: https://github.com/PolicyEngine/policyengine-us/blob/main/policyengine_us/variables/gov/hhs/medicaid/medicaid_enrolled.py
        kind: self
      - label: PolicyEngine US CHIP category formula
        url: https://github.com/PolicyEngine/policyengine-us/blob/main/policyengine_us/variables/gov/hhs/chip/chip_category.py
        kind: self
      - label: PolicyEngine US CHIP take-up formula
        url: https://github.com/PolicyEngine/policyengine-us/blob/main/policyengine_us/variables/gov/hhs/chip/takes_up_chip_if_eligible.py
        kind: self

  - model: policyengine-us
    category: health-insurance
    label: Medicaid/CHIP eligibility pathways covered
    detail: >
      PolicyEngine's Medicaid pathway inventory covers SSI recipients,
      infants, young children, older children, pregnant people,
      parents/caretaker relatives, optional young adults ages 19-20,
      ACA expansion adults, and optional senior or disabled people. The
      overall eligibility gate then checks immigration status, optional
      work requirements, and selected state-funded coverage outside the
      federal categorical graph. CHIP covers child eligibility, standard
      pregnant-person eligibility, and FCEP pregnant-person eligibility;
      child CHIP also checks state CHIP availability, Medicaid
      ineligibility, immigration status, family income, and employer
      coverage. PolicyEngine does not separately model Title IV-E foster
      care, medically needy spenddown, Medicare Savings Programs, or
      month-by-month continuous enrollment pathways.
    scope: Medicaid and CHIP eligibility categories
    sources:
      - label: PolicyEngine US Medicaid category formula
        url: https://github.com/PolicyEngine/policyengine-us/blob/main/policyengine_us/variables/gov/hhs/medicaid/eligibility/categories/medicaid_category.py
        kind: self
      - label: PolicyEngine US overall Medicaid eligibility formula
        url: https://github.com/PolicyEngine/policyengine-us/blob/main/policyengine_us/variables/gov/hhs/medicaid/eligibility/is_medicaid_eligible.py
        kind: self
      - label: PolicyEngine US CHIP category formula
        url: https://github.com/PolicyEngine/policyengine-us/blob/main/policyengine_us/variables/gov/hhs/chip/chip_category.py
        kind: self
      - label: PolicyEngine US CHIP child eligibility formula
        url: https://github.com/PolicyEngine/policyengine-us/blob/main/policyengine_us/variables/gov/hhs/chip/is_chip_eligible_child.py
        kind: self

  - model: policyengine-us
    category: documentation
    label: Implementation-documented open formula graph
    detail: >
      PolicyEngine exposes executable formulas, date-indexed parameters,
      package documentation, test files, validation pages, and flowchart
      links for variables. A reader can inspect rule mechanics at the
      implementation level rather than reconstructing them from papers.
    scope: public code, parameters, tests, docs, and validation
    sources:
      - label: PolicyEngine US documentation
        url: https://policyengine.github.io/policyengine-us/
        kind: self
      - label: PolicyEngine US repository
        url: https://github.com/PolicyEngine/policyengine-us
        kind: self
      - label: PolicyEngine US TAXSIM validation
        url: https://policyengine.github.io/policyengine-us/validation/taxsim.html
        kind: self

  - model: policyengine-uk
    category: geography
    label: Local authority and parliamentary constituency weights
    detail: >
      PolicyEngine UK Data publishes calibrated household weights for
      local authorities and Westminster parliamentary constituencies,
      produced by the same gradient-based reweighting pipeline as the
      national weights, enabling constituency-level analysis of budgets
      and reforms.
    scope: sub-national analysis
    sources:
      - label: PolicyEngine UK Data repository (local-area calibration)
        url: https://github.com/PolicyEngine/policyengine-uk-data
        kind: self
      - label: PolicyEngine UK Data documentation
        url: https://policyengine.github.io/policyengine-uk-data/
        kind: self

  - model: policyengine-uk
    category: validation
    label: Public test suite and aggregate validation
    detail: >
      A public YAML test suite of 1,084 named cases runs on every merged
      change, and documentation compares simulated tax and benefit
      aggregates against HMRC, DWP, and OBR statistics.
    scope: rules engine outputs
    sources:
      - label: policyengine-uk test tree
        url: https://github.com/PolicyEngine/policyengine-uk/tree/master/policyengine_uk/tests
        kind: self
      - label: PolicyEngine UK documentation
        url: https://policyengine.github.io/policyengine-uk/
        kind: self

  - model: trim3
    category: architecture
    label: Program modules on CPS-ASEC
    detail: >
      Static microsimulation model with separate tax and transfer modules.
      Eligibility is simulated from CPS-ASEC records and selected benefits
      are aligned to administrative caseloads.
    scope: US tax and transfer programs
    sources:
      - label: TRIM3 Programs Simulated
        url: https://boreas.urban.org/T3IntroPrograms.php
        kind: self
      - label: Zedlewski (Urban) — TRIM, A Tool for Social Policy Analysis
        url: https://www.urban.org/sites/default/files/publication/82921/2000878-TRIM-A-Tool-for-Social-Policy-Analysis.pdf
        kind: self

  - model: trim3
    category: tax-modeling
    label: Rule-table StateTax module after federal tax simulation
    detail: >
      TRIM3's StateTax module simulates state income tax liability only,
      not other state taxes. It starts from potential tax units and
      federal tax outputs that the Federal Tax module creates, then runs a
      common calculation sequence that program rules control. The module
      uses some national rules and mostly state-specific settings for
      filing status, income base, deductions, exemptions, rates and
      brackets, and credits. TRIM3 encodes those categories as common rule
      dimensions.
      When those dimensions cannot capture a state law, the module invokes
      named special-processing options for particular states or rule
      groups. Credits include EITCs, child care credits, low-income
      credits, property tax credits, and selected other credits, with
      refundable credits able to produce negative final liability.
    scope: state individual income tax on TRIM3 CPS-ASEC tax units
    sources:
      - label: TRIM3 StateTax module overview
        url: https://boreas.urban.org/documentation/StateTax/main.php
        kind: self
      - label: TRIM3 technical documentation index
        url: https://boreas.urban.org/T3Technical.php
        kind: self

  - model: trim3
    category: take-up
    label: Caseload-aligned participation
    detail: >
      For benefit programs, TRIM3 generally determines eligibility and
      potential benefits first, then selects eligible people or families
      into receipt. True CPS reporters are included when eligible, while
      nonreporters are selected probabilistically so baseline caseloads
      come close to administrative size and composition targets.
    scope: means-tested transfers
    sources:
      - label: TRIM3 baseline simulation overview
        url: https://boreas.urban.org/T3IntroBaselines.php
        kind: self
      - label: National Academies — TRIM3 technical specification
        url: https://www.ncbi.nlm.nih.gov/books/NBK547352/
        kind: government

  - model: trim3
    category: take-up
    label: SNAP reporter and correct-response participation
    detail: >
      TRIM3's SNAP module can model annual or monthly participation.
      Baseline participation preserves eligible true reporters, constrains
      likely correct nonreporters out of receipt, and uses participation
      probabilities by unit type and benefit level with state and
      citizenship adjustments.
    scope: SNAP / FoodStamps module
    sources:
      - label: TRIM3 SNAP methodology
        url: https://boreas.urban.org/documentation/foodstamps/main.php
        kind: self

  - model: trim3
    category: take-up
    label: Medicaid alternative-run enrollment logit
    detail: >
      TRIM3's MedicaidCHIP baseline enrollment process runs outside the
      module and imports monthly enrollment decisions as out-of-model
      results. Alternative simulations keep baseline decisions for people
      eligible in the same month in the baseline. For newly eligible
      people, TRIM3 applies a documented logit equation, combines
      person-level probabilities into a family-level probability by a
      max/min/average rule, and compares that probability with a random
      number. Public documentation reports resulting probabilities such
      as 39-96% for Medicaid children, 26-93% for CHIP children, 74% for
      adult Medicaid, 58% for adult CHIP, 77-81% for disabled adults, and
      74-79% for elderly people.
    scope: Medicaid and CHIP
    sources:
      - label: TRIM3 Medicaid and CHIP enrollment methodology
        url: https://boreas.urban.org/documentation/MedicaidCHIP/Main.php
        kind: self

  - model: trim3
    category: health-insurance
    label: Monthly MedicaidCHIP eligibility and enrollment module
    detail: >
      TRIM3's MedicaidCHIP module evaluates each person in each month.
      The first eligibility pathway that qualifies a person becomes that
      month's eligibility type, so one person can qualify through
      different pathways across the year and family members can qualify
      through different pathways. The module covers noncitizen tests,
      elderly and disabled SSI-linked and poverty-linked routes,
      MAGI-based routes, medically needy eligibility, Medicare Savings
      Programs, CHIP other-coverage restrictions, annual ever-on
      eligibility/enrollment types, reporter status, pregnancy imputation,
      and continuous enrollment. It also reads inputs from AlienPrep,
      FederalTax or FedTaxImp, SSI, TANF, child support, unemployment,
      employer-sponsored insurance, and Medicare simulations.
    scope: Medicaid and CHIP eligibility, enrollment, and reporting status
    sources:
      - label: TRIM3 Medicaid and CHIP module
        url: https://boreas.urban.org/documentation/MedicaidCHIP/Main.php
        kind: self

  - model: trim3
    category: health-insurance
    label: Medicaid/CHIP eligibility pathways covered
    detail: >
      TRIM3's MedicaidCHIP module covers noncitizen eligibility tests,
      elderly and disabled SSI-related and poverty-related routes,
      MAGI-based child, pregnant, parent, and adult routes, medically
      needy eligibility, Medicare Savings Programs, CHIP, and separate
      CHIP other-coverage restrictions. It evaluates those pathways each
      month and assigns the first qualifying pathway as that month's
      eligibility type, then derives annual ever-on eligibility and
      enrollment indicators.
    scope: Medicaid and CHIP monthly eligibility pathways
    sources:
      - label: TRIM3 Medicaid and CHIP module
        url: https://boreas.urban.org/documentation/MedicaidCHIP/Main.php
        kind: self

  - model: trim3
    category: take-up
    label: WIC family-level participation
    detail: >
      TRIM3's WIC module simulates monthly eligibility, assumes
      otherwise eligible people are nutritionally at risk, and assigns
      family-level WIC participation using true-report anchors,
      state/category participation probabilities, and random numbers.
    scope: WIC supplemental food receipt/value
    sources:
      - label: TRIM3 WIC methodology
        url: https://boreas.urban.org/documentation/wic/main.php
        kind: self

  - model: trim3
    category: documentation
    label: Module manuals without public source code
    detail: >
      TRIM3 publishes program-module documentation for major tax and
      transfer modules, including calculation steps and baseline
      participation methods. The public documentation supports a detailed
      mechanical comparison, but Urban does not publish source code,
      parameter files, or a runnable validation suite.
    scope: module-level public manuals
    sources:
      - label: TRIM3 technical documentation index
        url: https://boreas.urban.org/T3Technical.php
        kind: self
      - label: TRIM3 Programs Simulated
        url: https://boreas.urban.org/T3IntroPrograms.php
        kind: self
      - label: TRIM, A Tool for Social Policy Analysis
        url: https://www.urban.org/sites/default/files/publication/82921/2000878-TRIM-A-Tool-for-Social-Policy-Analysis.pdf
        kind: self

  - model: attis
    category: base-data
    label: ACS-based state and local simulation
    detail: >
      Uses ACS microdata to estimate safety-net program eligibility and
      participation with greater state and substate geographic detail than
      CPS-based models can usually support.
    scope: US safety-net programs
    sources:
      - label: ATTIS overview
        url: https://www.urban.org/research-methods/attis-microsimulation-model
        kind: self
      - label: Urban — Methods for estimating SNAP policy impacts with ACS
        url: https://www.urban.org/sites/default/files/publication/98454/methods_for_estimating_snap_policy_impacts_with_an_acs-based_simulation_model_1.pdf
        kind: self

  - model: attis
    category: tax-modeling
    label: Detailed state tax rules with undisclosed architecture
    detail: >
      ATTIS documents detailed state income tax rules for filing status,
      taxable income, deductions, exemptions, tax rates, brackets, and
      credits; Jon Bakija compiled the state rules. ATTIS uses inputs from
      the federal tax simulation when state income taxes depend on federal
      return concepts. Public sources establish the rule dimensions and
      federal-linkage mechanics, but do not disclose whether ATTIS
      implements those rules as a TRIM-like shared rule-table system, as
      bespoke per-state formulas, or as a hybrid.
      A New York baseline memo documents state, New York City, and Yonkers
      tax rates/brackets and major credits.
    scope: state individual income tax on ACS tax units
    sources:
      - label: Urban/TPC — Expanding the EITC for workers without resident children
        url: https://taxpolicycenter.org/sites/default/files/publication/157236/expanding_the_eitc_for_workers_without_resident_children_6.pdf
        kind: self
      - label: New York child poverty baseline technical memorandum
        url: https://otda.ny.gov/news/meetings/cprac/2023-09-14/attachments/CPRAC-Urban-Institute-Baseline-Technical-Memorandum.pdf
        kind: self

  - model: attis
    category: health-insurance
    label: No Medicaid/CHIP eligibility pathways in ATTIS
    detail: >
      Public ATTIS materials list SNAP, TANF, CCDF, housing, LIHEAP, WIC,
      SSI, payroll taxes, income taxes, tax credits, child support, and
      unemployment compensation, but not Medicaid or CHIP. ATTIS therefore
      has no Medicaid/CHIP pathway inventory to compare directly.
      Urban handles Medicaid/CHIP through separate health models: MCESM
      approximates eligibility with ACS and Puerto Rico Community Survey
      records, while HIPSM simulates health coverage, Medicaid/CHIP
      enrollment, costs, marketplace coverage, and premiums.
    scope: Medicaid and CHIP excluded from ATTIS; separate Urban health models
    sources:
      - label: ATTIS canonical page
        url: https://www.urban.org/research-methods/attis-microsimulation-model
        kind: self
      - label: Urban Medicaid/CHIP Eligibility Simulation Model
        url: https://www.urban.org/research/publication/urban-institute-health-policy-centers-medicaidchip-eligibility-simulation-model
        kind: self
      - label: Urban HIPSM overview
        url: https://www.urban.org/research/data-methods/data-analysis/quantitative-data-analysis/microsimulation/health-insurance-policy-simulation-model-hipsm
        kind: self

  - model: attis
    category: documentation
    label: Overview and application memos, not a public manual
    detail: >
      Urban documents ATTIS through a canonical model page and
      application-specific papers or technical memoranda. Those sources
      identify program scope, ACS geography, selected tax mechanics, and
      some policy-scenario methods, but they do not publish a complete
      module manual, source code, rule tables, or tests.
    scope: model overview and project-specific methodology
    sources:
      - label: ATTIS canonical page
        url: https://www.urban.org/research-methods/attis-microsimulation-model
        kind: self
      - label: Urban — Methods for estimating SNAP policy impacts with ACS
        url: https://www.urban.org/sites/default/files/publication/98454/methods_for_estimating_snap_policy_impacts_with_an_acs-based_simulation_model_1.pdf
        kind: self
      - label: New York child poverty baseline technical memorandum
        url: https://otda.ny.gov/news/meetings/cprac/2023-09-14/attachments/CPRAC-Urban-Institute-Baseline-Technical-Memorandum.pdf
        kind: self

  - model: tpc-microsim
    category: base-data
    label: SOI PUF plus CPS match
    detail: >
      Uses the IRS Statistics of Income Public Use File as the primary tax
      record base and statistically matches CPS demographic and income
      information not present on tax returns.
    scope: federal tax
    sources:
      - label: TPC microsimulation model FAQ
        url: https://taxpolicycenter.org/resources/tax-model-resources/tpcs-microsimulation-model-faq
        kind: self

  - model: tpc-microsim
    category: aging-uprating
    label: Aged to future tax years
    detail: >
      Ages the tax-return/survey file forward to analysis years using
      baseline projections and tax-return tabulations before applying
      current-law or reform policy parameters.
    scope: federal tax
    sources:
      - label: TPC brief description of the tax model
        url: https://www.taxpolicycenter.org/resources/brief-description-tax-model
        kind: self

  - model: tpc-microsim
    category: tax-modeling
    label: State calculators with undisclosed internal structure
    detail: >
      TPC documents separate income tax calculators for DC and the 43
      states with income taxes. These calculators rely on the same
      database as its federal model and separate state weights. Public
      documentation does not say whether TPC implements the state
      calculators as a common rule-table system, bespoke per-state
      formulas, or a hybrid, so public materials let readers
      reverse-engineer less state-law mechanics than TRIM3's StateTax
      module or PolicyEngine's public state formula graph.
    scope: state individual income tax
    sources:
      - label: TPC brief description of the tax model
        url: https://www.taxpolicycenter.org/resources/brief-description-tax-model
        kind: self

  - model: tpc-microsim
    category: documentation
    label: Public methodology without implementation artifacts
    detail: >
      TPC publishes model descriptions, FAQs, model-estimate tables, and
      academic applications that describe architecture, data sources, and
      outputs. TPC does not publish the SAS source code, parameter files,
      or prepared SOI-CPS microdata, so public materials support
      high-level reconstruction rather than formula-level reproduction.
    scope: federal and state tax microsimulation methodology
    sources:
      - label: TPC Brief Description of the Tax Model
        url: https://www.taxpolicycenter.org/resources/brief-description-tax-model
        kind: self
      - label: TPC microsimulation model FAQ
        url: https://taxpolicycenter.org/resources/tax-model-resources/tpcs-microsimulation-model-faq
        kind: self
      - label: TPC Model Estimates page
        url: https://www.taxpolicycenter.org/model-estimates
        kind: self

  - model: jct-microsim
    category: tax-modeling
    label: Individual Tax Model for federal revenue estimates
    detail: >
      JCT's Individual Tax Model simulates federal individual income tax
      outcomes for many microeconomic agents and is used to estimate
      proposed changes to the individual income tax.
    scope: federal individual income tax
    sources:
      - label: JCT — Description of the Individual Tax Model for 2023
        url: https://www.jct.gov/publications/2023/jcx-48-23/
        kind: government

  - model: jct-microsim
    category: behavioral-response
    label: Revenue-estimating behavioral assumptions
    detail: >
      Revenue estimates incorporate taxpayer behavioral responses specified
      by JCT staff rather than simply recomputing liabilities mechanically
      on unchanged behavior.
    scope: federal tax estimates
    sources:
      - label: JCT — Revenue estimating process
        url: https://www.jct.gov/operations/revenue-estimating/
        kind: government

  - model: jct-microsim
    category: documentation
    label: Official methodology papers without public model files
    detail: >
      JCT publishes official methodology papers and revenue-estimating
      process descriptions for its federal tax models. It does not
      publish the model source code, parameter files, or restricted SOI
      tax-return inputs, so public materials identify the estimating
      framework but not runnable mechanics.
    scope: federal tax revenue-estimating methodology
    sources:
      - label: JCT — Description of the Individual Tax Model for 2023
        url: https://www.jct.gov/publications/2023/jcx-48-23/
        kind: government
      - label: JCT — Revenue estimating process
        url: https://www.jct.gov/operations/revenue-estimating/
        kind: government
      - label: JCT publications archive
        url: https://www.jct.gov/publications/
        kind: government

  - model: cbo-microsim
    category: tax-modeling
    label: Federal tax microsimulation over budget window
    detail: >
      Simulates federal individual income and payroll tax rules for a
      representative sample of tax filers in each year of the budget window.
      Health, long-term Social Security, tariff, and transfer estimates use
      other CBO models in the broader scoring system.
    scope: federal individual income and payroll tax
    sources:
      - label: CBO — An Overview of CBO's Microsimulation Tax Model
        url: https://www.cbo.gov/publication/54096
        kind: government
      - label: CBO — Advanced Models and Details
        url: https://www.cbo.gov/models/details
        kind: government

  - model: cbo-microsim
    category: documentation
    label: Public model overviews without source release
    detail: >
      CBO publishes a tax microsimulation overview, working papers, model
      pages, and distributional outputs. It does not publish the tax
      microsimulation source code, full parameter files, or prepared
      microdata, so public materials document methods more than
      implementation.
    scope: federal tax microsimulation methodology
    sources:
      - label: CBO — An Overview of CBO's Microsimulation Tax Model
        url: https://www.cbo.gov/publication/54096
        kind: government
      - label: CBO methodology working paper series
        url: https://www.cbo.gov/about/products/working-papers
        kind: government
      - label: CBO — Advanced Models and Details
        url: https://www.cbo.gov/models/details
        kind: government

  - model: itep-microsim
    category: tax-modeling
    label: Federal, state, and local tax incidence
    detail: >
      Estimates taxes paid by state residents at different income levels,
      combining income, consumption, property, business, and administrative
      data to model state and local tax incidence.
    scope: state and local tax incidence
