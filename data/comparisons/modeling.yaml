  - model: hipsm
    category: health-insurance
    label: ACA health insurance market simulation
    detail: >
      Simulates health insurance coverage, marketplace participation,
      Medicaid/CHIP enrollment, and premiums using matched survey data and
      calibration to observed Medicaid and marketplace enrollment.
    scope: health insurance coverage
    sources:
      - label: Urban HIPSM overview
        url: https://www.urban.org/research/data-methods/data-analysis/quantitative-data-analysis/microsimulation/health-insurance-policy-simulation-model-hipsm
        kind: self
