        kind: self
        supports: [datasetPublic]
      - label: Issues tab (public bug tracker)
        url: https://github.com/PolicyEngine/policyengine-us/issues
        kind: self
        supports: [issueTrackerPublic]
      - label: Ghenis & Woodruff — PolicyEngine open-source paper (JOSS)
