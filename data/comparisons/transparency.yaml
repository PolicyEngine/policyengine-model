# Transparency dimensions for each model.
#
# Sources are tagged with:
#   supports: [...] — which claims in the row the source corroborates
#                     (omit to apply to the whole row)
#   kind: ...       — source independence: self / government / academic /
#                     press / civilsociety / other
#
# A claim is well-corroborated when it has 2+ sources of distinct kinds
# (e.g. a self source plus an independent academic or government source).

transparency:
  - model: policyengine-us
    codePublic: yes
    codeLicense: AGPL-3.0-or-later
    codeUrl: https://github.com/PolicyEngine/policyengine-us
    contributorCount: unknown
    issueTrackerPublic: yes
    documentationPublic: yes
    documentationUrl: https://policyengine.github.io/policyengine-us/
    parameterSourcing: inline-cite
    testSuitePublic: yes
    testCount: unknown
    datasetPublic: yes
    datasetUrl: https://huggingface.co/policyengine
    reproducibleBuilds: yes
    notes: >
      All parameters are YAML files with inline references field pointing to
      statute, regulation, or administrative source. Tests are YAML files
      executed via the rules engine. Dataset is published on Hugging Face
      with pinned versions.
    sources:
      - label: policyengine-us repository (browse code, license file, tests directory)
        url: https://github.com/PolicyEngine/policyengine-us
        kind: self
        supports: [codePublic, issueTrackerPublic, testSuitePublic, codeLicense]
      - label: policyengine-us LICENSE file (AGPL-3.0-or-later)
        url: https://github.com/PolicyEngine/policyengine-us/blob/master/LICENSE
        kind: self
        supports: [codeLicense]
      - label: PyPI policyengine-us package (declared license)
        url: https://pypi.org/project/policyengine-us/
        kind: other
        supports: [codeLicense, codePublic]
      - label: policyengine-us documentation site
        url: https://policyengine.github.io/policyengine-us/
        kind: self
        supports: [documentationPublic, reproducibleBuilds]
      - label: Parameter file with inline statutory references field (example)
